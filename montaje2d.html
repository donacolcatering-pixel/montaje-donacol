<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3F2920">
<title>Plano de Montaje 2D · Doña Col</title>
<style>
  :root{--beige:#F5EAD8;--marron:#3F2920;--marron2:#5A3B27;--oro:#D08434;--oro-d:#b06d24;--crema:#FFFDF8;--linea:#E6D6BC;--tinta:#3a2c22;--gris:#8c7a68}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--beige);color:var(--tinta);font-size:15px}
  header{background:var(--marron);color:#f7ecdc;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--oro)}
  header img{width:40px;height:40px;border-radius:50%;background:#fbf4e7;padding:3px;object-fit:contain}
  header h1{margin:0;font-size:17px;font-family:Georgia,serif}
  header p{margin:1px 0 0;font-size:10px;color:var(--oro);text-transform:uppercase;letter-spacing:.5px}

  .barra{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--crema);border-bottom:1px solid var(--linea);flex-wrap:wrap}
  .barra label{font-size:12px;font-weight:600;color:var(--marron2)}
  .barra input{width:60px;padding:6px;border:1px solid var(--linea);border-radius:8px;font-size:15px}
  .barra .sp{flex:1}
  .barra button{border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .bPared{background:#fff;border:1px solid var(--marron2);color:var(--marron2)}
  .bPared.on{background:#222;color:#fff;border-color:#222}
  .bGuardar{background:var(--oro);color:#fff}.bLimpiar{background:#ecdcc4;color:var(--marron2)}
  .bGen{background:var(--marron2);color:#f7ecdc}
  /* Panel de montaje automatico */
  #genPanel{display:none;position:fixed;inset:auto 0 0 0;z-index:40;background:var(--crema);
    border-top:3px solid var(--oro);box-shadow:0 -8px 24px rgba(0,0,0,.22);padding:14px 16px 18px;
    max-height:78vh;overflow:auto}
  @media(min-width:760px){#genPanel{inset:auto auto 18px 18px;width:390px;border:1px solid var(--linea);
    border-top:3px solid var(--oro);border-radius:14px}}
  #genPanel .gTit{font-weight:800;color:var(--marron);margin-bottom:9px;font-size:14px}
  .gForma{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;margin-bottom:11px}
  .gOp{border:1.5px solid var(--linea);background:#fff;border-radius:10px;padding:7px 5px;cursor:pointer;text-align:center}
  .gOp.on{border-color:var(--oro);background:#fdf3e3}
  .gOp svg{display:block;margin:0 auto 4px}
  .gOp span{font-size:10.5px;font-weight:700;color:var(--marron2);line-height:1.15;display:block}
  .gLab{display:block;font-size:12px;font-weight:600;color:var(--marron2);margin:9px 0}
  .gLab input{width:78px;margin-left:7px;padding:5px 7px;border:1px solid var(--linea);border-radius:7px;font-size:13px}
  .gChk{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--tinta);margin:7px 0;line-height:1.3}
  .gBtns{display:flex;gap:8px;margin-top:12px}
  .gBtns button{flex:1;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;
    background:var(--oro);color:#fff}
  .gBtns button.sec{background:#ecdcc4;color:var(--marron2)}
  .gNota{font-size:11.5px;color:var(--gris);margin:9px 0 0;line-height:1.35}
  /* Variantes de agrupación: se ven todas y se elige, sin pensar */
  .gVariantes{display:flex;flex-direction:column;gap:6px}
  .gVar{display:flex;align-items:center;gap:9px;border:1.5px solid var(--linea);background:#fff;
    border-radius:10px;padding:7px 9px;cursor:pointer}
  .gVar.on{border-color:var(--oro);background:#fdf3e3}
  .gVar svg{flex:none}
  .gVar .vt{font-size:12px;font-weight:700;color:var(--marron2);line-height:1.2}
  .gVar .vs{font-size:10.5px;color:var(--gris);line-height:1.25;margin-top:2px;display:block}
  /* Eje central: la referencia con la que el montador cuadra la barra */
  #ejeLinea{position:absolute;top:0;width:0;border-left:2px dashed #c0413b;z-index:3;pointer-events:none;display:none}
  #ejeLinea span{position:absolute;top:4px;left:6px;font-size:11px;font-weight:800;color:#c0413b;
    background:rgba(255,255,255,.92);padding:1px 5px;border-radius:4px;white-space:nowrap}

  .paleta{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#f1e4cf;border-bottom:1px solid var(--linea)}
  .pBtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:6px 7px;min-width:54px;cursor:pointer}
  .pBtn .ic{font-size:16px;line-height:1}
  .pBtn .sw{width:22px;height:14px;border:1.5px solid;border-radius:3px}
  .pBtn .nm{font-size:8.5px;color:var(--marron2);font-weight:600;text-align:center;line-height:1.1}
  .pBtn .dim{font-size:7.5px;color:var(--gris)}
  .pBtn .badge{font-size:8.5px;font-weight:800;color:#fff;background:var(--marron2);border-radius:9px;padding:0 5px;margin-top:1px;min-width:26px;text-align:center}
  .pBtn .badge.ok{background:#4e7d3a}.pBtn .badge.over{background:#c0413b}.pBtn .badge.none{display:none}
  #invBanner{display:none;align-items:center;gap:8px;padding:7px 12px;background:#efe2cb;border-bottom:1px solid var(--linea);font-size:12px;color:var(--marron2)}
  #invBanner b{color:var(--oro-d)}
  #invBanner a{margin-left:auto;color:var(--oro-d);font-weight:700;text-decoration:none}

  .canvaswrap{position:relative}
  #lienzo{position:relative;width:100%;height:64vh;overflow:auto;background:#e7ddcd;touch-action:none}
  #mundoWrap{position:relative}
  #mundo{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;
    background-image:linear-gradient(#eee 1px,transparent 1px),linear-gradient(90deg,#eee 1px,transparent 1px);
    background-size:30px 30px;box-shadow:0 0 0 1px #ccc}
  #paredes{position:absolute;left:0;top:0;z-index:0}
  .el{position:absolute;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--marron2);background:#f3e2c4;color:var(--marron);touch-action:none;cursor:grab;
    box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .el .lbl{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:#333;white-space:nowrap;font-weight:700;background:rgba(255,255,255,.9);padding:0 3px;border-radius:3px;display:none}
  .el.sel{outline:3px solid var(--oro);outline-offset:1px}
  .el.sel .lbl{display:block}
  /* Champanera vista cenital: bol de acero con cavidad */
  .champInner{width:62%;height:62%;border-radius:50%;
    background:radial-gradient(circle at 42% 38%,#c2c8cd 0%,#8f969d 55%,#5f666d 100%);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.55), inset 0 -1px 2px rgba(255,255,255,.35)}
  /* Box de bebida vista cenital: tapa de cartón + grifo asomando */
  .cajaFlap{position:absolute;left:8%;right:8%;top:50%;height:0;border-top:1px solid rgba(0,0,0,.35)}
  .cajaFlap:before{content:'';position:absolute;left:50%;top:-50%;height:100%;border-left:1px solid rgba(0,0,0,.3)}
  .cajaGrifo{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:6px;height:5px;background:#f2f2f2;border:1px solid #888;border-radius:0 0 2px 2px}
  /* Chafing vista cenital: marco de acero + cúpula oscura roll-top */
  .chafDome{position:absolute;left:9%;right:9%;top:11%;bottom:20%;border-radius:9px;
    background:linear-gradient(180deg,#50555b 0%,#23262a 48%,#3a3f45 100%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.4)}
  .chafDome:before{content:'';position:absolute;left:16%;right:16%;top:16%;height:26%;border-radius:5px;
    background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.08))}
  /* Mini box: cartón con sobres/paletinas */
  .miniFill{position:absolute;inset:20% 9% 16%;border-radius:1px;background:repeating-linear-gradient(90deg,#f1e7d2 0 2px,#d3c19a 2px 3.4px)}
  /* Bandeja de comida: rejilla de bizcochos + logo */
  .bandFill{position:absolute;inset:10%;border-radius:2px;
    background:repeating-linear-gradient(90deg,#6e4626 0 7px,#c99a57 7px 14px),
      repeating-linear-gradient(0deg,rgba(50,25,8,.5) 0 1px,transparent 1px 7px),
      repeating-linear-gradient(90deg,rgba(50,25,8,.5) 0 1px,transparent 1px 7px)}
  .bandLogo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;height:32%;border-radius:50%;background:#e9dcc0;box-shadow:0 0 0 1px #b79b6a}
  /* Fuente de agua: jarra de cristal con agua */
  .fuenteLid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;height:42%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fbf4e7,#d7c19a);box-shadow:0 0 0 1px rgba(120,100,60,.5)}
  .fuenteHi{position:absolute;left:16%;top:13%;width:30%;height:18%;border-radius:50%;background:rgba(255,255,255,.6)}
  #marquee{position:absolute;border:1.5px dashed var(--oro);background:rgba(208,132,52,.12);display:none;z-index:60;pointer-events:none}

  #zoomctl{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:2px;background:var(--marron);border-radius:10px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #zoomctl button{border:none;background:#f7ecdc;color:var(--marron);width:32px;height:32px;border-radius:7px;font-size:16px;font-weight:800;cursor:pointer}
  #zoomctl span{color:#f7ecdc;font-size:11px;font-weight:700;min-width:40px;text-align:center}

  #tb{position:fixed;display:none;gap:6px;z-index:200;background:var(--marron);padding:6px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  #tb button{border:none;border-radius:7px;padding:7px 9px;font-size:13px;font-weight:700;cursor:pointer;background:#f7ecdc;color:var(--marron)}
  #tb button.del{background:#c0413b;color:#fff}

  .ayuda{font-size:11px;color:var(--gris);padding:8px 12px;text-align:center}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Doña Col">
  <div><h1>Plano de Montaje 2D</h1><p>Doña Col · vista desde arriba · a escala</p></div>
</header>

<div class="barra">
  <label>Personas</label><input id="pax" type="number" inputmode="numeric" value="100" min="1">
  <button class="bPared" id="bPared">✏️ Pared</button>
  <button class="bGen" id="bGen">✨ Montar solo</button>
  <span class="sp"></span>
  <button class="bGuardar" id="bGuardar">✔ Guardar</button>
  <button class="bLimpiar" id="bLimpiar">🗑 Limpiar</button>
</div>

<div id="genPanel">
  <div class="gTit" id="gTitVar">¿Cómo se agrupan las mesas?</div>
  <div class="gVariantes" id="gVariantes"></div>
  <div class="gTit" style="margin-top:10px">Y la barra, ¿cómo se pone en la sala?</div>
  <div class="gForma" id="gForma"></div>
  <label class="gLab">Largo de la sala (m)
    <input id="gLargo" type="number" value="12" min="2" step="0.5"></label>
  <label class="gLab">Separación entre grupos
    <input id="gSep" type="number" value="80" min="20" step="10"> cm</label>
  <label class="gChk"><input type="checkbox" id="gEncima" checked>
    Colocar también lo de encima (bandejas, chafing, cajas…)</label>
  <label class="gChk"><input type="checkbox" id="gAltas" checked>
    Repartir las mesas altas por la sala</label>
  <div class="gBtns">
    <button id="gHacer">Montar</button>
    <button id="gCerrar" class="sec">Cancelar</button>
  </div>
  <p class="gNota" id="gNota"></p>
</div>

<div id="invBanner"></div>
<div class="paleta" id="paleta"></div>

<div class="canvaswrap">
  <div id="lienzo"><div id="mundoWrap"><div id="mundo"><svg id="paredes"></svg><div id="ejeLinea"><span></span></div><div id="marquee"></div></div></div></div>
  <div id="zoomctl"><button id="zout">−</button><span id="zlbl">100%</span><button id="zin">＋</button><button id="zfit">⊡</button></div>
</div>

<div id="tb"><button id="tbRot">⟳ Girar</button><button class="del" id="tbDel">🗑 Borrar</button></div>

<p class="ayuda" id="ayuda">Toca para añadir · arrastra para mover · Mayús+clic o recuadro = varios · Ctrl+C/V copia/pega · rueda = zoom · Supr borra</p>

<script>
const $=s=>document.querySelector(s);
const lienzo=$('#lienzo'), mundo=$('#mundo'), mundoWrap=$('#mundoWrap'), svg=$('#paredes'), marquee=$('#marquee');
const SCALE=1.5;                        // px por cm
const WORLD_W=10000, WORLD_H=6000;      // lienzo enorme (a los lados y hacia abajo)
const cm=v=>Math.round(v*SCALE);
const MESAS=['buffet','baja','alta'];   // capa base (siempre debajo)
mundo.style.width=WORLD_W+'px'; mundo.style.height=WORLD_H+'px';
svg.setAttribute('width',WORLD_W); svg.setAttribute('height',WORLD_H);

const TIPOS={
  buffet:  {nm:'Mesa buffet',  wc:180, hc:74,  shape:'rect',  fill:'#f3e2c4',bd:'#5A3B27',ic:'🍴'},
  baja:    {nm:'Mesa baja',    wc:120, hc:74,  shape:'rect',  fill:'#f3e2c4',bd:'#5A3B27',ic:'▭'},
  alta:    {nm:'Mesa alta',    wc:70,  hc:70,  shape:'circle',fill:'#e9d3ad',bd:'#5A3B27',ic:''},
  chafing: {nm:'Chafing',      wc:53,  hc:33,  shape:'rect',  fill:'#c8c0b2',bd:'#555',   ic:'🔥'},
  bandeja: {nm:'Bandeja comida',wc:35, hc:26.5,shape:'rect',  fill:'#cda36a',bd:'#8a6a3a',ic:''},
  champ:   {nm:'Champanera',   wc:40,  hc:40,  shape:'circle',fill:'#d9c089',bd:'#8a6d2a',ic:'🧊'},
  fuente:  {nm:'Fuente agua',  wc:25,  hc:25,  shape:'circle',fill:'#bcd4e6',bd:'#5a7fa0',ic:'💧'},
  cajaCafe:{nm:'Box de bebida',wc:17,hc:10,  shape:'rect',  fill:'#b06a2e',bd:'#5e3613',ic:''},
  minibox: {nm:'Mini box',     wc:12,  hc:6.5, shape:'rect',  fill:'#e2cf9f',bd:'#a07f3a',ic:''},
  floral:  {nm:'Floral',       wc:11,  hc:11,  shape:'circle',fill:'#d4ebc2',bd:'#5a8a4a',ic:'💐'},
  servis:  {nm:'Servis',       wc:10,  hc:10,  shape:'rect',  fill:'#eadfca',bd:'#b09a72',ic:''},
  papelera:{nm:'Papelerita',   wc:10,  hc:10,  shape:'circle',fill:'#b6b6b6',bd:'#555',   ic:''},
  vaso:    {nm:'Vaso',         wc:6.5, hc:6.5, shape:'circle',fill:'#cfe2ee',bd:'#7a98ad',ic:''},
};

let items=[], walls=[], selEls=new Set(), selWall=null, nextId=1, zoom=1, modoPared=false, dibujando=null, clip=[];
try{const s=JSON.parse(localStorage.getItem('montaje2d')||'null');if(s){items=s.items||[];walls=s.walls||[];nextId=s.nextId||1;if(s.pax)setTimeout(()=>$('#pax').value=s.pax,0);}}catch(e){}

// Inventario (recursos según la checklist)
let INV=null, INVmeta=null;
try{const i=JSON.parse(localStorage.getItem('montaje_inv')||'null');if(i&&i.inv){INV=i.inv;INVmeta=i.meta||{};}}catch(e){}
if(INV){
  const b=$('#invBanner');b.style.display='flex';
  b.innerHTML=`📋 Plano para <b>${INVmeta.cliente||'evento'}</b> · ${INVmeta.menu||''} · ${INVmeta.pax||'?'} pax — recursos limitados según checklist`
    +`<a href="necesidades.html">← checklist</a>`;
  if(INVmeta.pax)setTimeout(()=>$('#pax').value=INVmeta.pax,0);
}

// Paleta (con contador colocadas/total si hay inventario)
$('#paleta').innerHTML=Object.entries(TIPOS).map(([k,t])=>
  `<div class="pBtn" data-tipo="${k}">
     ${t.ic?`<span class="ic">${t.ic}</span>`:`<span class="sw" style="background:${t.fill};border-color:${t.bd};border-radius:${t.shape==='circle'?'50%':'3px'}"></span>`}
     <span class="nm">${t.nm}</span><span class="dim">${t.wc}×${t.hc}</span>
     <span class="badge none" data-bt="${k}"></span></div>`).join('');
document.querySelectorAll('.pBtn').forEach(b=>b.onclick=()=>addItem(b.dataset.tipo));

function actualizarInv(){
  if(!INV)return;
  const cnt={}; items.forEach(it=>cnt[it.tipo]=(cnt[it.tipo]||0)+1);
  document.querySelectorAll('.badge').forEach(bd=>{
    const k=bd.getAttribute('data-bt'), tot=INV[k];
    if(!tot){bd.className='badge none';return;}
    const p=cnt[k]||0;
    bd.textContent=p+'/'+tot;
    bd.className='badge'+(p>tot?' over':(p===tot?' ok':''));
  });
}

// ----- Zoom -----
function setZoom(z){zoom=Math.max(0.15,Math.min(4,z));mundo.style.transform='scale('+zoom+')';
  mundoWrap.style.width=(WORLD_W*zoom)+'px';mundoWrap.style.height=(WORLD_H*zoom)+'px';
  $('#zlbl').textContent=Math.round(zoom*100)+'%';tbPos();}
function zoomAt(cx,cy,f){const b=worldXY(cx,cy);setZoom(zoom*f);const lr=lienzo.getBoundingClientRect();
  lienzo.scrollLeft=b.x*zoom-(cx-lr.left);lienzo.scrollTop=b.y*zoom-(cy-lr.top);}
function fit(){setZoom(0.5);lienzo.scrollTo(0,0);}   // vista de trabajo cómoda (arriba-izquierda)
$('#zin').onclick=()=>{const r=lienzo.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25);};
$('#zout').onclick=()=>{const r=lienzo.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.25);};
$('#zfit').onclick=fit;
lienzo.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12);},{passive:false});

function worldXY(clientX,clientY){const r=mundo.getBoundingClientRect();return{x:(clientX-r.left)/zoom,y:(clientY-r.top)/zoom};}
const snap=p=>({x:Math.round(p.x/10)*10,y:Math.round(p.y/10)*10});

// ----- Elementos -----
function addItem(tipo){
  const t=TIPOS[tipo],w=cm(t.wc),h=cm(t.hc);
  const vx=(lienzo.scrollLeft+lienzo.clientWidth/2)/zoom,vy=(lienzo.scrollTop+lienzo.clientHeight/2)/zoom;
  const it={id:nextId++,tipo,x:Math.max(0,Math.min(WORLD_W-w,vx-w/2)),y:Math.max(0,Math.min(WORLD_H-h,vy-h/2)),rot:0};
  items.push(it);renderEls();selEls=new Set([it.id]);selWall=null;marcarSel();guardar();
}
function renderEls(){
  [...mundo.querySelectorAll('.el')].forEach(e=>e.remove());
  // capas: mesas primero (debajo), el resto encima
  const ordenados=[...items].sort((a,b)=>(MESAS.includes(a.tipo)?0:1)-(MESAS.includes(b.tipo)?0:1));
  ordenados.forEach(it=>{
    const t=TIPOS[it.tipo],w=cm(t.wc),h=cm(t.hc);
    const d=document.createElement('div');
    d.className='el'+(selEls.has(it.id)?' sel':'');
    d.dataset.id=it.id;
    Object.assign(d.style,{width:w+'px',height:h+'px',left:it.x+'px',top:it.y+'px',
      background:t.fill,borderColor:t.bd,borderRadius:t.shape==='circle'?'50%':'5px',
      transform:'rotate('+(it.rot||0)+'deg)',fontSize:Math.max(7,Math.min(w,h)*0.5)+'px',
      zIndex:MESAS.includes(it.tipo)?1:2});
    if(it.tipo==='champ'){
      d.style.background='radial-gradient(circle at 38% 33%,#f4f6f7 0%,#cfd4d8 38%,#9aa1a8 72%,#767d84 100%)';
      d.style.borderColor='#6b7177';
      d.innerHTML='<div class="champInner"></div><span class="lbl">'+t.nm+'</span>';
    }else if(it.tipo==='cajaCafe'){
      d.style.background='linear-gradient(135deg,#bd7733 0%,#9c5a22 60%,#824718 100%)';
      d.style.borderColor='#5e3613';d.style.overflow='visible';
      d.innerHTML='<div class="cajaFlap"></div><div class="cajaGrifo"></div><span class="lbl">'+t.nm+'</span>';
    }else if(it.tipo==='chafing'){
      d.style.background='linear-gradient(180deg,#e3e7ea,#b3b9be)';
      d.style.borderColor='#7c838a';
      d.innerHTML='<div class="chafDome"></div><span class="lbl">'+t.nm+'</span>';
    }else if(it.tipo==='floral'){
      d.style.background='radial-gradient(circle at 26% 30%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 72% 26%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 64% 70%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 33% 66%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 50% 48%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 45% 40%,#ffffff 0%,#f3f8ed 45%,#d6e7c6 80%,#b6d09f 100%)';
      d.style.borderColor='#9ec284';

    }else if(it.tipo==='minibox'){
      d.style.background='linear-gradient(135deg,#bd7733,#8f5320)';d.style.borderColor='#5e3613';
      d.innerHTML='<div class="miniFill"></div><span class="lbl">'+t.nm+'</span>';
    }else if(it.tipo==='bandeja'){

      d.innerHTML='<div class="bandFill"></div><div class="bandLogo"></div><span class="lbl">'+t.nm+'</span>';
    }else if(it.tipo==='fuente'){
      d.style.background='radial-gradient(circle at 40% 36%,#eef8fc 0%,#cfeaf3 50%,#a9d6e6 100%)';d.style.borderColor='#8fb8c8';
      d.innerHTML='<div class="fuenteHi"></div><div class="fuenteLid"></div><span class="lbl">'+t.nm+'</span>';

    }
    mundo.appendChild(d);arrastrable(d,it);
  });
  actualizarInv();
}

function arrastrable(d,it){
  d.addEventListener('pointerdown',e=>{
    if(modoPared)return;
    e.preventDefault();e.stopPropagation();
    if(e.shiftKey){ if(selEls.has(it.id))selEls.delete(it.id);else selEls.add(it.id); selWall=null; marcarSel(); return; }
    if(!selEls.has(it.id)){selEls=new Set([it.id]);selWall=null;marcarSel();}
    // arrastrar TODOS los seleccionados juntos
    const st=worldXY(e.clientX,e.clientY);
    const orig={}; selEls.forEach(id=>{const o=items.find(i=>i.id===id);orig[id]={x:o.x,y:o.y};});
    try{d.setPointerCapture(e.pointerId);}catch(_){};d.style.cursor='grabbing';
    const move=ev=>{const p=worldXY(ev.clientX,ev.clientY),dx=p.x-st.x,dy=p.y-st.y;
      selEls.forEach(id=>{const o=items.find(i=>i.id===id),t=TIPOS[o.tipo],w=cm(t.wc),h=cm(t.hc);
        o.x=Math.max(0,Math.min(WORLD_W-w,orig[id].x+dx));o.y=Math.max(0,Math.min(WORLD_H-h,orig[id].y+dy));
        const el=mundo.querySelector('.el[data-id="'+id+'"]');if(el){el.style.left=o.x+'px';el.style.top=o.y+'px';}});
      tbPos();};
    const up=()=>{try{d.releasePointerCapture(e.pointerId);}catch(_){};d.style.cursor='grab';
      d.removeEventListener('pointermove',move);d.removeEventListener('pointerup',up);guardar();};
    d.addEventListener('pointermove',move);d.addEventListener('pointerup',up);
  });
}

/* ============================================================================
   MONTAR SOLO — coloca las mesas y lo que va encima, sin arrastrar nada.

   El montador no empieza de cero: ya sabe cuántas mesas y cuántas bandejas
   lleva (se lo dice el checklist). Lo que le cuesta es repartirlo bien. Aquí
   se elige la forma —una línea, dos, simétrica, en L, isla— y se coloca todo
   a escala, dejando los pasillos y los bordes que hacen falta.

   Las medidas están en CENTÍMETROS y se pasan a píxeles con cm(). El origen
   se calcula para que la barra quede centrada en la sala que se indique.
   ============================================================================ */
const GEN = {
  MARGEN: 6,        // cm libres en el borde de la mesa: nada cuelga
  SEPARA: 4,        // cm entre dos cosas encima de la mesa
  PASILLO: 250,     // cm entre dos barras enfrentadas: pasa un carro y gente
  HUECO_SIM: 180,   // cm de hueco en el centro de la simétrica: por ahí se entra
  ORIGEN_X: 600, ORIGEN_Y: 500,
};

// Qué se pone encima de las mesas, por orden de importancia. El chafing va
// primero porque es lo más grande y lo que no se puede mover una vez encendido.
const GEN_ENCIMA = ['chafing', 'bandeja', 'cajaCafe', 'minibox', 'servis', 'floral', 'vaso'];

const FORMAS = {
  linea:     {nm: 'Una línea',      dib: 'M4,14 H44'},
  dos:       {nm: 'Dos líneas',     dib: 'M4,8 H44 M4,20 H44'},
  simetrica: {nm: 'Simétrica',      dib: 'M4,14 H20 M28,14 H44'},
  ele:       {nm: 'En L',           dib: 'M6,4 V22 H44'},
  isla:      {nm: 'Isla central',   dib: 'M10,9 H38 M10,19 H38 M10,9 V19 M38,9 V19'},
};
let genForma = 'linea';

let genGrupos = null;        // la agrupación elegida, p. ej. [2,1]

/** Dibujito de una agrupación: rectángulos pegados o con hueco. */
function genMiniatura(grupos) {
  const W = 92, H = 20, sep = 5, n = grupos.reduce((a, b) => a + b, 0);
  const anchoMesa = (W - sep * (grupos.length - 1)) / n;
  let x = 0, piezas = '';
  grupos.forEach((g, gi) => {
    for (let i = 0; i < g; i++) {
      piezas += `<rect x="${x.toFixed(1)}" y="5" width="${anchoMesa.toFixed(1)}" height="10"
                 fill="#f3e2c4" stroke="#5A3B27" stroke-width="1.1"/>`;
      x += anchoMesa;
    }
    if (gi < grupos.length - 1) x += sep;
  });
  // el eje, que es lo que hay que ver de un vistazo
  const eje = x / 2;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${piezas}
    <line x1="${eje.toFixed(1)}" y1="0" x2="${eje.toFixed(1)}" y2="${H}"
      stroke="#c0413b" stroke-width="1.3" stroke-dasharray="3 2"/></svg>`;
}

/** Qué implica cada agrupación, dicho en una línea. */
function genQueImplica(grupos) {
  const ancho = genOffsets(grupos).total / 100;
  const colas = grupos.length === 1 ? '1 cola' : grupos.length + ' colas a la vez';
  // El centro se calcula de verdad, con la misma cuenta que el plano: decirlo
  // «a ojo» aquí y otra cosa allí sería peor que no decirlo.
  const eje = genEje(genMesas(grupos, ancho * 100));
  const centro = !eje ? '' : eje.sobreMesa
    ? ' · centro sobre mesa: ahí va el punto fuerte'
    : ' · centro en ' + (eje.hueco > 1 ? 'el hueco' : 'la junta') + ': nada en medio';
  return `${ancho.toFixed(1)} m de largo · ${colas}${centro}`;
}

/** Pinta todas las variantes posibles para las mesas que hay. */
function genPintarVariantes() {
  const n = genCuantasMesas();
  const opciones = genAgrupaciones(n);
  if (!genGrupos || genGrupos.reduce((a, b) => a + b, 0) !== n) genGrupos = opciones[0];
  $('#gTitVar').textContent = '¿Cómo se agrupan las ' + n + ' mesas?';
  $('#gVariantes').innerHTML = opciones.map((g, i) => {
    const puesto = JSON.stringify(g) === JSON.stringify(genGrupos);
    return `<div class="gVar${puesto ? ' on' : ''}" data-i="${i}">
      ${genMiniatura(g)}
      <div><span class="vt">${genNombreAgrup(g)}</span>
           <span class="vs">${genQueImplica(g)}</span></div></div>`;
  }).join('');
  document.querySelectorAll('.gVar').forEach(v => v.onclick = () => {
    genGrupos = opciones[+v.dataset.i];
    genPintarVariantes();
    genMontar();                       // se ve al momento, sin dar a nada más
  });
}

$('#gForma').innerHTML = Object.entries(FORMAS).map(([k, f]) =>
  `<div class="gOp${k === genForma ? ' on' : ''}" data-f="${k}">
     <svg width="48" height="26" viewBox="0 0 48 26"><path d="${f.dib}"
       stroke="#5A3B27" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>
     <span>${f.nm}</span></div>`).join('');
document.querySelectorAll('.gOp').forEach(o => o.onclick = () => {
  genForma = o.dataset.f;
  document.querySelectorAll('.gOp').forEach(x => x.classList.toggle('on', x === o));
  if (items.length) genMontar();

/** Cuántas mesas buffet hay. Manda el checklist; si no hay, se estima por las
 *  bandejas y el chafing, que es lo que ocupa sitio de verdad. */
function genCuantasMesas() {
  if (INV && INV.buffet) return Math.max(1, INV.buffet);
  const carga = ((INV && INV.bandeja) || 0) + ((INV && INV.chafing) || 0) * 2;
  return Math.max(2, Math.ceil(carga / 8));
}

/* CSS rotate() gira sobre el CENTRO del elemento. Una mesa de pie (rot 90) se
   dibuja, por tanto, desplazada respecto a su x/y: hay que corregir con la
   mitad de la diferencia entre el largo y el fondo. Sin esto, la barra en L
   sale descolocada y las bandejas se posan fuera de la mesa. */
function genDesfase() { return (cm(TIPOS.buffet.wc) - cm(TIPOS.buffet.hc)) / 2; }

/** El rectángulo que de verdad se ve de una mesa: {x, y, w, h} en píxeles. */
function genRect(mesa) {
  const w = cm(TIPOS.buffet.wc), h = cm(TIPOS.buffet.hc), off = genDesfase();
  return mesa.rot === 90
    ? {x: mesa.x + off, y: mesa.y - off, w: h, h: w}
    : {x: mesa.x, y: mesa.y, w: w, h: h};
}

/** Cuántos cm se dejan ENTRE grupos. Dentro de un grupo las mesas van pegadas. */
function genSeparacion() {
  return Math.max(0, parseInt(($('#gSep') || {}).value, 10) || 0);
}

/* LAS VARIANTES DE AGRUPACIÓN.
   Con 3 mesas no hay una sola manera de ponerlas: pueden ir las tres juntas,
   dos juntas y una suelta, o las tres sueltas. Cada una se monta distinto y
   reparte la cola de otra forma. En vez de que el montador lo piense, se le
   enseñan todas y elige.

   Se generan repartos EQUILIBRADOS: con g grupos, los grupos salen lo más
   iguales posible (5 mesas en 2 grupos -> 3+2). Así cada grupo se monta igual
   que su gemelo y no hay que mirar dos veces. */
function genAgrupaciones(n) {
  const salida = [];
  for (let g = 1; g <= n; g++) {
    const base = Math.floor(n / g), sobran = n % g;
    const grupos = [];
    for (let i = 0; i < g; i++) grupos.push(base + (i < sobran ? 1 : 0));
    salida.push(grupos);
  }
  return salida;
}

/** Cómo se lee una agrupación en voz alta. */
function genNombreAgrup(grupos) {
  const n = grupos.reduce((a, b) => a + b, 0);
  if (grupos.length === 1) return n === 1 ? '1 mesa' : n + ' mesas juntas';
  if (grupos.every(g => g === 1)) return n + ' mesas sueltas';
  const partes = {};
  grupos.forEach(g => partes[g] = (partes[g] || 0) + 1);
  return Object.keys(partes).sort((a, b) => b - a).map(tam => {
    const veces = partes[tam];
    const qué = tam === '1' ? 'suelta' : 'juntas';
    return veces > 1 ? veces + ' de ' + tam + ' ' + qué : tam + ' ' + qué;
  }).join(' + ');
}

/** Desplazamiento en cm de cada mesa desde el inicio de la barra. */
function genOffsets(grupos) {
  const ancho = TIPOS.buffet.wc, sep = genSeparacion();
  const offs = [];
  let x = 0;
  grupos.forEach((g, gi) => {
    for (let i = 0; i < g; i++) { offs.push(x); x += ancho; }
    if (gi < grupos.length - 1) x += sep;
  });
  return {offs, total: x};
}

/** Barra a partir de una agrupación, desde la esquina VISIBLE (xv, yv). */
function genBarra(grupos, xv, yv, vertical) {
  const {offs} = genOffsets(grupos), off = genDesfase();
  return offs.map(o => vertical
    ? {tipo: 'buffet', rot: 90, x: xv - off, y: yv + cm(o) + off}
    : {tipo: 'buffet', rot: 0,  x: xv + cm(o), y: yv});
}

/** Parte una agrupación en dos mitades, para las formas de dos barras. */
function genPartir(grupos) {
  const n = grupos.reduce((a, b) => a + b, 0);
  const mitad = Math.ceil(n / 2);
  const a = [], b = [];
  let suma = 0;
  grupos.forEach(g => { if (suma < mitad) { a.push(g); suma += g; } else b.push(g); });
  return [a.length ? a : [n], b.length ? b : []];
}

/* EL EJE CENTRAL. Es lo que el montador usa para cuadrar la barra con la sala,
   y no cae en el mismo sitio según cuántas mesas haya:

     · IMPAR (3 mesas)  -> el centro es el CENTRO DE LA MESA DE EN MEDIO.
                           Ahí va el punto fuerte: el floral grande, la tarta,
                           lo que se quiere que se vea de frente al entrar.
     · PAR (2 o 4)      -> el centro cae en la JUNTA entre las dos mesas
                           centrales. No hay mesa que lo ocupe: si se pone algo
                           encima queda partido entre dos tableros, así que lo
                           que va al centro se reparte a un lado y a otro.

   Con las mesas separadas el eje par cae en el hueco, que es aire: ahí no se
   puede poner nada, y conviene verlo antes de montar. */
function genEje(mesas) {
  const rects = mesas.map(genRect).sort((a, b) => a.x - b.x);
  if (!rects.length) return null;
  const n = rects.length;
  // El eje es el centro REAL de lo montado, no el de la mesa del medio: con
  // grupos desiguales (2 juntas + 1 suelta) no es lo mismo.
  const izqTodo = Math.min(...rects.map(r => r.x));
  const derTodo = Math.max(...rects.map(r => r.x + r.w));
  const x = (izqTodo + derTodo) / 2;

  // Estrictamente dentro: si el centro cae justo en el canto, eso es la JUNTA
  // entre dos mesas, no una mesa. Con 2 o 4 juntas es exactamente lo que pasa,
  // y es la diferencia entre poder poner algo en el centro o no poder.
  const dentro = rects.findIndex(r => x > r.x + 1 && x < r.x + r.w - 1);
  if (dentro >= 0) {
    const r = rects[dentro];
    const enMedio = Math.abs(x - (r.x + r.w / 2)) < 2;
    return {x, sobreMesa: true, n, mesa: dentro + 1,
            texto: 'Eje · ' + (enMedio ? 'centro de la mesa ' : 'sobre la mesa ')
                   + (dentro + 1) + ' de ' + n};
  }
  // Cae en un hueco: entre qué dos mesas, y de cuánto es ese hueco.
  let i = 0;
  while (i < n - 1 && rects[i + 1].x < x) i++;
  const hueco = (rects[i + 1].x - (rects[i].x + rects[i].w)) / SCALE;
  return {x, sobreMesa: false, n, hueco: Math.round(hueco),
          texto: hueco > 1
            ? 'Eje · en el hueco entre la mesa ' + (i + 1) + ' y la ' + (i + 2)
              + ' (' + Math.round(hueco) + ' cm)'
            : 'Eje · en la junta de las mesas ' + (i + 1) + ' y ' + (i + 2)};
}

/** Pinta el eje en el plano, que es media explicación por sí solo. */
function genPintarEje(eje) {
  const l = $('#ejeLinea');
  if (!eje) { l.style.display = 'none'; return; }
  l.style.display = 'block';
  l.style.left = eje.x + 'px';
  l.style.height = WORLD_H + 'px';
  l.querySelector('span').textContent = eje.texto;
}

/** Reparte las mesas según la forma elegida. Devuelve posiciones, aún sin id. */
function genMesas(grupos, largoSalaCm) {
  const t = TIPOS.buffet;
  const anchoDe = (gs) => genOffsets(gs).total;
  const centrar = (gs) => GEN.ORIGEN_X + Math.max(0, cm(largoSalaCm - anchoDe(gs)) / 2);

  if (genForma === 'linea') return genBarra(grupos, centrar(grupos), GEN.ORIGEN_Y, false);

  if (genForma === 'dos') {
    const [a, b] = genPartir(grupos);
    return [...genBarra(a, centrar(a), GEN.ORIGEN_Y, false),
            ...(b.length ? genBarra(b, centrar(b), GEN.ORIGEN_Y + cm(t.hc + GEN.PASILLO), false) : [])];
  }
  if (genForma === 'simetrica') {
    // Dos mitades con un hueco en medio: por ahí entra la gente y se sirve por
    // los dos lados a la vez, que es lo que parte la cola.
    const [a, b] = genPartir(grupos);
    const total = cm(anchoDe(a) + GEN.HUECO_SIM + (b.length ? anchoDe(b) : 0));
    const x0 = GEN.ORIGEN_X + Math.max(0, (cm(largoSalaCm) - total) / 2);
    return [...genBarra(a, x0, GEN.ORIGEN_Y, false),
            ...(b.length ? genBarra(b, x0 + cm(anchoDe(a) + GEN.HUECO_SIM), GEN.ORIGEN_Y, false) : [])];
  }
  if (genForma === 'ele') {
    const [a, b] = genPartir(grupos);
    const x0 = centrar(a);
    return [...genBarra(a, x0, GEN.ORIGEN_Y, false),
            ...(b.length ? genBarra(b, x0, GEN.ORIGEN_Y + cm(t.hc), true) : [])];
  }
  // isla: dos filas espalda con espalda, se sirve por los dos lados
  const [a, b] = genPartir(grupos);
  const x0 = centrar(a);
  return [...genBarra(a, x0, GEN.ORIGEN_Y, false),
          ...(b.length ? genBarra(b, x0, GEN.ORIGEN_Y + cm(t.hc), false) : [])];
}

/** Huecos libres encima de una mesa para piezas de wc×hc cm, en rejilla. */
function genHuecos(mesa, wc, hc) {
  const r = genRect(mesa);
  const anchoUtil = r.w / SCALE - GEN.MARGEN * 2;   // de píxeles a cm
  const fondoUtil = r.h / SCALE - GEN.MARGEN * 2;
  const cols = Math.max(0, Math.floor((anchoUtil + GEN.SEPARA) / (wc + GEN.SEPARA)));
  const filas = Math.max(0, Math.floor((fondoUtil + GEN.SEPARA) / (hc + GEN.SEPARA)));
  const huecos = [];
  for (let f = 0; f < filas; f++) {
    for (let c = 0; c < cols; c++) {
      huecos.push({
        x: r.x + cm(GEN.MARGEN + c * (wc + GEN.SEPARA)),
        y: r.y + cm(GEN.MARGEN + f * (hc + GEN.SEPARA)),
      });
    }
  }
  return huecos;
}

/** Coloca encima de las mesas todo lo que dice el inventario. */
function genEncima(mesas) {
  const puestos = [];
  const ocupado = mesas.map(() => []);   // rectángulos ya usados por mesa
  const choca = (mi, r) => ocupado[mi].some(o =>
    r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);

  GEN_ENCIMA.forEach(tipo => {
    let quedan = (INV && INV[tipo]) || 0;
    if (!quedan) return;
    const t = TIPOS[tipo], w = cm(t.wc), h = cm(t.hc);
    for (let mi = 0; mi < mesas.length && quedan > 0; mi++) {
      for (const hueco of genHuecos(mesas[mi], t.wc, t.hc)) {
        if (quedan <= 0) break;
        const r = {x: hueco.x, y: hueco.y, w, h};
        if (choca(mi, r)) continue;
        ocupado[mi].push(r);
        puestos.push({tipo, x: hueco.x, y: hueco.y, rot: 0});
        quedan--;
      }
    }
  });
  return puestos;
}

/** Mesas altas repartidas por delante de la barra, en rejilla suelta. */
function genAltas(mesas) {
  const n = (INV && INV.alta) || 0;
  if (!n) return [];
  const t = TIPOS.alta, sep = cm(t.wc + 150);     // 1,5 m entre altas: se circula
  const rects = mesas.map(genRect);
  const abajo = Math.max(...rects.map(r => r.y + r.h)) + cm(GEN.PASILLO);
  const izq = Math.min(...rects.map(r => r.x));
  const porFila = Math.max(1, Math.ceil(Math.sqrt(n)));
  const salida = [];
  for (let i = 0; i < n; i++) {
    salida.push({tipo: 'alta', rot: 0,
                 x: izq + (i % porFila) * sep,
                 y: abajo + Math.floor(i / porFila) * sep});
  }
  return salida;
}

/** Fuentes de agua y papeleras: a los extremos, que es donde estorban menos. */
function genExtremos(mesas) {
  const rects = mesas.map(genRect);
  const salida = [], izq = Math.min(...rects.map(r => r.x)),
        der = Math.max(...rects.map(r => r.x + r.w)),
        y = Math.min(...rects.map(r => r.y));
  const fuentes = (INV && INV.fuente) || 0, papeleras = (INV && INV.papelera) || 0;
  for (let i = 0; i < fuentes; i++) {
    const aIzq = i % 2 === 0;
    salida.push({tipo: 'fuente', rot: 0,
                 x: (aIzq ? izq - cm(TIPOS.fuente.wc + 40) : der + cm(40)),
                 y: y + cm(Math.floor(i / 2) * (TIPOS.fuente.hc + 25))});
  }
  for (let i = 0; i < papeleras; i++) {
    const aIzq = i % 2 === 0;
    salida.push({tipo: 'papelera', rot: 0,
                 x: (aIzq ? izq - cm(TIPOS.papelera.wc + 40) : der + cm(40)),
                 y: y + cm(200 + Math.floor(i / 2) * (TIPOS.papelera.hc + 25))});
  }
  return salida;
}

function genMontar() {
  const largoSala = Math.max(200, (parseFloat($('#gLargo').value) || 12) * 100);
  const nMesas = genCuantasMesas();
  if (!genGrupos || genGrupos.reduce((a, b) => a + b, 0) !== nMesas) genGrupos = [nMesas];
  const mesas = genMesas(genGrupos, largoSala);

  let nuevos = [...mesas];
  if ($('#gEncima').checked) nuevos = nuevos.concat(genEncima(mesas));
  if ($('#gAltas').checked)  nuevos = nuevos.concat(genAltas(mesas));
  nuevos = nuevos.concat(genExtremos(mesas));

  items = nuevos.map(o => ({...o, id: nextId++}));
  selEls = new Set(); selWall = null;
  const eje = genEje(mesas);
  genPintarEje(eje);
  renderEls(); marcarSel(); actualizarInv(); guardar();

  // Qué ha entrado y qué no: si algo no cabe, hay que decirlo, no esconderlo.
  const puesto = {}; items.forEach(i => puesto[i.tipo] = (puesto[i.tipo] || 0) + 1);
  const fuera = [];
  if (INV) Object.keys(INV).forEach(k => {
    const falta = (INV[k] || 0) - (puesto[k] || 0);
    if (falta > 0 && TIPOS[k]) fuera.push(falta + ' ' + TIPOS[k].nm.toLowerCase());
  });
  const sobreEje = eje
    ? (eje.sobreMesa
        ? '🎯 ' + nMesas + ' mesas (impar): el centro cae <b>sobre la mesa de en medio</b>, '
          + 'ahí va el punto fuerte — el floral grande, la tarta, lo que se ve al entrar.'
        : '🎯 ' + nMesas + ' mesas (par): el centro cae <b>' + (genSeparacion() ? 'en el hueco' : 'en la junta')
          + '</b> entre las dos de en medio. '
          + (genSeparacion() ? 'Ahí no se puede poner nada: es aire.'
                             : 'Lo que vaya al centro queda partido entre dos tableros, '
                               + 'así que se reparte a un lado y a otro.'))
    : '';
  $('#gNota').innerHTML = (fuera.length
    ? '⚠️ No ha cabido todo: falta colocar <b>' + fuera.join(', ') + '</b>. '
      + 'Añade una mesa más o prueba otra forma.'
    : '✅ Montado con ' + nMesas + ' mesa(s). Todo lo del checklist está colocado.')
    + (sobreEje ? '<br><br>' + sobreEje : '');
  $('#lienzo').scrollTo(Math.max(0, GEN.ORIGEN_X * 0.5 - 100), Math.max(0, GEN.ORIGEN_Y * 0.5 - 100));
}

$('#bGen').onclick = () => {
  const p = $('#genPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
  if (p.style.display === 'block') genPintarVariantes();
  if (p.style.display === 'block' && INV && INVmeta && INVmeta.pax) {
    $('#gNota').textContent = 'Para ' + INVmeta.pax + ' pax · '
      + genCuantasMesas() + ' mesa(s) buffet según el checklist.';
  }
};
$('#gSep').addEventListener('change', () => { genPintarVariantes(); if (items.length) genMontar(); });
$('#gCerrar').onclick = () => { $('#genPanel').style.display = 'none'; };
$('#gHacer').onclick = genMontar;

/* Al llegar desde el checklist, el plano YA viene montado. Antes se abría un
   lienzo en blanco y había que colocarlo todo a mano, que es justo el trabajo
   que esto quita. Solo se monta solo si no hay nada guardado: si el montador
   ya había movido cosas, se respeta lo suyo. */
(function montarAlLlegar() {
  if (!INV || items.length) return;
  const hayAlgo = Object.values(INV).some(v => v > 0);
  if (!hayAlgo) return;
  genPintarVariantes();
  genMontar();
  $('#genPanel').style.display = 'block';   // abierto, con todas las variantes
})();

renderEls();renderWalls();setZoom(0.6);lienzo.scrollTo(0,0);
</script>
