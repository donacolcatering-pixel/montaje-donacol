<!DOCTYPE html>

<head>

<title>Ver la mesa · Doña Col</title>
<!--
  LA MESA, GIRÁNDOLA.

  Aquí no se mide ni se toca nada: se mira. Se arrastra el dedo y la mesa da la
  vuelta entera, para ver por dónde queda cada cosa y cómo se va a ver desde
  donde llega la gente.

  El dibujo no son fotos ni imágenes renderizadas: es la misma geometría de la
  hoja impresa, girada. Por eso cambia solo cuando cambian las cantidades del
  evento y nunca dice algo distinto que el papel.

  Cuando estén las fotos de los productos, cada cara de estas cajas se puede
  forrar con la foto de la cara real -el grifo, la madera impresa, el logo de
  los vasos- y esto pasa de esquema a maqueta sin tocar el cálculo.
-->
<style>
  :root{--marron:#3F2920;--marron2:#5A3B27;--oro:#C07A2C;--beige:#F5EAD8;
        --crema:#FFFDF8;--linea:#E3D3B8;--tinta:#2e241d;--gris:#7d6c5c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--beige);color:var(--tinta);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;
       user-select:none}
  header{background:var(--marron);color:#f7ecdc;padding:9px 14px;display:flex;
         align-items:center;gap:10px;border-bottom:3px solid var(--oro)}
  header img{width:36px;height:36px;object-fit:contain;background:#fbf4e7;border-radius:50%;padding:3px}
  header h1{margin:0;font-family:Georgia,serif;font-size:16px}
  header p{margin:1px 0 0;font-size:9.5px;color:var(--oro);text-transform:uppercase;letter-spacing:1px}
  header a{margin-left:auto;color:#f7ecdc;font-size:12px;text-decoration:none;font-weight:700;
           border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:6px 10px}

  .barra{display:flex;gap:7px;align-items:center;padding:8px 12px;background:var(--crema);
         border-bottom:1px solid var(--linea);flex-wrap:wrap;font-size:12px}
  .barra label{font-weight:600;color:var(--marron2)}
  .barra select{padding:6px 8px;border:1px solid var(--linea);border-radius:7px;font-size:13px;
                background:#fff;color:var(--tinta)}
  .barra .sp{flex:1}
  .barra button{border:1px solid var(--linea);background:#fff;color:var(--marron2);
                border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .barra button.on{background:var(--marron);color:#f7ecdc;border-color:var(--marron)}

  #escena{position:relative;background:linear-gradient(#fdfaf3,#efe6d6);
          touch-action:none;cursor:grab;overflow:hidden}
  #escena.arrastrando{cursor:grabbing}
  #escena svg{display:block;width:100%;height:100%}

  .mando{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--crema);
         border-top:1px solid var(--linea)}
  .mando input[type=range]{flex:1;accent-color:var(--oro)}
  .mando .zb{border:1px solid var(--linea);background:#fff;color:var(--marron2);
    width:34px;height:30px;border-radius:8px;font-size:17px;font-weight:700;
    line-height:1;cursor:pointer;flex:0 0 auto;padding:0}
  .mando .zb:active{background:var(--marron);color:#f7ecdc}
  #zCentro{width:auto;padding:0 10px;font-size:13px;font-weight:600}
  .mando .grados{font-variant-numeric:tabular-nums;font-weight:800;color:var(--marron);
                 min-width:52px;text-align:right;font-size:13px}
  .pistas{display:flex;gap:6px;padding:0 14px 10px;background:var(--crema);flex-wrap:wrap}
  .pistas button{flex:1;min-width:66px;border:1px solid var(--linea);background:#fff;
    color:var(--marron2);border-radius:8px;padding:8px 4px;font-size:11px;font-weight:700;cursor:pointer}
  .ayuda{padding:9px 14px 16px;font-size:11.5px;color:var(--gris);line-height:1.5;
         background:var(--crema)}
  .aviso{margin:16px;padding:12px 14px;background:#fdf3e3;border:1px solid var(--oro);
         border-radius:10px;font-size:13px;color:var(--marron2)}
  .aviso a{color:var(--oro)}
</style>
</head>

<script>
/* Los tonos de las cajas, sacados de las fotos: el café oscuro y las
   leches en madera clara. */
PIEZAS.cafe.col = '#7a4a24';  PIEZAS.lecheNormal.col = '#e8d9b8';
PIEZAS.sinLactosa.col = '#dfe8ef'; PIEZAS.soja.col = '#e2ecd7';
PIEZAS.aguaCal.col = '#f0ddd4'; PIEZAS.zumo.col = '#f2dfa8';
PIEZAS.vaso.col = '#f7f3ec'; PIEZAS.vasoAgua.col = '#f7f3ec';
PIEZAS.fuente.col = '#dce9f0'; PIEZAS.bandeja.col = '#d8b483';
</script>
<script>
/* ---------------------------------------------------------------------------
   El giro. La isometría de la hoja mira siempre desde la misma esquina; aquí
   se gira el plano de la mesa alrededor de su centro antes de proyectarlo, y
   se vuelve a ordenar lo que tapa a qué. Es la misma cuenta, con un ángulo.
--------------------------------------------------------------------------- */
/* SEP_GRUPOS —el hueco entre grupos— ya viene del motor compartido: si se
   redeclarara aquí, el navegador para la página entera y además podrían
   acabar valiendo cosas distintas en la hoja y en el visor. */
let ANG = 20 * Math.PI / 180, SOMBRA = true, MARCAS = false, TODO = true, GRUPO = null;

function proyectar(x, y, z, centro) {
  const dx = x - centro.x, dy = y - centro.y;
  const c = Math.cos(ANG), s = Math.sin(ANG);
  const rx = dx * c - dy * s, ry = dx * s + dy * c;
  return [(rx - ry) * Math.cos(Math.PI / 6), (rx + ry) * 0.5 - z];
}

function tonoDe(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.max(0, Math.min(255, Math.round(f < 1 ? v * f : v + (255 - v) * (f - 1)))));
  return 'rgb(' + c.join(',') + ')';
}

/** Una caja: se dibujan solo las caras que se ven desde este ángulo. */
function cajaGirada(x, y, z, w, d, h, col, bd, centro, marca) {
  const P = (X, Y, Z) => proyectar(X, Y, Z, centro);
  const v = {
    A: P(x, y, z + h), B: P(x + w, y, z + h), C: P(x + w, y + d, z + h), D: P(x, y + d, z + h),
    a: P(x, y, z),     b: P(x + w, y, z),     c: P(x + w, y + d, z),     d: P(x, y + d, z),
  };
  const poly = (pts, f) => '<polygon points="' + pts.map(p => p.join(',')).join(' ')
    + '" fill="' + tonoDe(col, f) + '" stroke="' + bd
    + '" stroke-width="0.7" stroke-linejoin="round"/>';

  // Orden de las caras laterales: se pinta primero la que está más lejos.
  const lados = [
    {q: [v.A, v.B, v.b, v.a], m: (y), f: .82},              // norte
    {q: [v.C, v.D, v.d, v.c], m: -(y + d), f: .95},          // sur (el frente)
    {q: [v.B, v.C, v.c, v.b], m: -(x + w), f: .74},          // este
    {q: [v.D, v.A, v.a, v.d], m: (x), f: .88},               // oeste
  ];
  const cos = Math.cos(ANG), sen = Math.sin(ANG);
  const haciaMi = [
    -(Math.sin(ANG + Math.PI / 4)),  // norte
     (Math.sin(ANG + Math.PI / 4)),  // sur
     (Math.cos(ANG + Math.PI / 4)),  // este
    -(Math.cos(ANG + Math.PI / 4)),  // oeste
  ];
  let out = '';
  lados.forEach((L, i) => { if (haciaMi[i] > 0) out += poly(L.q, L.f); });
  out += poly([v.A, v.B, v.C, v.D], 1.12);                   // la tapa, siempre
  if (marca && MARCAS) {
    const [mx, my] = P(x + w / 2, y + d / 2, z + h);
    out += '<text x="' + mx + '" y="' + (my + 2.2) + '" font-size="6" font-weight="800"'
         + ' text-anchor="middle" fill="#2e241d">' + marca + '</text>';
  }
  return out;
}

function cilindroGirado(x, y, z, diam, h, col, bd, centro) {
  const r = diam / 2;
  const [ax, ay] = proyectar(x + r, y + r, z + h, centro);
  const [bx, by] = proyectar(x + r, y + r, z, centro);
  const rx = r * Math.cos(Math.PI / 6) * 1.42, ry = r * 0.5 * 1.42;
  const t = 'stroke="' + bd + '" stroke-width="0.7"';
  return '<path d="M' + (ax - rx) + ',' + ay + ' L' + (bx - rx) + ',' + by
       + ' A' + rx + ',' + ry + ' 0 0 0 ' + (bx + rx) + ',' + by
       + ' L' + (ax + rx) + ',' + ay + ' Z" fill="' + tonoDe(col, .88) + '" ' + t + '/>'
       + '<ellipse cx="' + ax + '" cy="' + ay + '" rx="' + rx + '" ry="' + ry
       + '" fill="' + tonoDe(col, 1.12) + '" ' + t + '/>';
}


/* ---------------------------------------------------------------------------
   LA PINTA DE CADA COSA.

   Recreadas a ojo a partir de las fotos de los montajes: la madera impresa de
   las cajas y su grifo rojo, la tapa de madera de las garrafas, los vasos
   apilados con su franja, la bandeja con su cuadrícula de bizcocho, la nube
   blanca de la paniculata. No son los productos exactos —para eso hacen falta
   las fotos del almacén, que están pendientes— pero se reconoce qué es cada
   cosa de un vistazo, que es de lo que se trata.
--------------------------------------------------------------------------- */

/** ¿Se ve el frente de las piezas desde el ángulo actual? */
function frenteVisible() { return Math.sin(ANG + Math.PI / 4) > 0.05; }

/** Punto de la cara de delante en coordenadas de pantalla.
 *  u va de 0 (izquierda) a 1 (derecha); v de 0 (abajo) a 1 (arriba). */
function enFrente(p, t, z, u, v, centro) {
  return proyectar(p.x + t.wc * u, p.y + t.hc, z + (t.zc || 10) * v, centro);
}
/** Punto de la cara de arriba. */
function enTapa(p, t, z, u, w, centro) {
  return proyectar(p.x + t.wc * u, p.y + t.hc * w, z + (t.zc || 10), centro);
}

const BEBIDA = ['cafe', 'lecheNormal', 'sinLactosa', 'soja', 'aguaCal', 'zumo'];

function adornos(p, z, centro) {
  const t = PIEZAS[p.tipo];
  const L = (a, b, col, gr) => '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0]
        + '" y2="' + b[1] + '" stroke="' + col + '" stroke-width="' + gr + '"/>';
  const Poli = (pts, col, bd) => '<polygon points="' + pts.map(q => q.join(',')).join(' ')
        + '" fill="' + col + '"' + (bd ? ' stroke="' + bd + '" stroke-width="0.5"' : '') + '/>';
  let o = '';

  /* --- CAJAS DE BEBIDA: vetas de madera, tapa y el grifo rojo --- */
  if (BEBIDA.indexOf(p.tipo) >= 0) {
    if (frenteVisible()) {
      // vetas verticales, como la madera impresa del cartón
      for (let i = 1; i < 5; i++) {
        o += L(enFrente(p, t, z, i / 5, 0.06, centro),
               enFrente(p, t, z, i / 5, 0.92, centro), 'rgba(90,59,39,.22)', 0.5);
      }
      // la raya de la tapa
      o += L(enFrente(p, t, z, 0.04, 0.82, centro),
             enFrente(p, t, z, 0.96, 0.82, centro), 'rgba(60,40,22,.45)', 0.7);
      // EL GRIFO: es lo que dice de un vistazo que esto es una caja de bebida
      const g1 = enFrente(p, t, z, 0.42, 0.10, centro);
      const g2 = enFrente(p, t, z, 0.58, 0.10, centro);
      const g3 = enFrente(p, t, z, 0.58, 0.24, centro);
      const g4 = enFrente(p, t, z, 0.42, 0.24, centro);
      o += Poli([g1, g2, g3, g4], '#c0413b', '#7d2420');
    }
    // la tapa, con su hendidura
    o += L(enTapa(p, t, z, 0.5, 0.15, centro), enTapa(p, t, z, 0.5, 0.85, centro),
           'rgba(90,59,39,.3)', 0.6);
  }

  /* --- GARRAFA DE AGUA: tapa de madera y grifo --- */
  else if (p.tipo === 'fuente') {
    const r = t.wc / 2;
    const [cx, cy] = proyectar(p.x + r, p.y + r, z + t.zc, centro);
    const rx = r * Math.cos(Math.PI / 6) * 1.42 * 0.82, ry = r * 0.5 * 1.42 * 0.82;
    o += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry
       + '" fill="#c9a06a" stroke="#8a6a3a" stroke-width="0.6"/>';
    if (frenteVisible()) {
      const a = proyectar(p.x + r - 1.6, p.y + t.hc, z + t.zc * 0.16, centro);
      const b = proyectar(p.x + r + 1.6, p.y + t.hc, z + t.zc * 0.16, centro);
      const c = proyectar(p.x + r + 1.6, p.y + t.hc, z + t.zc * 0.30, centro);
      const d = proyectar(p.x + r - 1.6, p.y + t.hc, z + t.zc * 0.30, centro);
      o += Poli([a, b, c, d], '#9aa1a8', '#6b7177');
    }
  }

  /* --- PILA DE VASOS: los aros de cada vaso y la franja de Doña Col --- */
  else if (p.tipo === 'vaso' || p.tipo === 'vasoAgua') {
    const r = t.wc / 2, h = t.zc;
    const rx = r * Math.cos(Math.PI / 6) * 1.42, ry = r * 0.5 * 1.42;
    for (let i = 1; i <= 4; i++) {
      const [ax, ay] = proyectar(p.x + r, p.y + r, z + h * (i / 5), centro);
      o += '<path d="M' + (ax - rx) + ',' + ay + ' A' + rx + ',' + ry
         + ' 0 0 0 ' + (ax + rx) + ',' + ay + '" fill="none" stroke="rgba(90,59,39,.28)"'
         + ' stroke-width="0.45"/>';
    }
    const [bx, by] = proyectar(p.x + r, p.y + r, z + h * 0.62, centro);
    o += '<path d="M' + (bx - rx) + ',' + by + ' A' + rx + ',' + ry
       + ' 0 0 0 ' + (bx + rx) + ',' + by + '" fill="none" stroke="#6b4423" stroke-width="1.1"/>';
  }

  /* --- BANDEJA: la cuadrícula de bizcocho, que es lo que se ve desde arriba --- */
  else if (p.tipo === 'bandeja') {
    for (let f = 0; f < 3; f++) {
      for (let c = 0; c < 4; c++) {
        if ((f + c) % 2) continue;                       // damero, como en las fotos
        const u0 = 0.08 + c * 0.21, w0 = 0.12 + f * 0.26;
        o += Poli([enTapa(p, t, z, u0, w0, centro),
                   enTapa(p, t, z, u0 + 0.17, w0, centro),
                   enTapa(p, t, z, u0 + 0.17, w0 + 0.21, centro),
                   enTapa(p, t, z, u0, w0 + 0.21, centro)], '#6b4423', null);
      }
    }
  }

  /* --- FLORAL: la nube blanca de la paniculata --- */
  else if (p.tipo === 'floral') {
    const r = t.wc / 2;
    const [cx, cy] = proyectar(p.x + r, p.y + r, z + t.zc * 0.86, centro);
    o += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 1.15)
       + '" fill="#eef5e6" stroke="#9ec284" stroke-width="0.5"/>';
    const puntos = [[-.5,-.3],[.4,-.45],[0,0],[-.35,.35],[.45,.3],[.15,-.15]];
    puntos.forEach(([a, b]) => {
      o += '<circle cx="' + (cx + a * r * 1.1) + '" cy="' + (cy + b * r * .8)
         + '" r="' + (r * .22) + '" fill="#fff"/>';
    });
  }

  /* --- MINI BOX: los sobres asomando --- */
  else if (p.tipo === 'minibox' || p.tipo === 'miniboxCal') {
    for (let i = 1; i < 6; i++) {
      o += L(enTapa(p, t, z, i / 6, 0.2, centro), enTapa(p, t, z, i / 6, 0.8, centro),
             'rgba(120,95,50,.5)', 0.5);
    }
  }
  return o;
}

function pintarEscena() {
  if (!GRUPO) return;
  const D = PIEZAS.buffet.hc, ALTO = PIEZAS.buffet.zc, ANCHO_MESA = PIEZAS.buffet.wc;

  /* LA BARRA ENTERA o un grupo suelto.

     Con «barra entera» se ven los grupos con sus huecos: tres mesas sueltas se
     ven sueltas, y «dos juntas y una separada» se ve tal cual. Es lo que hace
     falta para comprobar que el reparto es el que se quiere. Con «un grupo» se
     mira uno de cerca, que es lo que se copia luego en los demás. */
  const grupos = TODO ? GRUPO.grupos : [GRUPO.tam];
  const cargas = TODO ? GRUPO.cargas : [GRUPO.cuantos];

  const piezas = [], mesas = [];
  let x0 = 0;
  grupos.forEach((tam, gi) => {
    const m = montarGrupo(tam, cargas[gi]);
    mesas.push({x: x0, w: tam * ANCHO_MESA, tam});
    m.piezas.forEach(p => piezas.push({...p, x: p.x + x0}));
    x0 += tam * ANCHO_MESA + (TODO ? SEP_GRUPOS : 0);
  });
  const W = x0 - (TODO ? SEP_GRUPOS : 0);
  const centro = {x: W / 2, y: D / 2};

  let cuerpo = '';
  mesas.forEach(ms => {
    if (SOMBRA) {
      const esq = [[ms.x,0],[ms.x+ms.w,0],[ms.x+ms.w,D],[ms.x,D]]
        .map(([a,b]) => proyectar(a, b, 0, centro));
      cuerpo += '<polygon points="' + esq.map(p => (p[0] + 5) + ',' + (p[1] + 5)).join(' ')
              + '" fill="rgba(90,59,39,.14)"/>';
    }
    cuerpo += cajaGirada(ms.x, 0, 0, ms.w, D, ALTO, '#fdfbf6', '#b9a888', centro, null);
    // las juntas entre mesas de un mismo grupo
    for (let i = 1; i < ms.tam; i++) {
      const jx = ms.x + i * ANCHO_MESA;
      const a = proyectar(jx, 0, ALTO, centro), b = proyectar(jx, D, ALTO, centro);
      cuerpo += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1]
              + '" stroke="rgba(120,95,60,.4)" stroke-width="0.6" stroke-dasharray="3 2"/>';
    }
  });

  // De más lejos a más cerca, según el ángulo: así unas cosas tapan a otras.
  const c = Math.cos(ANG), s = Math.sin(ANG);
  const cerca = p => {
    const dx = p.x + PIEZAS[p.tipo].wc / 2 - centro.x, dy = p.y + PIEZAS[p.tipo].hc / 2 - centro.y;
    return (dx * c - dy * s) + (dx * s + dy * c);
  };
  piezas.slice().sort((a, b) => cerca(a) - cerca(b)).forEach(p => {
    const t = PIEZAS[p.tipo], h = t.zc || 10;
    const redondo = (p.tipo === 'vaso' || p.tipo === 'vasoAgua' || p.tipo === 'floral');
    cuerpo += redondo
      ? cilindroGirado(p.x, p.y, ALTO, t.wc, h, t.col, t.bd, centro)
      : cajaGirada(p.x, p.y, ALTO, t.wc, t.hc, h, t.col, t.bd, centro, t.mk);
    cuerpo += adornos(p, ALTO, centro);
  });

  // Encuadre fijo: el mismo para todos los ángulos, para que no dé saltos al girar.
  const radio = Math.hypot(W, D) / 2;
  const anc = radio * 2 * Math.cos(Math.PI / 6) + 40;
  const alt = radio * 2 * 0.5 + ALTO + 90;
  /* El encuadre se estrecha al acercar, y PAN corre el centro a lo largo de la
     barra para poder recorrerla cuando no cabe entera. */
  const ancZ = anc / ZOOM, altZ = alt / ZOOM;
  const corre = PAN * (anc - ancZ) / 2;
  const vb = [-ancZ / 2 + corre,
              -(alt - ALTO / 2 - 40) + (alt - altZ) / 2,
              ancZ, altZ].join(' ');

  const esc = document.getElementById('escena');
  esc.style.height = Math.max(280, Math.min(window.innerHeight * 0.58, 560)) + 'px';
  esc.innerHTML = '<svg viewBox="' + vb + '" preserveAspectRatio="xMidYMid meet">'
                + cuerpo + '</svg>';
}

/* --- ZOOM Y DESPLAZAMIENTO ------------------------------------------------
   Con seis u ocho mesas la barra entera entra en el encuadre, pero cada pieza
   queda del tamaño de un grano de arroz. El zoom acerca sin cambiar el angulo,
   y al acercarse aparece el deslizador de mover para recorrer la barra. */
let ZOOM = 1, PAN = 0;

function aplicarZoom(z, quieto) {
  ZOOM = Math.min(5, Math.max(1, z));
  document.getElementById('zoom').value = Math.round(ZOOM * 100);
  document.getElementById('zval').textContent =
    ZOOM.toFixed(1).replace('.', ',') + '×';
  document.getElementById('filaMover').hidden = ZOOM <= 1.05;
  if (ZOOM <= 1.05) { PAN = 0; document.getElementById('mover').value = 0; }
  if (!quieto) pintarEscena();
}

document.getElementById('zoom').addEventListener('input',
  e => aplicarZoom(+e.target.value / 100));
document.getElementById('zMas').addEventListener('click', () => aplicarZoom(ZOOM + 0.5));
document.getElementById('zMenos').addEventListener('click', () => aplicarZoom(ZOOM - 0.5));
document.getElementById('mover').addEventListener('input', e => {
  PAN = +e.target.value / 100; pintarEscena();
});
document.getElementById('zCentro').addEventListener('click', () => {
  PAN = 0; document.getElementById('mover').value = 0; pintarEscena();
});

/* pellizco con dos dedos, que es como se hace en el movil */
(function pellizco() {
  const esc = document.getElementById('escena');
  const dedos = new Map();
  let base = 0, zBase = 1;
  const dist = () => {
    const p = [...dedos.values()];
    return p.length < 2 ? 0 : Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  };
  esc.addEventListener('pointerdown', e => {
    dedos.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (dedos.size === 2) { base = dist(); zBase = ZOOM; }
  });
  esc.addEventListener('pointermove', e => {
    if (!dedos.has(e.pointerId)) return;
    dedos.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (dedos.size === 2 && base > 0) aplicarZoom(zBase * (dist() / base));
  });
  const fuera = e => { dedos.delete(e.pointerId); base = 0; };
  esc.addEventListener('pointerup', fuera);
  esc.addEventListener('pointercancel', fuera);
  /* y la rueda del raton, para quien lo mire en el ordenador */
  esc.addEventListener('wheel', e => {
    e.preventDefault();
    aplicarZoom(ZOOM * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, {passive: false});
})();

/* --- arrastrar para girar --- */
(function arrastrar() {
  const esc = document.getElementById('escena');
  let x0 = null, a0 = 0;
  const empezar = (x) => { x0 = x; a0 = ANG; esc.classList.add('arrastrando'); };
  const mover = (x) => {
    if (x0 === null) return;
    ANG = a0 + (x - x0) * 0.012;
    const g = ((ANG * 180 / Math.PI) % 360 + 360) % 360;
    document.getElementById('giro').value = Math.round(g);
    document.getElementById('grados').textContent = Math.round(g) + '°';
    pintarEscena();
  };
  const soltar = () => { x0 = null; esc.classList.remove('arrastrando'); };
  esc.addEventListener('pointerdown', e => { esc.setPointerCapture(e.pointerId); empezar(e.clientX); });
  esc.addEventListener('pointermove', e => { if (e.isPrimary) mover(e.clientX); });
  esc.addEventListener('pointerup', soltar);
  esc.addEventListener('pointercancel', soltar);
})();

function ponerGrados(g) {
  ANG = g * Math.PI / 180;
  document.getElementById('giro').value = g;
  document.getElementById('grados').textContent = g + '°';
  pintarEscena();
}
document.getElementById('giro').addEventListener('input', e => ponerGrados(+e.target.value));
document.querySelectorAll('.pistas button').forEach(b =>
  b.onclick = () => ponerGrados(+b.dataset.g));
document.getElementById('bTodo').onclick = function () {
  TODO = !TODO; this.classList.toggle('on', TODO);
  this.textContent = TODO ? 'Barra entera' : 'Un grupo';
  pintarEscena();
};
document.getElementById('bSombra').onclick = function () {
  SOMBRA = !SOMBRA; this.classList.toggle('on', SOMBRA); pintarEscena();
};
document.getElementById('bMarcas').onclick = function () {
  MARCAS = !MARCAS; this.classList.toggle('on', MARCAS); pintarEscena();
};
window.addEventListener('resize', pintarEscena);

/* --- arranque: el evento que venga del checklist --- */
(function arrancar() {
  const nMesas = INV.buffet || 0;
  if (!nMesas) {
    document.getElementById('aviso').style.display = 'block';
    document.getElementById('aviso').innerHTML =
      'No hay ningún evento cargado. Abre el <a href="necesidades.html">checklist</a>, '
      + 'calcula las necesidades y vuelve a entrar.';
    return;
  }
  document.getElementById('cab').textContent =
    (META.cliente || 'Evento') + ' · ' + (META.pax || '?') + ' pax';

  const opciones = agrupaciones(nMesas);
  const sel = document.getElementById('cual');
  sel.innerHTML = opciones.map((ag, i) =>
    '<option value="' + i + '">' + nombreDe(ag, nMesas) + '</option>').join('');
  const elegir = () => {
    const ag = opciones[+sel.value];
    const tam = Math.max.apply(null, ag.grupos);
    const cargas = repartir(ag.grupos);
    GRUPO = {tam, cuantos: cargas[ag.grupos.indexOf(tam)],
             grupos: ag.grupos, cargas};
    pintarEscena();
  };
  sel.onchange = elegir;
  sel.value = String(opciones.length - 1);      // por defecto, lo más juntas
  elegir();
})();
</script>
