<title>Hoja de montaje · Doña Col</title>
<!--
  UNA HOJA. Nada más.

  El plano 2D sirve para dibujar, pero en una sala no sirve: hay que ponerlo al
  15%, elegir la agrupación a clics y no se ven las alternativas a la vez. El
  montador no sabe cómo va a colocar las mesas hasta que ve el espacio, así que
  necesita TODAS las opciones delante y en papel.

  Esta hoja sale del checklist con las cantidades del evento y se imprime:
    · las tres maneras de agrupar las mesas, dibujadas a escala, una debajo de
      otra, sin tocar nada;
    · a la derecha, qué es cada elemento, cuántos hay y con qué marca sale;
    · abajo, las reglas de presentación, que son las que hacen que un montaje
      parezca cuidado.
-->
<style>

<div class="barra">

<div id="aviso" class="aviso" style="display:none"></div>
<div class="hoja" id="hoja"></div>

<script>
/* ---------------------------------------------------------------------------
   Piezas: medidas REALES en cm, vistas desde arriba. La mesa es 180 × 70 de
   planta (los 74 cm son la altura y aquí no pintan nada).
   La marca es la letra que sale dibujada en la pieza y en el listado lateral.
--------------------------------------------------------------------------- */
const PIEZAS = {
  buffet:     {nm:'Mesa buffet',            wc:180, hc:70,   mk:'',   col:'#f7ecd8', bd:'#5A3B27'},
  bandeja:    {nm:'Bandeja de comida',      wc:35,  hc:26.5, mk:'B',  col:'#cda36a', bd:'#8a6a3a'},
  chafing:    {nm:'Chafing dish',           wc:53,  hc:33,   mk:'C',  col:'#b9bfc4', bd:'#6c7379'},
  /* Las bebidas, una a una: el café manda y la leche normal va con él.
     OJO A LA ORIENTACIÓN: la caja se pone con el MORRO —el grifo— de frente, y
     el cuerpo se va hacia atrás, a lo largo de la mesa. Estaban puestas de
     ancho (17 de frente por 10 de fondo) y es al revés: ocupan poco frente y
     mucho fondo. Por eso no cuadraban en la barra. */
  cafe:       {nm:'Caja de CAFÉ',           wc:17,  hc:25,   mk:'CA', col:'#8a4f22', bd:'#4a2a0f'},
  lecheNormal:{nm:'Leche normal',           wc:17,  hc:25,   mk:'LE', col:'#f0e4cd', bd:'#b9a179'},
  sinLactosa: {nm:'Leche sin lactosa',      wc:17,  hc:25,   mk:'SL', col:'#e3edf3', bd:'#8aa7b8'},
  soja:       {nm:'Leche de soja',          wc:17,  hc:25,   mk:'SO', col:'#e7f0d9', bd:'#96ae77'},
  aguaCal:    {nm:'Agua caliente',          wc:17,  hc:25,   mk:'AC', col:'#f5ddd6', bd:'#c08c7e'},
  zumo:       {nm:'Caja de zumo',           wc:17,  hc:25,   mk:'ZU', col:'#f6e2b0', bd:'#c2a044'},
  fuente:     {nm:'Fuente de agua 5 L',     wc:25,  hc:25,   mk:'F',  col:'#bcd4e6', bd:'#5a7fa0'},
  vaso:       {nm:'Pila de 15 vasos',       wc:6.5, hc:6.5,  mk:'V',  col:'#e4eef5', bd:'#7a98ad'},
  vasoAgua:   {nm:'Pila de 10 vasos (agua)',wc:6.5, hc:6.5,  mk:'V',  col:'#dce9f2', bd:'#7a98ad'},
  minibox:    {nm:'Mini box',               wc:12,  hc:6.5,  mk:'M',  col:'#e2cf9f', bd:'#a07f3a'},
  servis:     {nm:'Servilletas (platito)',  wc:10,  hc:10,   mk:'S',  col:'#eadfca', bd:'#b09a72'},
  floral:     {nm:'Arreglo floral',         wc:11,  hc:11,   mk:'L',  col:'#d4ebc2', bd:'#5a8a4a'},
  alta:       {nm:'Mesa alta de cóctel',    wc:70,  hc:70,   mk:'T',  col:'#e9d3ad', bd:'#5A3B27'},
  papelera:   {nm:'Papelera',               wc:10,  hc:10,   mk:'P',  col:'#c9c9c9', bd:'#666'},
};

// Las bebidas que van en caja, por orden de mando: el café primero.
const BEBIDAS = ['cafe','lecheNormal','sinLactosa','soja','aguaCal','zumo'];

/* Franjas: la bebida al borde de delante, la comida detrás. Sale de las fotos
   de los montajes reales, no de una idea mía. */
const DELANTE = [...BEBIDAS, 'fuente', 'vaso', 'servis', 'minibox'];
const DETRAS  = ['chafing','bandeja','floral'];
const EN_PAREJA = ['fuente'];        // las aguas van de dos en dos, nunca impar

const MARGEN = 4, SEPARA = 3, MAX_JUNTAS = 3;

/* --- Inventario que viene del checklist ---------------------------------- */
let INV = {}, META = {};
try {
  const g = JSON.parse(localStorage.getItem('montaje_inv') || 'null');
  if (g && g.inv) { INV = g.inv; META = g.meta || {}; }
} catch (e) {}

/* --- Agrupaciones: las tres únicas maneras ------------------------------- */
function agrupaciones(n) {
  const salida = [];
  for (let k = 1; k <= Math.min(n, MAX_JUNTAS); k++) {
    const grupos = [];
    let quedan = n;
    while (quedan > 0) { grupos.push(Math.min(k, quedan)); quedan -= k; }
    salida.push({k, grupos});
  }
  return salida;
}

function nombreDe(ag, n) {
  const k = ag.k, enteros = ag.grupos.filter(g => g === k).length, sobra = n - enteros * k;
  if (n === k) return n === 1 ? 'Una mesa sola' : n + ' mesas juntas';
  const base = k === 1 ? 'De una en una' : k === 2 ? 'De dos en dos' : 'De tres en tres';
  const cuantos = k === 1 ? enteros + ' mesas'
                : enteros === 1 ? 'un grupo de ' + k : enteros + ' grupos de ' + k;
  return base + ' · ' + cuantos
       + (sobra ? ' y ' + (sobra === 1 ? 'una suelta' : sobra + ' sueltas') : '');
}

/* --- LA FILA DE DELANTE: EL CAFÉ MANDA -----------------------------------

   En un coffee break el café dicta el montaje. De él salen las cantidades
   (una caja cada 10 personas) y a su alrededor se coloca lo demás:

     · la LECHE NORMAL va pegada a su café — van de dos en dos, y hay la mitad
       de leches que de cafés, así que no todos los cafés llevan la suya: las
       que hay se reparten a lo largo buscando las esquinas y el centro;
     · sin lactosa, soja y agua caliente se reparten entre los cafés restantes;
     · las AGUAS van en pareja, una a cada lado, nunca en el centro;
     · las SERVILLETAS van ENTRE cajas, dos por mesa, nunca en el centro;
     · cada caja lleva su pila de vasos al lado.

   Todo se construye montando MEDIA fila y reflejándola, así la simetría está
   garantizada y no depende de cómo caigan las cuentas.                      */

function bloquesDeBebida(cuantos) {
  /* Un «bloque» es una caja con lo que la acompaña. El café es el que abre:
     se hacen tantos bloques como cafés haya y se les va colgando la leche
     normal primero (a los de las puntas y el centro, que es donde se ve),
     y luego el resto de leches a los que queden libres. */
  const nCafes = cuantos.cafe || 0;
  if (!nCafes) {
    // Sin café no hay coffee: se ponen las cajas que haya, sin emparejar.
    return BEBIDAS.filter(b => cuantos[b] > 0)
                  .flatMap(b => Array.from({length: cuantos[b]}, () => [b]));
  }
  const bloques = Array.from({length: nCafes}, () => ['cafe']);

  // Orden en que se van ocupando los cafés: primero las puntas, luego el
  // centro, luego lo de en medio. Es como se mira una barra.
  const orden = [];
  let i = 0, j = nCafes - 1;
  while (i <= j) { orden.push(i); if (i !== j) orden.push(j); i++; j--; }
  const centro = Math.floor((nCafes - 1) / 2);
  orden.sort((a, b) => {
    const rango = (x) => (x === 0 || x === nCafes - 1) ? 0 : (x === centro ? 1 : 2);
    return rango(a) - rango(b) || a - b;
  });

  let k = 0;
  ['lecheNormal', 'sinLactosa', 'soja', 'aguaCal', 'zumo'].forEach(tipo => {
    for (let n = 0; n < (cuantos[tipo] || 0); n++) {
      bloques[orden[k % nCafes]].push(tipo);
      k++;
    }
  });
  return bloques;
}

function filaDelante(cuantos, anchoCm, nMesas) {
  /* SE MONTA POR PUESTOS.

     Un PUESTO es un café con su leche —café + leche normal, o café + leche sin
     lactosa— y lleva siempre dos cosas pegadas:
       · una MINI BOX (15 azucarillos, 4-5 sacarinas y 15 paletinas), y
       · una PILA DE 15 VASOS.

     Y van a lados contrarios, en espejo: en la mitad izquierda de la barra la
     mini box va a la IZQUIERDA del puesto y los vasos a la derecha; en la
     mitad derecha, al revés. Así la mini box queda siempre por fuera y los
     vasos por dentro, y la barra se ve simétrica desde el centro.

     Las fuentes de agua son la excepción: llevan su propia pila de 10 vasos a
     cada lado, y esas van un poco MÁS ADELANTE que todo lo demás, que sí está
     alineado a la misma altura. */
  const puestos = bloquesDeBebida(cuantos);      // cada uno: [cafe, leche, …]
  const paresAgua = Math.floor((cuantos.fuente || 0) / 2);

  const mitadP = puestos.slice(0, Math.floor(puestos.length / 2));
  const central = puestos.length % 2 ? puestos[Math.floor(puestos.length / 2)] : null;

  // Media fila: puestos y, repartidas entre ellos, las fuentes de agua.
  const mitad = [];
  let aguas = paresAgua;
  mitadP.forEach((pu, i) => {
    mitad.push({puesto: pu});
    const restan = mitadP.length - i - 1;
    if (aguas > 0 && restan > 0
        && (i + 1) % Math.max(1, Math.round(mitadP.length / (paresAgua + 1))) === 0) {
      mitad.push({agua: true}); aguas--;
    }
  });
  while (aguas-- > 0) mitad.push({agua: true});
  if (!mitad.length && !central) return [];

  const W = (t) => PIEZAS[t].wc;
  const anchoPuesto = (pu) => pu.reduce((a, t) => a + W(t), 0) + (pu.length - 1) * 2
                            + W('minibox') + 2 + W('vaso') + 2;
  const anchoAgua = () => W('vasoAgua') + 2 + W('fuente') + 2 + W('vasoAgua');
  const anchoDe = (c) => c.agua ? anchoAgua() : anchoPuesto(c.puesto);

  const columnas = [
    ...mitad,
    ...(central ? [{puesto: central, centro: true}] : []),
    ...mitad.slice().reverse().map(c => ({...c, espejo: true})),
  ];

  const suma = columnas.reduce((a, c) => a + anchoDe(c), 0);
  const hueco = columnas.length > 1
    ? Math.max(SEPARA, (anchoCm - MARGEN * 2 - suma) / (columnas.length - 1)) : 0;
  let x = (anchoCm - (suma + hueco * (columnas.length - 1))) / 2;

  const puntos = [];
  columnas.forEach(c => {
    let dx = x;
    if (c.agua) {
      // Los vasos del agua, un poco más adelante: adelante = true.
      puntos.push({tipo: 'vasoAgua', x: dx, adelante: true}); dx += W('vasoAgua') + 2;
      puntos.push({tipo: 'fuente', x: dx});                   dx += W('fuente') + 2;
      puntos.push({tipo: 'vasoAgua', x: dx, adelante: true});
    } else {
      const cajas = c.espejo ? c.puesto.slice().reverse() : c.puesto;
      const fuera = c.espejo ? 'der' : 'izq';                 // dónde va la mini box
      if (fuera === 'izq') { puntos.push({tipo: 'minibox', x: dx}); dx += W('minibox') + 2; }
      else { puntos.push({tipo: 'vaso', x: dx}); dx += W('vaso') + 2; }
      cajas.forEach(t => { puntos.push({tipo: t, x: dx}); dx += W(t) + 2; });
      if (fuera === 'izq') puntos.push({tipo: 'vaso', x: dx});
      else puntos.push({tipo: 'minibox', x: dx});
    }
    x += anchoDe(c) + hueco;
  });
  return puntos;
}

/* --- LA FILA DE DETRÁS: comida y flores ----------------------------------
   Regla del floral: NUNCA más de dos por mesa. Si es uno, va al centro; si
   son dos, a los lados. Más de dos en una mesa parece un escaparate.        */
function filaDetras(cuantos, anchoCm, nMesas) {
  const puntos = [];
  const bandejas = cuantos.bandeja || 0, chafings = cuantos.chafing || 0;
  const flores = Math.min(cuantos.floral || 0, nMesas * 2);

  const piezas = [];
  for (let i = 0; i < chafings; i++) piezas.push('chafing');
  for (let i = 0; i < bandejas; i++) piezas.push('bandeja');
  if (!piezas.length && !flores) return puntos;

  // las flores, primero: una al centro si es impar, o a los lados
  const floralCentral = flores % 2 === 1;
  const anchoFloral = flores ? PIEZAS.floral.wc : 0;
  if (floralCentral) puntos.push({tipo: 'floral', x: (anchoCm - anchoFloral) / 2, fila: 0});
  const paresFlor = Math.floor(flores / 2);

  const mitad = piezas.slice(0, Math.floor(piezas.length / 2));
  const central = piezas.length % 2 ? piezas[Math.floor(piezas.length / 2)] : null;
  const anchoCentro = floralCentral ? anchoFloral : (central ? PIEZAS[central].wc : 0);

  const desde = MARGEN + (paresFlor ? PIEZAS.floral.wc + SEPARA : 0);
  const hasta = anchoCm / 2 - anchoCentro / 2 - SEPARA;
  const suma = mitad.reduce((a, t) => a + PIEZAS[t].wc, 0);
  const hueco = mitad.length > 1 ? Math.max(SEPARA, ((hasta - desde) - suma) / (mitad.length - 1)) : 0;

  for (let i = 0; i < paresFlor; i++) {
    const x = MARGEN + i * (PIEZAS.floral.wc + SEPARA);
    puntos.push({tipo: 'floral', x, fila: 0});
    puntos.push({tipo: 'floral', x: anchoCm - x - PIEZAS.floral.wc, fila: 0});
  }
  if (central && !floralCentral) puntos.push({tipo: central, x: (anchoCm - PIEZAS[central].wc) / 2, fila: 0});
  let x = desde;
  mitad.forEach(t => {
    puntos.push({tipo: t, x, fila: 0});
    puntos.push({tipo: t, x: anchoCm - x - PIEZAS[t].wc, fila: 0});
    x += PIEZAS[t].wc + hueco;
  });
  return puntos;
}

/* --- Qué lleva un grupo y dónde ------------------------------------------ */
function montarGrupo(tamGrupo, cuantos) {
  const anchoCm = tamGrupo * PIEZAS.buffet.wc, fondoCm = PIEZAS.buffet.hc;
  const piezas = [];

  // DELANTE: las cajas al borde. Cada bloque puede llevar dos alturas (el café
  // delante y su leche justo detrás), y por eso se mira la «fila» de cada una.
  const delante = filaDelante(cuantos, anchoCm, tamGrupo);
  /* TODO ALINEADO A LA MISMA ALTURA: el borde de delante de cada pieza cae en
     la misma línea, que es lo que hace que la barra se vea recta. La única
     excepción son los vasos de las fuentes de agua, que van un poco más
     adelantados —salen 2 cm del resto— porque se cogen de pie sin acercarse. */
  const LINEA = fondoCm - MARGEN;
  delante.forEach(p => {
    const t = PIEZAS[p.tipo];
    const adelanto = p.adelante ? 2 : 0;
    piezas.push({tipo: p.tipo, x: p.x, y: LINEA - t.hc + adelanto});
  });
  const fondoOcupadoDelante = delante.length
    ? Math.max(...delante.map(p => PIEZAS[p.tipo].hc)) : 0;

  // DETRÁS: la comida y las flores.
  const detras = filaDetras(cuantos, anchoCm, tamGrupo);
  const altoDetras = detras.length ? Math.max(...detras.map(p => PIEZAS[p.tipo].hc)) : 0;
  const sitio = fondoCm - MARGEN * 2 - fondoOcupadoDelante - SEPARA;
  if (altoDetras <= sitio) {
    detras.forEach(p => piezas.push({tipo: p.tipo, x: p.x, y: MARGEN}));
  }

  const leer = (lista) => lista.slice().sort((a, b) => a.x - b.x || (a.fila || 0) - (b.fila || 0))
                                .map(p => p.tipo);
  return {piezas, anchoCm, fondoCm,
          secFrente: leer(delante), secDetras: leer(detras)};
}

/* --- Reparto del inventario entre los grupos ------------------------------ */
function repartir(grupos) {
  /* A cada grupo, lo que le corresponde POR MESAS, no por grupo.
     Repartiendo a partes iguales, la mesa suelta de «un grupo de 3 y una
     suelta» recibía la carga de tres mesas, no le cabía, y salía vacía en el
     plano. Ahora un grupo de 3 lleva el triple que uno de 1, y lo que sobra
     del redondeo va a los grupos grandes, que son los que tienen sitio. */
  const porGrupo = grupos.map(() => ({}));
  const mesasTotal = grupos.reduce((a, g) => a + g, 0);
  const orden = grupos.map((g, i) => i).sort((a, b) => grupos[b] - grupos[a]);

  Object.keys(PIEZAS).forEach(tipo => {
    if (tipo === 'buffet' || tipo === 'alta' || tipo === 'papelera') return;
    const total = INV[tipo] || 0;
    if (!total) return;
    let dado = 0;
    grupos.forEach((g, i) => {
      const toca = Math.floor(total * g / mesasTotal);
      porGrupo[i][tipo] = toca;
      dado += toca;
    });
    let resto = total - dado;
    for (let k = 0; resto > 0; k = (k + 1) % orden.length, resto--) {
      porGrupo[orden[k]][tipo]++;
    }
  });
  return porGrupo;
}

/* --- Dibujo de una variante ---------------------------------------------- */
const ESC = 0.62;                       // mm de papel por cm real (~1:16)
const SEP_GRUPOS = 80;                  // cm entre grupos separados

function dibujar(ag, n) {
  const cuantos = repartir(ag.grupos);
  const anchoTotalCm = ag.grupos.reduce((a, g) => a + g * PIEZAS.buffet.wc, 0)
                     + (ag.grupos.length - 1) * SEP_GRUPOS;
  const W = anchoTotalCm * ESC, H = PIEZAS.buffet.hc * ESC + 3;

  let svg = '', x0 = 0, secF = [], secD = [], ejes = [];
  ag.grupos.forEach((tam, gi) => {
    const m = montarGrupo(tam, cuantos[gi]);
    // las mesas del grupo
    for (let i = 0; i < tam; i++) {
      svg += `<rect x="${(x0 + i * PIEZAS.buffet.wc) * ESC}" y="0"
        width="${PIEZAS.buffet.wc * ESC}" height="${PIEZAS.buffet.hc * ESC}"
        fill="${PIEZAS.buffet.col}" stroke="${PIEZAS.buffet.bd}" stroke-width="0.5"/>`;
    }
    // lo que va encima, con su marca
    m.piezas.forEach(p => {
      const t = PIEZAS[p.tipo], w = t.wc * ESC, h = t.hc * ESC;
      svg += `<rect x="${(x0 + p.x) * ESC}" y="${p.y * ESC}" width="${w}" height="${h}"
        fill="${t.col}" stroke="${t.bd}" stroke-width="0.35" rx="0.5"/>`;
      if (w >= 3.2 && h >= 2.6) {
        svg += `<text x="${(x0 + p.x) * ESC + w / 2}" y="${p.y * ESC + h / 2 + 1}"
          font-size="2.5" font-weight="700" text-anchor="middle" fill="#33271f">${t.mk}</text>`;
      }
    });
    // La secuencia que se escribe debajo es la del grupo MÁS GRANDE, que es el
    // que marca el montaje; los pequeños llevan lo mismo en menos cantidad.
    if (tam >= Math.max(...ag.grupos) && !secF.length) { secF = m.secFrente; secD = m.secDetras; }
    ejes.push((x0 + m.anchoCm / 2) * ESC);
    x0 += tam * PIEZAS.buffet.wc + SEP_GRUPOS;
  });

  // el eje del conjunto, que es con lo que se cuadra la barra en la sala
  const ejeX = anchoTotalCm * ESC / 2;
  svg += `<line x1="${ejeX}" y1="-2.5" x2="${ejeX}" y2="${PIEZAS.buffet.hc * ESC + 2.5}"
    stroke="#c0413b" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>`;
  svg += `<text x="${ejeX}" y="${PIEZAS.buffet.hc * ESC + 5.2}" font-size="2.6"
    text-anchor="middle" fill="#c0413b" font-weight="700">eje</text>`;

  const lista = (sec) => {
    if (!sec.length) return '—';
    const out = []; let ant = null, n2 = 0;
    sec.forEach(t => { if (t === ant) n2++; else { if (ant) out.push({t: ant, n: n2}); ant = t; n2 = 1; } });
    if (ant) out.push({t: ant, n: n2});
    return out.map(o => (o.n > 1 ? o.n + '×' : '') + PIEZAS[o.t].mk).join(' · ');
  };

  return {svg: `<svg viewBox="-1 -4 ${W + 2} ${H + 8}" width="100%"
                  style="max-height:34mm" preserveAspectRatio="xMidYMid meet">${svg}</svg>`,
          largo: (anchoTotalCm / 100).toFixed(1),
          secFrente: lista(secF), secDetras: lista(secD),
          colas: ag.grupos.length};
}

/* --- La hoja -------------------------------------------------------------- */
function pintar() {
  const nMesas = INV.buffet || 0;
  if (!nMesas) {
    document.getElementById('aviso').style.display = 'block';
    document.getElementById('aviso').innerHTML =
      'No hay ningún evento cargado. Abre el <a href="necesidades.html">checklist</a>, '
      + 'calcula las necesidades y vuelve a pulsar «ver plano».';
    return;
  }
  const opciones = agrupaciones(nMesas);

  const variantes = opciones.map((ag, i) => {
    const d = dibujar(ag, nMesas);
    return `<div class="variante">
      <div class="vcab"><span class="vnum">${i + 1}</span>
        <span class="vtit">${nombreDe(ag, nMesas)}</span>
        <span class="vsub">${d.largo} m de barra · ${d.colas} ${d.colas === 1 ? 'cola' : 'colas'}</span></div>
      ${d.svg}
      <p class="vsecuencia"><b>Delante:</b> ${d.secFrente} &nbsp;·&nbsp;
         <b>Detrás:</b> ${d.secDetras}</p>
    </div>`;
  }).join('');

  const detalle = {
    vaso:     n => n + ' pilas · ' + (n * 15) + ' vasos',
    vasoAgua: n => n + ' pilas · ' + (n * 10) + ' vasos',
    minibox:  n => n + ' · 15 azucarillos, 4 sacarinas y 15 paletinas cada una',
  };
  const filas = Object.keys(PIEZAS).filter(t => t !== 'buffet' && (INV[t] || 0) > 0)
    .map(t => {
      const p = PIEZAS[t], n = INV[t];
      const extra = detalle[t] ? '<div class="dim">' + detalle[t](n) + '</div>' : '';
      return `<tr>
        <td class="mk"><div class="marca" style="background:${p.col};border-color:${p.bd}">${p.mk}</div></td>
        <td>${p.nm}<div class="dim">${p.wc} × ${p.hc} cm</div>${extra}</td>
        <td class="ud">${n}</td></tr>`;
    }).join('');

  const REGLAS = [
    'Los <b>logos siempre mirando hacia adelante</b>, hacia quien llega.',
    'Los <b>vasos de cartón</b>, con el logo de frente.',
    '<b>Todo a la misma altura</b> y con simetría exacta.',
    '<b>Filas iguales</b>: si son 15 vasos, filas de 15, 15 y 15. Nunca una fila coja.',
    '<b>La misma cantidad de servilletas</b> en cada platito.',
    'El <b>logo de la servilleta vertical</b>, mirando al cliente y recto, sin colgar.',
    'Las <b>paletinas a un lado</b>, no repartidas.',
    'Las <b>aguas van siempre de dos en dos</b>: una normal y otra de limón con hierbabuena.',
    'Cada <b>puesto de café</b> (café con su leche) lleva <b>una mini box y una pila de 15 vasos</b>.',
    'La <b>mini box por fuera y los vasos por dentro</b>: en la mitad izquierda la caja va a la izquierda del puesto; en la derecha, al revés.',
    'Cada <b>fuente de agua</b> lleva <b>10 vasos a cada lado</b>, y esos van un poco más adelantados que el resto.',
    '<b>Todo alineado a la misma altura</b> por el borde de delante. Solo se adelantan los vasos del agua.',
  ];

  document.getElementById('hoja').innerHTML = `
    <header>
      <div>
        <h1>Hoja de montaje</h1>
        <div class="sub">Doña Col Catering · vista desde arriba, a escala</div>
      </div>
      <div class="cli">
        <b>${META.cliente || 'Evento'}</b><br>
        ${META.menu || ''}<br>
        ${META.pax ? META.pax + ' personas' : ''} · ${nMesas} mesas de buffet
      </div>
    </header>

    <div class="cuerpo">
      <div>
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--marron2);
                   margin:0 0 7px;padding-bottom:4px;border-bottom:1.5px solid var(--linea)">
          Las ${opciones.length} maneras de ponerlo · elige según el espacio</h2>
        ${variantes}
      </div>
      <div class="leyenda">
        <h2>Qué es cada cosa</h2>
        <table>${filas}</table>
        <p style="font-size:9.5px;color:var(--gris);line-height:1.45;margin-top:7px">
          La línea roja es el <b>eje</b>: con ella se cuadra la barra en la sala.
          Si cae sobre una mesa, ahí va el punto fuerte; si cae en una junta o en
          un hueco, no se pone nada en medio y se reparte a los lados.</p>
      </div>
    </div>

    <div class="reglas">
      <h2>Reglas de montaje · esto es lo que se ve</h2>
      <ol>${REGLAS.map(r => '<li>' + r + '</li>').join('')}</ol>
    </div>

    <div class="pie">
      <span>Las mesas son de 180 × 70 cm (74 de alto).</span>
      <span class="sp"></span>
      <span>Impreso el ${new Date().toLocaleDateString('es-ES')}</span>
    </div>`;
}

document.getElementById('bImprimir').onclick = () => window.print();
pintar();
</script>
