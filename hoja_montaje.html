<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de montaje · Doña Col</title>
<!--
  UNA HOJA. Nada más.

  El plano 2D sirve para dibujar, pero en una sala no sirve: hay que ponerlo al
  15%, elegir la agrupación a clics y no se ven las alternativas a la vez. El
  montador no sabe cómo va a colocar las mesas hasta que ve el espacio, así que
  necesita TODAS las opciones delante y en papel.

  Esta hoja sale del checklist con las cantidades del evento y se imprime:
    · las tres maneras de agrupar las mesas, dibujadas a escala, una debajo de
      otra, sin tocar nada;
    · a la derecha, qué es cada elemento, cuántos hay y con qué marca sale;
    · abajo, las reglas de presentación, que son las que hacen que un montaje
      parezca cuidado.
-->
<style>
  :root{
    --marron:#3F2920; --marron2:#5A3B27; --oro:#C07A2C; --beige:#F5EAD8;
    --crema:#FFFDF8; --linea:#E3D3B8; --tinta:#2e241d; --gris:#7d6c5c;
    --eje:#c0413b; --papel:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#ddd6c9;color:var(--tinta);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       font-size:14px;-webkit-font-smoothing:antialiased}

  .barra{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--crema);
         border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .barra button{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;
                cursor:pointer;background:var(--marron);color:#f7ecdc;letter-spacing:.2px}
  .barra a{color:var(--marron2);font-weight:600;text-decoration:none;font-size:13px}
  .barra .sp{flex:1}

  .hoja{width:210mm;min-height:297mm;margin:16px auto;background:var(--papel);
        padding:12mm 11mm 10mm;box-shadow:0 3px 20px rgba(0,0,0,.2)}

  header{display:flex;align-items:center;gap:11px;padding-bottom:7px;margin-bottom:9px;
         border-bottom:3px solid var(--marron)}
  header img{width:42px;height:42px;object-fit:contain}
  header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:21px;
            color:var(--marron);letter-spacing:-.2px;line-height:1}
  header .sub{font-size:10px;color:var(--gris);margin-top:3px;letter-spacing:1.3px;
              text-transform:uppercase}
  header .datos{margin-left:auto;display:flex;text-align:right}
  header .dato{padding-left:11px;margin-left:11px;border-left:1px solid var(--linea)}
  header .dato .k{font-size:8.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--gris)}
  header .dato .v{font-size:14px;font-weight:800;color:var(--marron);line-height:1.25;
                  white-space:nowrap;font-variant-numeric:tabular-nums}

  h2.sec{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--marron2);
         margin:0 0 8px;display:flex;align-items:center;gap:9px}
  h2.sec:after{content:"";flex:1;height:1px;background:var(--linea)}

  .variante{margin-bottom:7mm;break-inside:avoid}
  .vcab{display:flex;align-items:center;gap:9px;margin-bottom:1px}
  .vnum{width:21px;height:21px;border-radius:50%;background:var(--marron);color:#fff;
        font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .vtit{font-size:14px;font-weight:800;color:var(--marron);letter-spacing:-.1px}
  .vsub{margin-left:auto;font-size:10.5px;color:var(--gris);font-variant-numeric:tabular-nums}
  .vsub b{color:var(--marron2)}
  .vdib{margin:1px 0 3px}
  .cara3d{break-before:page;page-break-before:always;padding-top:4mm}
  .nota3d{font-size:9.5px;color:var(--gris);line-height:1.5;margin:0 0 5mm;max-width:150mm}
  .iso3d{margin-bottom:5mm;padding:4mm 3mm 2mm;background:#fbf7ef;border:1px solid var(--linea);
         border-radius:8px;break-inside:avoid}
  .iso3d .isoEt{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
                color:var(--marron2);margin-bottom:2mm}
  .iso3d .vnum{width:18px;height:18px;font-size:10.5px}
  .iso3d svg{max-height:62mm;display:block;margin:0 auto}
  .vsecuencia{font-size:9.5px;color:var(--gris);line-height:1.9;display:flex;
              flex-wrap:wrap;gap:4px;align-items:center}
  .vsecuencia .et{font-weight:800;color:var(--marron2);text-transform:uppercase;
                  letter-spacing:.7px;font-size:8.5px}
  .mk2{display:inline-block;border:1px solid var(--linea);border-radius:3px;
       padding:0 3px;font-size:8.5px;font-weight:700;color:var(--marron2);background:#fbf6ec}

  .pieHoja{display:grid;grid-template-columns:1.15fr 1fr;gap:8mm;margin-top:3mm;
           padding-top:4mm;border-top:3px solid var(--marron);break-inside:avoid}
  .leyenda ul{list-style:none;margin:0;padding:0;columns:2;column-gap:5mm}
  .leyenda li{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px;
              break-inside:avoid;font-size:9.5px;line-height:1.3}
  .leyenda .marca{width:17px;height:15px;border-radius:2.5px;border:1px solid;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#2e241d}
  .leyenda .nm{flex:1}
  .leyenda .nm b{display:block;color:var(--tinta);font-weight:700}
  .leyenda .nm span{color:var(--gris);font-size:8.5px}
  .leyenda .ud{font-weight:800;color:var(--marron);font-variant-numeric:tabular-nums}

  .reglas ol{margin:0;padding-left:15px;font-size:9.3px;line-height:1.55;color:var(--tinta)}
  .reglas li{margin-bottom:2.5px}
  .reglas b{color:var(--marron2)}

  .nota{margin-top:4mm;font-size:8.5px;color:var(--gris);line-height:1.45;
        border-left:2px solid var(--oro);padding-left:7px}
  .firma{margin-top:4mm;padding-top:3mm;border-top:1px solid var(--linea);
         display:flex;font-size:8px;color:var(--gris);letter-spacing:.4px}
  .firma .sp{flex:1}

  .aviso{background:#fdf3e3;border:1px solid var(--oro);border-radius:9px;padding:10px 12px;
         font-size:12px;color:var(--marron2);margin:16px auto;max-width:210mm}

  /* EN EL MÓVIL la hoja se adapta al ancho de la pantalla. Estaba clavada a los
     210 mm del folio y en un teléfono había que arrastrar de lado para ver el
     final de cada mesa — y los montadores van con el móvil, no con el folio.
     Al imprimir vuelve a ser un A4 exacto: eso no se toca. */
  @media screen and (max-width:820px){
    .hoja{width:100%;min-height:0;margin:0;padding:14px 12px 20px;box-shadow:none}
    header{flex-wrap:wrap;gap:8px}
    /* Los cuatro datos en rejilla, no en fila: en una pantalla de teléfono el
       cuarto se salía por la derecha y se leía «M» en vez de «Mesas». */
    header .datos{margin-left:0;width:100%;display:grid;
                  grid-template-columns:1fr 1fr;gap:6px 10px;text-align:left}
    header .dato{padding:0 0 0 9px;margin:0;border-left:2px solid var(--linea)}
    header .dato .v{font-size:13px;white-space:normal}
    .pieHoja{grid-template-columns:1fr;gap:18px}
    .leyenda ul{columns:1}
    .reglas ol{font-size:12px;line-height:1.6}
    .leyenda li{font-size:12px}
    .vtit{font-size:15px}
    .vsub{font-size:12px}
    .vsecuencia{font-size:11.5px}
    .iso3d svg{max-height:none}
    .cara3d{break-before:auto;page-break-before:auto}
  }

  @media print{
    body{background:#fff}
    .barra,.aviso{display:none}
    .hoja{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
    @page{size:A4 portrait;margin:10mm}
  }
</style>
</head>
<body>

<div class="barra">
  <button id="bImprimir">🖨️ Imprimir</button>
  <a href="necesidades.html">← volver al checklist</a>
  <span class="sp"></span>
  <a href="vista3d.html">🔄 ver la mesa girando →</a>
  <a href="montaje2d.html" style="margin-left:12px">plano para dibujar a mano →</a>
</div>

<div id="aviso" class="aviso" style="display:none"></div>
<div class="hoja" id="hoja"></div>

<script src="motor_montaje.js?v=20260925-1220"></script>
<script>
function pintar() {
  const nMesas = INV.buffet || 0;
  if (!nMesas) {
    const a = document.getElementById('aviso');
    a.style.display = 'block';
    a.innerHTML = 'No hay ningún evento cargado. Abre el <a href="necesidades.html">checklist</a>, '
      + 'calcula las necesidades y vuelve a pulsar «ver plano».';
    return;
  }
  const opciones = agrupaciones(nMesas);

  const variantes = opciones.map((ag, i) => {
    const d = dibujar(ag, nMesas);
    return '<div class="variante">'
      + '<div class="vcab"><span class="vnum">' + (i + 1) + '</span>'
      + '<span class="vtit">' + nombreDe(ag, nMesas) + '</span>'
      + '<span class="vsub"><b>' + d.largo + ' m</b> de barra · ' + d.colas
      + (d.colas === 1 ? ' cola' : ' colas') + '</span></div>'
      + '<div class="vdib">' + d.svg + '</div>'

      + '<div class="vsecuencia"><span class="et">Delante</span>' + d.secFrente
      + '<span class="et" style="margin-left:7px">Detrás</span>' + d.secDetras + '</div>'
      + '</div>';
  }).join('');

  const detalle = {
    vaso:       n => (n * 15) + ' vasos en ' + n + ' pilas',
    vasoAgua:   n => (n * 10) + ' vasos en ' + n + ' pilas',
    minibox:    n => 'una por cada café · 15 azucarillos, 4 sacarinas, 15 paletinas',
    miniboxCal: n => 'va con el agua caliente · 10 descafeinados, 5 tés',
    cafe:       n => 'manda: de aquí salen las demás',
  };
  const leyenda = Object.keys(PIEZAS).filter(t => t !== 'buffet' && (INV[t] || 0) > 0)
    .map(t => {
      const p = PIEZAS[t], n = INV[t];
      const extra = detalle[t] ? detalle[t](n) : (p.wc + ' × ' + p.hc + ' cm');
      return '<li><span class="marca" style="background:' + p.col + ';border-color:' + p.bd + '">'
        + p.mk + '</span><span class="nm"><b>' + p.nm + '</b><span>' + extra
        + '</span></span><span class="ud">' + n + '</span></li>';
    }).join('');

  const REGLAS = [
    'Los <b>logos siempre de frente</b>, hacia quien llega. También los de los vasos de cartón.',
    '<b>Todo a la misma altura</b>, alineado por el borde de delante. Solo se adelantan los vasos del agua.',
    '<b>Filas iguales</b>: si son 15 vasos, filas de 15, 15 y 15. Nunca una fila coja.',
    'Manda el <b>café</b>: por cada caja de café, <b>una mini box y una pila de 15 vasos</b>.',
    'La <b>mini box por fuera</b> del puesto y los <b>vasos por dentro</b>. En la mitad derecha, al revés.',
    'La <b>mini box de infusiones</b> va con el <b>agua caliente</b>, no con el café.',
    'Las <b>aguas de dos en dos</b>: una normal y otra de limón con hierbabuena. <b>10 vasos a cada lado</b>.',
    'La misma <b>cantidad de servilletas</b> en cada platito, y el <b>logo vertical</b>, recto, sin colgar.',
    'Las <b>paletinas a un lado</b>, no repartidas.',
    'Nunca <b>más de dos arreglos florales por mesa</b>: uno al centro o dos a los lados.',
    'La <b>comida llena la mesa</b>: se reparte mesa a mesa, escalonada en V y sin tocar los bordes.',
  ];

  const fecha = new Date().toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});

  document.getElementById('hoja').innerHTML =
      '<header><img src="logo.png" alt="">'
    + '<div><h1>Hoja de montaje</h1>'
    + '<div class="sub">Doña Col Catering · planta a escala</div></div>'
    + '<div class="datos">'
    + '<div class="dato"><div class="k">Cliente</div><div class="v">' + (META.cliente || '—') + '</div></div>'
    + '<div class="dato"><div class="k">Servicio</div><div class="v">' + (META.menu || '—') + '</div></div>'
    + '<div class="dato"><div class="k">Personas</div><div class="v">' + (META.pax || '—') + '</div></div>'
    + '<div class="dato"><div class="k">Mesas</div><div class="v">' + nMesas + '</div></div>'
    + '</div></header>'
    + '<h2 class="sec">Las ' + opciones.length + ' maneras de ponerlo · elige según el espacio</h2>'
    + variantes
    + '<div class="pieHoja"><div class="leyenda">'
    + '<h2 class="sec">Qué es cada cosa</h2><ul>' + leyenda + '</ul>'
    + '<p class="nota">La línea roja es el <b>eje</b>: con ella se cuadra la barra en la sala. '
    + 'Si cae sobre una mesa, ahí va el punto fuerte; si cae en una junta o en un hueco, '
    + 'no se pone nada en medio y se reparte a los lados.</p></div>'
    + '<div class="reglas"><h2 class="sec">Reglas de montaje</h2><ol>'
    + REGLAS.map(r => '<li>' + r + '</li>').join('') + '</ol></div></div>'
    + '<section class="cara3d"><h2 class="sec">Así tiene que quedar</h2>'
    + '<p class="nota3d">Un grupo de cada manera, visto desde arriba en perspectiva. '
    + 'Como todos los grupos se montan igual, con ver uno se ve la barra entera. '
    + 'Esta cara es para mirar; la de delante, para medir.</p>'
    + opciones.map((ag, i) => {
        const tam = Math.max.apply(null, ag.grupos);
        const cual = repartir(ag.grupos)[ag.grupos.indexOf(tam)];
        return '<div class="iso3d"><div class="isoEt"><span class="vnum">' + (i + 1)
          + '</span> Grupo de ' + tam + (tam === 1 ? ' mesa' : ' mesas')
          + ' · ' + nombreDe(ag, nMesas) + '</div>'
          + dibujarIso(tam, cual) + '</div>';
      }).join('')
    + '</section>'
    + '<div class="firma"><span>Mesas de 180 × 70 cm · 74 de alto</span>'
    + '<span class="sp"></span><span>' + fecha + '</span></div>';
}

document.getElementById('bImprimir').onclick = () => window.print();
pintar();
</script>
</body>
</html>
