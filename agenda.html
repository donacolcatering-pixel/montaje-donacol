<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda del día · Doña Col</title>
<meta name="theme-color" content="#1B1411">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="agenda-manifest.json">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<style>
  /* Misma paleta y tipografías que el resto de las apps de la casa. */
  :root{
    --cacao:#1B1411; --cafe:#61422A; --taupe:#907A69; --nata:#F1E4C3;
    --fondo:#F4EFE6; --sup:#FFFFFF; --sup2:#EDE5D8; --tinta:#1F1712;
    --suave:#6B6058; --linea:rgba(31,23,18,.12);
    --ok:#1E5B38; --okbg:#DCEFE2; --amb:#8A5208; --ambbg:#FAEAD0;
    /* Las cuatro señales de la tabla. El azul de la entrega no sale en ningún
       otro sitio de la pantalla a propósito: así no se confunde con nada. */
    --sal-f:#1B1411; --sal-t:#F7E9C6;      /* hora de SALIDA del obrador */
    --ent-f:#18506E; --ent-t:#EAF4FA;      /* hora de ENTREGA al cliente */
    --no-f:#A8322D; --no-sup:#FCE4E1;      /* SIN ACEPTAR */
    --display:"Bodoni","Bodoni Moda",Didot,Georgia,serif;
    --texto:"Hanken",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r:16px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --fondo:#14100D; --sup:#211915; --sup2:#2C221D; --tinta:#F3EBDD;
      --suave:#B5A797; --linea:rgba(243,235,221,.14);
      --ok:#79C795; --okbg:#1C3124; --amb:#F0B45C; --ambbg:#3A2A12;
      --sal-f:#F7E9C6; --sal-t:#1B1411;    /* de noche se invierte: la salida en claro */
      --ent-f:#8FC7E8; --ent-t:#0E2E40;
      --no-f:#F08A80; --no-sup:#3A1C19;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);
       -webkit-text-size-adjust:100%}

  header{background:var(--cacao);color:var(--nata);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
  header h1{margin:0;font-family:var(--display);font-size:24px;font-weight:500;letter-spacing:.2px}
  header p{margin:3px 0 0;font-size:12.5px;opacity:.72}

  /* --- barra del día --- */
  .dia{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--sup);
       border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:5}
  .dia button{flex:0 0 auto;width:42px;height:42px;border:1px solid var(--linea);
       background:var(--sup2);color:var(--tinta);border-radius:12px;font-size:19px;cursor:pointer}
  .dia button:active{transform:scale(.96)}
  .dia .centro{flex:1;text-align:center;min-width:0}
  /* Sin text-transform:capitalize: ponía «20 De Octubre». La primera letra se
     pone en mayúscula desde el guion, que es lo único que hace falta. */
  .dia .centro b{display:block;font-family:var(--display);font-size:19px;font-weight:500;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dia input[type=date]{border:0;background:transparent;color:var(--suave);font-family:var(--texto);
       font-size:12px;text-align:center;width:100%;padding:2px 0}
  .hoy-btn{padding:0 14px!important;width:auto!important;font-size:13px!important;font-weight:600}

  /* --- plazas --- */
  .plazas{display:flex;gap:8px;padding:12px 16px 4px}
  .plazas button{flex:1;padding:10px 6px;border:1px solid var(--linea);background:var(--sup);
       color:var(--suave);border-radius:12px;font-family:var(--texto);font-size:14px;
       font-weight:600;cursor:pointer}
  .plazas button.on{background:var(--cacao);color:var(--nata);border-color:var(--cacao)}
  .plazas .cuenta{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:1px}

  main{padding:8px 12px 40px;max-width:1180px;margin:0 auto}
  h2.plaza{font-family:var(--display);font-size:17px;font-weight:500;margin:22px 0 8px;
       padding-bottom:6px;border-bottom:2px solid var(--cafe);display:flex;
       justify-content:space-between;align-items:baseline;gap:10px}
  h2.plaza span{font-family:var(--texto);font-size:12px;color:var(--suave);font-weight:400}

  /* --- TABLA, estilo hoja de cálculo: rejilla visible, filas alternas y
         números alineados para poder comparar las horas de un vistazo. --- */
  .tabla-caja{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linea);
       border-radius:10px;background:var(--sup)}
  table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
  thead th{position:sticky;top:0;z-index:2;background:var(--cacao);color:var(--nata);
       font-family:var(--texto);font-size:11px;font-weight:700;letter-spacing:.4px;
       text-transform:uppercase;text-align:left;padding:9px 8px;white-space:nowrap;
       border-right:1px solid rgba(241,228,195,.18)}
  thead th:last-child{border-right:0}
  tbody td{padding:8px;border-top:1px solid var(--linea);border-right:1px solid var(--linea);
       vertical-align:top}
  tbody td:last-child{border-right:0}
  tbody tr:nth-child(even){background:var(--sup2)}
  /* Sin aceptar: la fila entera, con un filo rojo. Es lo que NO se cocina. */
  tbody tr.sinaceptar{background:var(--no-sup)}
  tbody tr.sinaceptar td:first-child{box-shadow:inset 4px 0 0 var(--no-f)}
  tbody tr:hover{outline:2px solid var(--cafe);outline-offset:-2px}

  /* La hora de recoger se queda pegada a la izquierda: con nueve columnas y
     scroll lateral, sin esto al llegar al contacto ya no sabes de qué pedido
     era la fila. */
  .c-rec{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;
       background:var(--sal-f);color:var(--sal-t);text-align:center;width:1%;
       position:sticky;left:0;z-index:1;border-right:2px solid var(--cafe)!important}
  thead th:first-child{position:sticky;left:0;z-index:3}
  tbody tr.sinaceptar .c-rec{background:var(--no-f);color:#fff}
  .c-rec small{display:block;font-size:9px;font-weight:600;opacity:.75;letter-spacing:.3px}
  /* La hora de entrega, en azul: es el compromiso con el cliente. */
  .c-hora{font-variant-numeric:tabular-nums;white-space:nowrap;width:1%}
  .c-hora b{display:inline-block;background:var(--ent-f);color:var(--ent-t);
       font-weight:800;font-size:13.5px;padding:3px 8px;border-radius:5px;letter-spacing:.2px}
  .c-hora .franja{display:block;font-size:10.5px;color:var(--suave);margin-top:2px;
       font-weight:600;letter-spacing:.2px}
  .c-num{font-size:11px;color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
  .c-cli{font-weight:700;min-width:170px;overflow-wrap:anywhere}
  .c-lugar{min-width:210px;overflow-wrap:anywhere;font-size:12.5px}
  .c-menu{font-size:11.5px;color:var(--suave);min-width:150px;overflow-wrap:anywhere}
  .c-pax{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .c-est{white-space:nowrap;text-align:center}
  .c-tel{font-size:11.5px;white-space:nowrap}
  .c-tel a{color:var(--cafe);text-decoration:none;font-weight:700}
  .nota{display:block;font-size:10.5px;color:var(--cafe);font-weight:600;margin-top:3px}
  .nota.aprox{color:var(--amb);font-weight:400;font-style:italic}
  .et{font-size:10px;font-weight:800;letter-spacing:.3px;padding:3px 7px;border-radius:4px;
      text-transform:uppercase;white-space:nowrap;display:inline-block}
  .et.ok{background:var(--okbg);color:var(--ok)}
  .et.no{background:var(--no-f);color:#fff}
  .tipo{font-size:9.5px;font-weight:800;letter-spacing:.3px;background:var(--cafe);
        color:var(--nata);padding:2px 5px;border-radius:3px;margin-left:5px}
  .pendiente{color:var(--amb);font-weight:700;font-size:11px}
  /* El total de cada plaza, como la fila de sumas de una hoja. */
  tfoot td{padding:8px;background:var(--sup2);border-top:2px solid var(--cafe);
       font-size:11.5px;font-weight:700;color:var(--suave)}
  .vacio{text-align:center;color:var(--suave);padding:34px 10px;font-size:14px}
  .aviso{background:var(--ambbg);color:var(--amb);padding:14px 16px;border-radius:var(--r);
         margin:16px;font-size:14px;line-height:1.5}
  .pie{text-align:center;color:var(--suave);font-size:11px;padding:18px 16px 30px}
  @media print{
    header,.dia,.plazas,.pie{display:none}
    body{background:#fff}
    .ped{break-inside:avoid;border-left-width:3px}
  }
</style>
</head>
<body>

<header>
  <h1>Agenda del día</h1>
  <p>Lo que hay que preparar y a qué hora se recoge</p>
</header>

<div class="dia">
  <button id="ant" aria-label="Día anterior">‹</button>
  <div class="centro">
    <b id="etiqueta">—</b>
    <input type="date" id="fecha">
  </div>
  <button id="sig" aria-label="Día siguiente">›</button>
  <button id="hoy" class="hoy-btn">HOY</button>
</div>

<div class="plazas" id="plazas"></div>
<main id="lista"></main>
<div class="pie" id="pie"></div>
<div class="pie" id="sello" aria-live="polite"></div>

<script src="agenda.js"></script>
<script>
const $ = id => document.getElementById(id);
// Todo dato que entra en innerHTML va escapado: los nombres y los lugares los
// escribe la oficina a mano y pueden traer cualquier cosa.
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tel = s => String(s==null?'':s).replace(/[^+\d]/g,'');

// ---------- Descifrado (mismo algoritmo que checklist_export.py) ----------
// agenda.js viaja cifrada porque el repositorio es público. La clave llega en
// el enlace (#k=...) y se queda guardada en este móvil.
async function descifrar(c){
  c = c || window.AGENDA_CIFRADA;
  if(!c) return null;
  let k = null;
  const m = location.hash.match(/[#&]k=([0-9a-fA-F]{32})/);
  if(m){ k = m[1]; try{ localStorage.setItem('eventos_clave', k); }catch(e){} }
  else { try{ k = localStorage.getItem('eventos_clave'); }catch(e){} }
  if(!k) return null;
  try{
    const key = Uint8Array.from(k.match(/../g).map(h=>parseInt(h,16)));
    const nonce = Uint8Array.from(atob(c.n), ch=>ch.charCodeAt(0));
    const data = Uint8Array.from(atob(c.d), ch=>ch.charCodeAt(0));
    const out = new Uint8Array(data.length);
    for(let off=0,i=0; off<data.length; off+=32,i++){
      const buf = new Uint8Array(key.length+nonce.length+4);
      buf.set(key); buf.set(nonce, key.length);
      new DataView(buf.buffer).setUint32(key.length+nonce.length, i);
      const blk = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
      for(let j=0; j<32 && off+j<data.length; j++) out[off+j] = data[off+j] ^ blk[j];
    }
    return JSON.parse(new TextDecoder().decode(out));
  }catch(e){ return null; }
}

// ---------- Fechas ----------
// Función y no constante: si el móvil se queda abierto toda la noche, una
// constante dejaría «HOY» clavado en el día de ayer.
function hoyISO(){ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
// En el móvil la cabecera es estrecha y «Hoy · martes, 20 de octubre» se cortaba
// con puntos suspensivos, así que ahí va abreviado.
const estrecho = () => window.matchMedia('(max-width:430px)').matches;
function fmt(iso){ const d=new Date(iso+'T00:00:00');
  return estrecho()
    ? DIAS[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3)
    : DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]; }
function etiquetaDe(iso){
  if(iso===hoyISO()) return 'Hoy · '+fmt(iso);
  const m=new Date(hoyISO()+'T00:00:00'); m.setDate(m.getDate()+1);
  const man=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0');
  if(iso===man) return 'Mañana · '+fmt(iso);
  const t = fmt(iso);
  return t.charAt(0).toUpperCase() + t.slice(1);   // «Martes, 20 de octubre»
}
function mueve(iso, dias){
  const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+dias);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ---------- Estado ----------
let TODO = [];
let dia = hoyISO();
let plaza = 'Todas';
const PLAZAS = ['Todas','Zaragoza','Madrid'];

function delDia(){ return TODO.filter(e => e.dia === dia); }

function pintarPlazas(){
  const hoy = delDia();
  $('plazas').innerHTML = PLAZAS.map(p => {
    const n = p==='Todas' ? hoy.length : hoy.filter(e=>e.ciudad===p).length;
    return `<button data-p="${esc(p)}" class="${p===plaza?'on':''}">${esc(p)}
      <span class="cuenta">${n} ${n===1?'pedido':'pedidos'}</span></button>`;
  }).join('');
  $('plazas').querySelectorAll('button').forEach(b =>
    b.onclick = () => { plaza = b.dataset.p; pintar(); });
}

// «ENTREGA 08:30 – 09:00 HRS» → la hora en grande y azul, y la franja debajo en
// pequeño. Repetir «ENTREGA» y «HRS» en cada fila no dice nada que no se sepa.
function horaBonita(txt){
  const t = String(txt || '');
  const m = t.match(/([01]?\d|2[0-3])[:.,h]([0-5]\d)/);
  if(!m) return esc(t);
  const primera = m[1].padStart(2,'0') + ':' + m[2];
  const resto = t.replace(/^\s*(ENTREGA|MONTADO|MONTAJE|RECOGIDA)\s*/i,'')
                 .replace(/\s*HRS?\.?\s*$/i,'').trim();
  // La segunda hora también a formato 08:30: la oficina las escribe de las dos
  // maneras («10.00 - 10.30») y mezclarlas en la misma columna se lee fatal.
  const dos = resto.match(/([01]?\d|2[0-3])[:.,h]([0-5]\d)/g) || [];
  const m2 = dos[1] ? dos[1].match(/([01]?\d|2[0-3])[:.,h]([0-5]\d)/) : null;
  const segunda = m2 ? m2[1].padStart(2,'0') + ':' + m2[2] : '';
  return `<b>${esc(primera)}</b>` + (segunda ? `<span class="franja">hasta ${esc(segunda)}</span>` : '');
}

function fila(e){
  // El estado ya no viaja como palabra repetida 197 veces: solo viene una
  // marca en las que NO estan aceptadas, que son las menos.
  const aceptado = !e.sin;
  const notas = [];
  if(e.con && e.con.length) notas.push(`<span class="nota">Con ${esc(e.con.join(', '))}</span>`);
  if(e.sin_situar) notas.push(`<span class="nota aprox">Hora orientativa: la dirección no está en el mapa</span>`);
  return `<tr class="${aceptado?'':'sinaceptar'}">
    <td class="c-rec">${e.recoge ? esc(e.recoge) : '<span class="pendiente">—</span>'}</td>
    <td class="c-hora">${e.hora ? horaBonita(e.hora) : '<span class="pendiente">por concretar</span>'}
        ${e.tipo && e.tipo !== 'REPARTO' ? `<span class="tipo">${esc(e.tipo)}</span>` : ''}</td>
    <td class="c-cli">${esc(e.cliente || 'Sin nombre')}${notas.join('')}</td>
    <td class="c-lugar">${esc(e.lugar || '—')}</td>
    <td class="c-pax">${e.pax ? esc(e.pax) : '—'}</td>
    <td class="c-menu">${esc(e.menu || '—')}</td>
    <td class="c-est"><span class="et ${aceptado?'ok':'no'}">${aceptado?'Aceptado':'Sin aceptar'}</span></td>
    <td class="c-num">${esc(e.enc || e.num)}</td>
    <td class="c-tel">${e.tel ? `<a href="tel:${esc(tel(e.tel))}">${esc(e.tel)}</a>` : '—'}
        ${e.contacto ? `<br>${esc(e.contacto)}` : ''}</td>
  </tr>`;
}

function bloque(titulo, lista){
  if(!lista.length) return '';
  const pax = lista.reduce((s,e)=>s+(Number(e.pax)||0),0);
  const sin = lista.filter(e=>e.sin).length;
  return `<h2 class="plaza">${esc(titulo)}
      <span>${lista.length} ${lista.length===1?'entrega':'entregas'}${pax?' · '+pax+' pax':''}${sin?' · '+sin+' sin aceptar':''}</span>
    </h2>
    <div class="tabla-caja"><table>
      <thead><tr>
        <th>Recoger</th><th>Entrega</th><th>Cliente</th><th>Lugar</th>
        <th>Pax</th><th>Qué lleva</th><th>Estado</th><th>Código</th><th>Contacto</th>
      </tr></thead>
      <tbody>${lista.map(fila).join('')}</tbody>
      <tfoot><tr><td colspan="9">${lista.length} entregas · ${pax} pax${sin?' · '+sin+' sin aceptar':''}</td></tr></tfoot>
    </table></div>`;
}

function pintar(){
  $('etiqueta').textContent = etiquetaDe(dia);
  $('fecha').value = dia;
  pintarPlazas();

  const hoy = delDia();
  if(!hoy.length){
    $('lista').innerHTML = `<p class="vacio">No hay nada para este día.</p>`;
  } else if(plaza === 'Todas'){
    // Zaragoza y Madrid por separado, que es como se trabaja.
    let h = '';
    for(const p of ['Zaragoza','Madrid']) h += bloque(p, hoy.filter(e=>e.ciudad===p));
    const otras = hoy.filter(e => e.ciudad!=='Zaragoza' && e.ciudad!=='Madrid');
    h += bloque('Sin plaza', otras);
    $('lista').innerHTML = h;
  } else {
    const sel = hoy.filter(e=>e.ciudad===plaza);
    $('lista').innerHTML = sel.length ? bloque(plaza, sel)
      : `<p class="vacio">Nada en ${esc(plaza)} para este día.</p>`;
  }
}

$('ant').onclick = () => { dia = mueve(dia,-1); pintar(); };
$('sig').onclick = () => { dia = mueve(dia, 1); pintar(); };
$('hoy').onclick = () => { dia = hoyISO(); pintar(); };
$('fecha').onchange = ev => { if(ev.target.value){ dia = ev.target.value; pintar(); } };
// Al girar el móvil cambia si el título cabe entero o va abreviado, así que se
// vuelve a pintar; si no, se queda cortado con puntos suspensivos.
let _reloj; addEventListener('resize', () => {
  clearTimeout(_reloj); _reloj = setTimeout(() => { if(TODO.length) pintar(); }, 150);
});

let ULTIMA = null;           // cuándo se leyeron los datos por última vez
let FIRMA = '';             // para no repintar si no ha cambiado nada

function pintarSello(){
  if(!ULTIMA){ $('sello').textContent = ''; return; }
  const min = Math.round((Date.now() - ULTIMA) / 60000);
  $('sello').textContent = min < 1 ? 'Actualizado ahora mismo'
    : (min === 1 ? 'Actualizado hace 1 minuto' : 'Actualizado hace ' + min + ' minutos');
}

// Vuelve a leer agenda.js sin recargar la página, así no se pierde el día que
// estabas mirando ni la posición de la tabla. El parámetro con la hora evita que
// el móvil sirva el fichero de su caché.
async function refrescar(primera){
  try{
    const r = await fetch('agenda.js?t=' + Date.now(), {cache: 'no-store'});
    if(!r.ok) return false;
    const txt = await r.text();
    const m = txt.match(/window\.AGENDA_CIFRADA\s*=\s*(\{[\s\S]*\})\s*;/);
    if(!m) return false;
    if(m[1] === FIRMA && !primera){ ULTIMA = Date.now(); pintarSello(); return true; }
    const datos = await descifrar(JSON.parse(m[1]));
    if(!Array.isArray(datos)) return false;
    FIRMA = m[1];
    TODO = datos;
    ULTIMA = Date.now();
    pintar();
    $('pie').textContent = TODO.length + ' entregas · se actualiza sola con cada pedido';
    pintarSello();
    return true;
  }catch(e){ return false; }
}

(async function(){
  // Primero lo que ya viene en la página, que es instantáneo.
  const datos = await descifrar();
  if(datos === null){
    document.querySelector('main').innerHTML =
      `<div class="aviso">Esta agenda va cifrada y en este móvil todavía no hay clave.
       Abre el enlace completo que te pasaron desde la app (el que acaba en <b>#k=…</b>)
       y se quedará guardada.</div>`;
    $('plazas').style.display = 'none';
    return;
  }
  TODO = Array.isArray(datos) ? datos : [];
  ULTIMA = Date.now();
  pintar();
  $('pie').textContent = TODO.length + ' entregas · se actualiza sola con cada pedido';
  pintarSello();

  // Y a partir de ahí se refresca sola: cada tres minutos, al volver a la
  // pantalla y al recuperar la conexión. Lo de volver a la pantalla es lo que
  // más importa: la agenda se deja abierta toda la mañana.
  setInterval(() => refrescar(false), 180000);
  setInterval(pintarSello, 30000);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) refrescar(false);
  });
  addEventListener('online', () => refrescar(false));
})();
</script>
</body>
</html>
