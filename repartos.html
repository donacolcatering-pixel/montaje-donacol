<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repartos">
<title>Repartos · Doña Col</title>
<link rel="manifest" href="repartos-manifest.json">
<link rel="apple-touch-icon" href="iconos/repartos-180.png">
<style>
  /* Tipografías de la marca, guardadas en la app (funcionan sin cobertura) */
  @font-face{font-family:"Hanken";src:url(fonts/hanken.woff2) format("woff2");font-weight:300 800;font-display:swap}
  @font-face{font-family:"Bodoni";src:url(fonts/bodoni.woff2) format("woff2");font-weight:400 700;font-display:swap}
  :root{
    --cacao:#1B1411; --cafe:#61422A; --taupe:#907A69; --nata:#F1E4C3;
    --fondo:#F4EFE6; --sup:#FFFFFF; --sup2:#EDE5D8; --tinta:#1F1712; --suave:#6B6058; --linea:rgba(31,23,18,.12);
    --acento:var(--cafe); --sobre:#FFFFFF;
    --ok:#2C7448; --okbg:#E1EFE5; --amb:#8A5208; --ambbg:#FAEAD0; --no:#A8322D;
    /* Tipo de entrega: catering (café de la marca) y desayuno web (frambuesa) */
    --rep:#61422A; --repbg:#EFE4D6; --desa:#B23A62; --desabg:#FBE3EB;
    --display:"Bodoni","Bodoni Moda",Didot,Georgia,serif;
    --texto:"Hanken",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r:16px; --nav:64px; --inf:env(safe-area-inset-bottom,0px); --sup-seg:env(safe-area-inset-top,0px);
  }
  /* De noche (los primeros repartos salen a las 7:45) la app pasa a oscuro con el móvil */
  @media (prefers-color-scheme:dark){:root{
    --fondo:#14100D; --sup:#211915; --sup2:#2C221D; --tinta:#F3EBDD; --suave:#B5A797; --linea:rgba(243,235,221,.14);
    --acento:var(--nata); --sobre:#1B1411; --ok:#79C795; --okbg:#1C3124; --amb:#F0B45C; --ambbg:#3A2A12; --no:#F08A80;
    --rep:#D9B48A; --repbg:#3A2C20; --desa:#F29BB8; --desabg:#3B1C28;
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--texto);background:var(--fondo);color:var(--tinta);font-size:16px;line-height:1.45;
       padding-bottom:calc(var(--nav) + var(--inf) + 12px);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body.en-detalle{padding-bottom:0}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  svg{width:20px;height:20px;flex:none}
  :focus-visible{outline:2px solid var(--acento);outline-offset:3px}

  /* Barra superior */
  .barra-app{position:sticky;top:0;z-index:20;background:var(--cacao);color:var(--nata);padding:calc(10px + var(--sup-seg)) 18px 10px;
             display:flex;align-items:center;gap:12px}
  .barra-app img{width:40px;height:40px;object-fit:contain;flex:none;border-radius:50%;background:#FBF4E7;padding:3px}
  .barra-app .titulo{font-family:var(--display);font-size:22px;line-height:1;font-weight:500}
  .barra-app .fecha{margin-left:auto;font-size:13px;color:rgba(241,228,195,.75);text-align:right}
  main{max-width:640px;margin:0 auto;padding:0 18px}

  /* Botones */
  .boton{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:12px 18px;border-radius:12px;
         font-weight:700;font-size:16px;background:var(--acento);color:var(--sobre);transition:transform .15s,opacity .2s}
  .boton:active{transform:scale(.97)}
  .boton.contorno{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
  .boton.ancho{width:100%}
  .boton:disabled{opacity:.45}

  /* Resumen del día */
  .dia{padding:22px 0 6px}
  .dia-titulo{display:flex;align-items:baseline;gap:12px}
  .dia-titulo h2{margin:0;font-family:var(--display);font-weight:500;font-size:40px;line-height:1}
  .dia-titulo span{color:var(--suave);font-size:15px}
  .progreso-texto{margin:14px 0 8px;font-size:15px;color:var(--suave)}
  .progreso-texto b{color:var(--tinta)}
  .progreso{display:flex;gap:4px;height:6px}
  .progreso i{flex:1;border-radius:3px;background:var(--linea);transition:background .4s}
  .progreso i.hecho{background:var(--ok)}

  /* Ciudad */
  .segmentos{display:flex;background:var(--sup2);border-radius:12px;padding:3px;margin:16px 0 0}
  .segmentos button{flex:1;min-height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--suave)}
  .segmentos button.on{background:var(--sup);color:var(--tinta);box-shadow:0 1px 4px rgba(0,0,0,.12)}

  /* Siguiente parada: lo más importante de la pantalla */
  .siguiente{margin:16px 0 6px;padding:20px;border-radius:20px;background:var(--cacao);color:var(--nata);
             box-shadow:0 12px 28px -20px rgba(27,20,17,.8)}
  @media (prefers-color-scheme:dark){.siguiente{background:var(--sup2)}}
  .sig-etiqueta{margin:0;font-size:14px;color:rgba(241,228,195,.75);display:flex;align-items:center;gap:8px}
  .sig-etiqueta::before{content:"";width:8px;height:8px;border-radius:50%;background:#E9B872;box-shadow:0 0 0 4px rgba(233,184,114,.25)}
  .sig-hora{margin:10px 0 4px;font-family:var(--display);font-weight:500;font-size:58px;line-height:.95;letter-spacing:-.01em}
  .sig-hora small{font-size:26px;margin-left:6px;opacity:.75}
  .siguiente h3{margin:6px 0 4px;font-size:22px;line-height:1.2;font-weight:700}
  .sig-dir{margin:0;font-size:16px;color:rgba(241,228,195,.85)}
  .sig-meta{margin:6px 0 0;font-size:14px;color:rgba(241,228,195,.65)}
  .sig-botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .sig-botones .boton{padding:12px 10px;gap:7px;font-size:15px;white-space:nowrap}
  .siguiente .boton{background:var(--nata);color:var(--cacao)}
  .siguiente .boton.contorno{background:transparent;color:var(--nata)}
  .siguiente.terminada{text-align:left}
  .siguiente.terminada .sig-hora{font-size:40px}

  /* Ruta: paradas unidas por una línea, como una hoja de ruta */
  .dia-sep{margin:30px 0 4px;font-size:20px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:10px}
  .dia-sep::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--dia,var(--taupe));flex:none}
  /* Una SALIDA del obrador: sus paradas y su ruta. Mismo color que su día */
  .salida{margin:12px 0 14px;padding:12px 12px 4px 10px;border-radius:16px;border-left:5px solid var(--dia,var(--taupe));
          background:var(--sup);box-shadow:inset 0 0 0 1px var(--linea)}
  @supports (background:color-mix(in srgb,red 10%,white)){
    .salida{background:color-mix(in srgb,var(--dia) 7%,var(--sup))}
  }
  .salida-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px 2px}
  .salida-cab .n{padding:3px 10px;border-radius:99px;background:var(--dia,var(--taupe));color:#fff;font-size:13px;font-weight:800}
  .salida-cab b{font-size:16px}
  .salida-cab span{color:var(--suave);font-size:14px}
  .salida-cab .franja{flex-basis:100%;margin-top:-2px}
  .salida .boton-ruta{margin:8px 0 4px;background:var(--sup)}
  .salida .boton-ruta svg{color:var(--dia,currentColor)}
  .aviso-salida{margin:8px 0 2px;padding:8px 12px;border-radius:10px;background:var(--ambbg);color:var(--amb);font-size:14px;font-weight:600}
  .ciudad-sep{margin:18px 0 8px;font-size:15px;font-weight:700;color:var(--suave)}
  .boton-ruta{display:flex;align-items:center;gap:10px;min-height:52px;margin:10px 0 6px;padding:12px 16px;border-radius:12px;
              background:var(--sup);box-shadow:inset 0 0 0 1px var(--linea);font-weight:700}
  .boton-ruta span{margin-left:auto;font-weight:500;color:var(--suave);font-size:14px}
  .ruta{list-style:none;margin:6px 0 0;padding:0}
  .parada{display:grid;grid-template-columns:58px 22px 1fr;column-gap:10px;cursor:pointer;min-height:84px}
  .parada:active .p-info{opacity:.6}
  .p-hora{padding-top:13px;text-align:right;font-size:17px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .p-hora small{display:block;margin-top:4px;font-family:var(--texto);font-size:12px;color:var(--suave)}
  .p-nodo{position:relative;display:flex;justify-content:center}
  .p-nodo::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--linea)}
  .parada:first-child .p-nodo::before{top:18px} .parada:last-child .p-nodo::before{bottom:calc(100% - 18px)}
  .p-nodo i{position:relative;margin-top:12px;width:20px;height:20px;border-radius:50%;background:var(--fondo);
            box-shadow:inset 0 0 0 2px var(--taupe);display:grid;place-items:center}
  .p-nodo i svg{width:12px;height:12px;color:#fff}
  .parada.ok .p-nodo i{background:var(--ok);box-shadow:none}
  .parada.sinsubir .p-nodo i{background:var(--amb);box-shadow:none}
  .parada.es-siguiente .p-nodo i{box-shadow:inset 0 0 0 6px var(--acento)}
  .p-info{padding:12px 0 16px;border-bottom:1px solid var(--linea);min-width:0;display:flex;flex-direction:column;gap:3px}
  .parada:last-child .p-info{border-bottom:0}
  .p-info b{font-size:17px;line-height:1.25}
  .p-dir{font-size:14px;color:var(--suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p-meta{font-size:14px}
  .parada.ok .p-info b,.parada.ok .p-hora{color:var(--suave)}
  .chip{align-self:flex-start;margin-top:4px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--sup2)}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.amb{background:var(--ambbg);color:var(--amb)}
  /* Catering y desayuno web, cada uno con su color: barra a la izquierda, anillo del punto y etiqueta */
  .parada .p-info{border-left:4px solid var(--rep);padding-left:12px;margin-bottom:8px;border-radius:2px}
  .parada.desayuno .p-info{border-left-color:var(--desa)}
  .parada.pend .p-nodo i{box-shadow:inset 0 0 0 2px var(--rep)}
  .parada.pend.desayuno .p-nodo i{box-shadow:inset 0 0 0 2px var(--desa)}
  .tipo{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;
        letter-spacing:.02em;text-transform:uppercase;background:var(--repbg);color:var(--rep)}
  .tipo.desa{background:var(--desabg);color:var(--desa)}
  .tipo svg{width:13px;height:13px}
  .leyenda{display:flex;gap:16px;margin:12px 0 0;font-size:13px;color:var(--suave)}
  .leyenda span{display:inline-flex;align-items:center;gap:6px}
  .leyenda i{width:12px;height:12px;border-radius:3px;background:var(--rep)}
  .leyenda i.desa{background:var(--desa)}
  .siguiente.desayuno{box-shadow:inset 0 5px 0 var(--desa),0 12px 28px -20px rgba(27,20,17,.8)}
  .siguiente .tipo{margin-bottom:2px}
  /* Ficha del desayuno: teléfono, tarjeta y nota */
  .det-desa{margin:0 0 16px;padding:14px;border-radius:14px;background:var(--desabg);display:flex;flex-direction:column;gap:10px}
  .det-desa .tel{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:12px;background:var(--desa);color:#fff;font-weight:800;font-size:17px}
  .det-desa .tarjeta{margin:0;font-size:16px;font-style:italic;line-height:1.4}
  .det-desa small{display:block;font-style:normal;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--desa);margin-bottom:2px}
  .det-desa p{margin:0}
  /* Contacto de un reparto de catering */
  .det-contacto{margin:0 0 16px;padding:14px;border-radius:14px;background:var(--sup2);display:flex;flex-direction:column;gap:10px}
  .det-contacto small{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--suave);margin-bottom:2px}
  .det-contacto p{margin:0;font-size:17px;font-weight:700}
  .det-contacto .tel{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:12px;background:var(--acento);color:var(--sobre);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .det-contacto .sin{font-size:15px;font-weight:500;color:var(--suave)}


  /* Desbloquear dentro de la app (iPhone: la app instalada no comparte la clave con Safari) */
  .desbloqueo{text-align:left;line-height:1.5}
  .desbloqueo .btn-pegar{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin:14px 0 10px;border:0;border-radius:12px;
       font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--acento,#61422A);color:var(--sobre,#fff)}
  .desbloqueo input{width:100%;min-height:50px;padding:12px 14px;border:0;border-radius:12px;font:inherit;font-size:16px;
       background:var(--sup,#fff);color:var(--tinta,#1F1712);box-shadow:inset 0 0 0 1.5px var(--linea,rgba(0,0,0,.12))}
  .desbloqueo .msg-clave{margin:8px 0 0;font-size:14px;min-height:1.2em}
  .vacio{margin:24px 0;padding:22px;border-radius:var(--r);background:var(--sup);text-align:center;color:var(--suave)}
  .aviso{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--ambbg);color:var(--amb);font-size:14px}
  .aviso .boton{min-height:44px;margin-top:10px;width:100%;background:var(--amb);color:var(--sup)}

  /* Entregados */
  #cardRegistro{display:none;padding-top:22px}
  body.vista-entregados #cardRegistro{display:block} body.vista-entregados #vistaRuta{display:none}
  #cardRegistro h2{margin:0 0 12px;font-family:var(--display);font-weight:500;font-size:36px;line-height:1}
  .reg{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea);cursor:pointer}
  .reg div{flex:1;min-width:0} .reg b{display:block} .reg span{font-size:14px;color:var(--suave)}
  .reg i{width:28px;height:28px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;flex:none}
  .reg i svg{width:14px;height:14px}

  /* Pestañas inferiores (como una app) */
  .pestanas{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;height:calc(var(--nav) + var(--inf));padding-bottom:var(--inf);
            background:var(--sup);box-shadow:0 -1px 0 var(--linea)}
  .pestanas button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--suave);position:relative}
  .pestanas button.on{color:var(--tinta)}
  .pestanas button svg{width:24px;height:24px}
  .pestanas b{position:absolute;top:8px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ok);color:#fff;font-size:12px;display:grid;place-items:center}
  .pestanas b:empty{display:none}
  body.en-detalle .pestanas{display:none}

  /* Detalle / entrega */
  #detalle{display:none;padding-bottom:20px}
  .volver{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:12px 0 0 -6px;padding:0 10px;font-weight:700;color:var(--suave)}
  .resumen{padding:6px 0 20px}
  .det-etiqueta{margin:0;font-size:14px;color:var(--suave)}
  .resumen h2{margin:6px 0 10px;font-family:var(--display);font-weight:500;font-size:34px;line-height:1.05}
  .det-hora{margin:0;font-size:18px;font-weight:700}
  .det-dir{margin:4px 0 0;font-size:16px}
  .det-meta{margin:4px 0 16px;font-size:15px;color:var(--suave)}
  .paso{padding:20px 0;border-top:1px solid var(--linea);scroll-margin-bottom:110px}
  .paso-titulo{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:18px;font-weight:700}
  .paso-titulo span{width:28px;height:28px;border-radius:50%;background:var(--acento);color:var(--sobre);display:grid;place-items:center;font-size:14px}
  .paso-titulo small{margin-left:auto;font-weight:500;font-size:14px;color:var(--suave)}
  .campo{width:100%;min-height:54px;padding:12px 14px;font-size:17px;border:0;border-radius:12px;background:var(--sup);
         box-shadow:inset 0 0 0 1.5px var(--linea);color:var(--tinta)}
  .campo:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acento)}
  .firmaWrap{position:relative;border-radius:12px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1.5px var(--linea)}
  #firma{width:100%;height:240px;display:block;touch-action:none}
  .firmaHint{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:15px;color:#7D6F63;pointer-events:none}
  .firmaLinea{position:absolute;left:24px;right:24px;bottom:38px;height:1px;background:#D9CFC2;pointer-events:none}
  .firmaBorrar{position:absolute;right:10px;top:10px;min-height:36px;padding:0 12px;border-radius:10px;background:#F1EBE2;color:#5A4B40;font-size:14px;font-weight:700}
  .camara{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:12px;background:var(--sup);
          box-shadow:inset 0 0 0 1.5px var(--linea);font-weight:700;cursor:pointer}
  .camara svg{width:24px;height:24px}
  #fotoInput{position:absolute;width:1px;height:1px;opacity:0}
  #fotoPrev{display:none;width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:10px}
  .barra-confirmar{position:sticky;bottom:0;margin:0 -18px;padding:12px 18px calc(12px + var(--inf));
                   background:linear-gradient(to top,var(--fondo) 75%,transparent)}
  .btnConfirmar{width:100%;min-height:58px;border-radius:12px;font-size:17px;font-weight:800;background:var(--ok);color:#fff}
  @media (prefers-color-scheme:dark){.btnConfirmar{color:#0F2417}}
  .btnConfirmar:disabled{opacity:.5}
  .campo.error{box-shadow:inset 0 0 0 2px var(--no)}
  /* El borde de la firma va por encima del lienzo (si no, el lienzo blanco lo tapa) */
  .firmaWrap::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1.5px var(--linea)}
  .firmaWrap.error::after{box-shadow:inset 0 0 0 2.5px var(--no)}
  .estadoMsg{margin:8px 0 0;min-height:1.2em;text-align:center;font-size:14px;color:var(--suave)}

  /* Entregado */
  #cardEntregado{padding:10px 0 20px;text-align:center}
  .ok-sello{width:84px;height:84px;margin:10px auto 14px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:sello .5s cubic-bezier(.2,1.4,.4,1) both}
  .ok-sello svg{width:40px;height:40px}
  .ok-sello.amb{background:var(--amb)}
  @keyframes sello{from{transform:scale(.4);opacity:0}}
  #cardEntregado h3{margin:0;font-family:var(--display);font-weight:500;font-size:34px}
  .ok-hora{margin:6px 0 2px;color:var(--suave)}
  .ok-obs{margin:12px auto 0;padding:10px 14px;border-radius:12px;background:var(--sup2);text-align:left;font-size:15px}
  #avisoPendiente{display:none;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--ambbg);color:var(--amb);font-size:14px;text-align:left}
  .pruebas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .pruebas a{display:block;border-radius:14px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--linea)}
  .pruebas a img{width:100%;height:130px;object-fit:contain;display:block;background:#fff}
  .pruebas a span{display:block;padding:8px;font-size:14px;font-weight:700;background:var(--sup);color:var(--tinta)}

  /* ===== Equipo ===== */
  .perfil-chip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 4px;border-radius:99px;
               background:rgba(241,228,195,.12);color:var(--nata);font-weight:700;font-size:14px}
  .perfil-chip i{width:28px;height:28px;border-radius:50%;background:var(--nata);color:var(--cacao);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
  .perfil-chip.fuera{padding:0 14px}
  #vistaEquipo{display:none;padding-top:22px}
  body.vista-equipo #vistaEquipo{display:block} body.vista-equipo #vistaRuta{display:none}

try{ firebase.initializeApp(firebaseConfig); DB=firebase.firestore(); }
catch(e){ console.warn('Firebase no disponible:', e); }
// Login ANÓNIMO: da un token para poder cerrar las reglas de Firestore (que hoy están
// abiertas). Es best-effort y NO bloquea: si el login anónimo aún no está activado en la
// consola, la app sigue funcionando (con las reglas abiertas actuales). Una vez la oficina
// active "Anonymous" y ponga las reglas, esto establece la sesión antes de leer/escribir.
// Pruebas en este ordenador: emuladores de Firebase (solo con ?emulador=1 y en localhost).
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]emulador=1/.test(location.search) && DB){
  firebase.auth().useEmulator('http://127.0.0.1:9099'); DB.useEmulator('127.0.0.1', 8080);
}
// ESPERAR A LA SESIÓN GUARDADA antes de entrar como anónimo (20/10/2026): al abrir la app, Firebase
// tarda un momento en recuperar la cuenta del repartidor; si en ese rato se entraba como anónimo,
// se perdía su sesión y tenía que volver a poner la contraseña.
let _sesionLista=null;
function sesionLista(){
  if(!_sesionLista) _sesionLista=new Promise(res=>{ const q=firebase.auth().onAuthStateChanged(u=>{ q(); res(u); }); });
  return _sesionLista;
}
async function ensureAuth(){
  if(!window.firebase || !firebase.auth) return;
  try{ await sesionLista(); if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); }
  catch(e){ console.warn('Auth anónima no disponible:', e.code||e.message); }
}

<script>
// Fotos y firmas → Cloudinary (gratis, sin tarjeta); el enlace se guarda en Firestore.
const CLOUDINARY={cloud:'drfjs9u7p', preset:'drfjs9u7p'};
const $=id=>document.getElementById(id);

// --- Seguridad: escapar TODO dato que se meta en innerHTML (los eventos y las entregas
// vienen de Firestore, que es escribible; sin escapar, un nombre/dirección con HTML podría
// ejecutar JavaScript en el móvil). safeUrl solo deja pasar http(s) en los enlaces.
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){u=String(u==null?'':u);return /^https?:\/\//i.test(u)?u:'';}

// ---------- Descifrado de eventos (idéntico a necesidades.html) ----------
// eventos.js viaja CIFRADO (el repo es público). La clave llega en el enlace (#k=...)
// y se recuerda en este móvil. Mismo algoritmo que checklist_export.py.
async function descifrarEventos(){
  const c=window.EVENTOS_MONTAJE_CIFRADO;
  if(!c)return Array.isArray(window.EVENTOS_MONTAJE)?window.EVENTOS_MONTAJE:[];
  let k=null;
  const m=location.hash.match(/[#&]k=([0-9a-fA-F]{32})/);
  if(m){k=m[1];try{localStorage.setItem('eventos_clave',k);}catch(e){}}
  else{try{k=localStorage.getItem('eventos_clave');}catch(e){}}
  if(!k)return null;
  try{
    const key=Uint8Array.from(k.match(/../g).map(h=>parseInt(h,16)));
    const nonce=Uint8Array.from(atob(c.n),ch=>ch.charCodeAt(0));
    const data=Uint8Array.from(atob(c.d),ch=>ch.charCodeAt(0));
    const out=new Uint8Array(data.length);
    for(let off=0,i=0;off<data.length;off+=32,i++){
      const buf=new Uint8Array(key.length+nonce.length+4);
      buf.set(key);buf.set(nonce,key.length);
      new DataView(buf.buffer).setUint32(key.length+nonce.length,i);
      const blk=new Uint8Array(await crypto.subtle.digest('SHA-256',buf));
      for(let j=0;j<32&&off+j<data.length;j++)out[off+j]=data[off+j]^blk[j];
    }
    return JSON.parse(new TextDecoder().decode(out));
  }catch(e){return null;}
}

// ---------- Fechas ----------
// Funcion, no constante: si el movil deja la app abierta toda la noche, una constante
// se quedaria en el dia de ayer y "HOY" y el filtro de proximos saldrian mal.
function hoyISO(){const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const DIAS_SEM=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtFecha(iso){const d=new Date(iso+'T00:00:00');
  return DIAS_SEM[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()];}
function etiquetaDia(iso){
  const hoy=hoyISO();
  if(iso===hoy)return 'HOY · '+fmtFecha(iso);
  const man=new Date(hoy+'T00:00:00');man.setDate(man.getDate()+1);
  const manISO=man.getFullYear()+'-'+String(man.getMonth()+1).padStart(2,'0')+'-'+String(man.getDate()).padStart(2,'0');
  if(iso===manISO)return 'MAÑANA · '+fmtFecha(iso);
  return fmtFecha(iso);
}
function ahoraTexto(){const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

// ---------- Estado ----------
let REPARTOS=[];          // eventos con montaje=NO
let ENTREGAS={};          // enc -> doc de Firestore (entregas ya confirmadas)
let pedidoActual=null;    // evento seleccionado
// Si falla la lectura de entregas, TODO sale como "pendiente" aunque este entregado.
// Antes se tragaba en silencio: por eso paso mes y medio sin que nadie notara que las
// reglas de Firestore estaban caducadas. Ahora se avisa en pantalla.
let AVISO_ENTREGAS='';

// ¿Es un reparto (entrega a domicilio)? Usa el 'tipo' del evento; para datos antiguos
// sin tipo, cae a: sin montaje y que NO empiece por RECOG (recogida en obrador).
function esReparto(e){
  const t=(e.tipo||'').toUpperCase();
  if(t) return t==='REPARTO';
  if(String(e.montaje||'NO').toUpperCase()!=='NO') return false;
  return !/^\s*RECOG/i.test(e.hora||'');
}

// ¿Es un desayuno de la tienda web? (los da de alta la app central con el código WEB-<nº>)
function esDesayuno(e){ return /^WEB-/i.test((e&&e.enc)||'') || /^DESAYUNO WEB/i.test((e&&e.empresa)||''); }
// El nombre sin el prefijo «DESAYUNO WEB ·» (la etiqueta de color ya dice qué es)
function nombreParada(e){ return String(e.empresa||'(sin nombre)').replace(/^DESAYUNO WEB\s*·\s*/i,''); }
// Debajo del nombre: en un desayuno, lo que se lleva; en catering, el menú y los comensales
function metaParada(e){ return esDesayuno(e) ? (e.menu||'') : (e.menu||'Menú sin indicar')+' para '+(e.pax||0)+' personas'; }
function etiquetaTipo(e){
  return esDesayuno(e)
    ? '<span class="tipo desa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15c0-4 3.5-8 8-8s8 4 8 8"/><path d="M3 15h18M7 15c0-2 2-4 5-4s5 2 5 4"/></svg>Desayuno</span>'
    : '<span class="tipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Reparto</span>';
}
// De la descripción que manda la app central: teléfonos, tarjeta y nota del desayuno
function datosDesayuno(e){
  const d=String(e.desc||''), m=(re)=>{const x=d.match(re);return x?x[1].trim():'';};
  const tel=m(/Tel\. destinatario:\s*([^\n]+)/i);
  return { tels: tel ? tel.split(/\s*[-\/,]\s*/).filter(t=>t.replace(/\D/g,'').length>=9) : [],
           tarjeta: m(/TARJETA:\s*([^\n]+)/i), nota: m(/Nota:\s*([^\n]+)/i) };
}

// Contacto y teléfonos de cualquier parada (20/10/2026). La central exporta contacto, tel y movil;
// los desayunos web traen además «Tel. destinatario» en la descripción. Un número por botón, sin repetir.
function telefonosParada(e){
  const crudos=[e.tel, e.movil];
  const d=String(e.desc||'').match(/Tel\. destinatario:\s*([^\n]+)/i);
  if(d)crudos.push(d[1]);
  const vistos={}, out=[];
  crudos.filter(Boolean).forEach(t=>String(t).split(/\s*[\/,;·]\s*|\s+-\s+/).forEach(x=>{
    const ver=x.replace(/^(m[oó]vil|tel[eé]fono|tel\.?|fijo)\s*:?\s*/i,'').trim();
    const num=ver.replace(/[^\d+]/g,'');
    if(num.replace(/\D/g,'').length>=9 && !vistos[num]){vistos[num]=1; out.push({ver, num});}
  }));
  return out;
}
const ICO_TEL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>';
const botonTel=t=>'<a class="tel" href="tel:'+esc(t.num)+'">'+ICO_TEL+' Llamar al '+esc(t.ver)+'</a>';

// ---------- Lista ----------
// Iconos propios (los emojis se ven distintos en cada móvil)
const _svg=(p,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.9}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO={
  check:_svg('<path d="M5 12.5 10 17 19 7"/>',3),
  navegar:_svg('<path d="M3 11 21 3l-8 18-2-8z"/>'),
  firma:_svg('<path d="M4 20c3 0 4-6 7-6s1 4 4 4 3-3 5-3"/><path d="m14 4 6 6"/>'),
  mapa:_svg('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>'),
  chevron:_svg('<path d="m9 6 6 6-6 6"/>'),
  reloj:_svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')
};
// La hora viene escrita a mano ('ENTREGA 8.30 - 9.00', 'ENTREGA 07:45 – 08:15', 'ENTREGA PDTE').
// Se saca la franja limpia: {ini:'8:30', fin:'9:00'}; si no hay hora, un texto corto.
function horaCorta(txt){
  const t=String(txt==null?'':txt);
  const ms=[...t.matchAll(/\b([01]?\d|2[0-3])[:.,h]([0-5]\d)\b/g)].map(m=>parseInt(m[1],10)+':'+m[2]);
  if(ms.length) return {ini:ms[0], fin:ms[1]||'', texto:''};
  const resto=t.replace(/^\s*entrega\s*/i,'').trim();
  return {ini:'', fin:'', texto: !resto || /pdte|pend/i.test(resto) ? 'Hora por confirmar' : resto};
}
function capital(s){return s.charAt(0).toUpperCase()+s.slice(1);}
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtFechaLarga(iso){const d=new Date(iso+'T00:00:00');return capital(DIAS_SEM[d.getDay()])+', '+d.getDate()+' de '+MESES_L[d.getMonth()];}
function etiquetaBonita(iso){
  const hoy=hoyISO(); if(iso===hoy) return 'Paradas de hoy';
  const man=new Date(hoy+'T00:00:00');man.setDate(man.getDate()+1);
  const manISO=man.getFullYear()+'-'+String(man.getMonth()+1).padStart(2,'0')+'-'+String(man.getDate()).padStart(2,'0');
  return iso===manISO ? 'Mañana, '+fmtFecha(iso) : capital(fmtFecha(iso));
}
// LO QUE GOOGLE MAPS PUEDE ENCONTRAR de una direccion escrita a mano. La oficina
// apunta donde hay que ENTREGAR, no una direccion postal: «HOSPITAL MIGUEL SERVET -
// PARITORIO + QUIROFANO INFANTIL 3ª PLANTA» (reparto del 20/10/2026). Mandado tal
// cual, Maps busca la frase entera, no encuentra nada y el repartidor se queda sin
// navegacion. Aqui se corta por el primer detalle de interior y se le añade la
// ciudad si no la lleva. El texto completo se sigue viendo en la tarjeta: el
// repartidor necesita saber que es el paritorio.
var _INTERIOR = /\b(paritorio|quir[oó]fanos?|plantas?|plta|pta|piso|despachos?|consultas?|externas?|urgencias|reanimaci[oó]n|neurocirug[ií]a|oftalmolog[ií]a|traumatolog[ií]a|salas?|sal[oó]n|aula|pabell[oó]n|bloque|escalera|puerta|box|ala|unidad|hospitalizaci[oó]n|sesiones|infantil)\b/i;
var _VACIO = /^(?:de|del|la|el|los|las|en|a|al|y|o|con|para|por|su|un|una|entrando|mano|izda|dcha|izquierda|derecha)$/i;
var _BORDES = /^[\s,;:.\-–(){}\[\]+]+|[\s,;:.\-–(){}\[\]+]+$/g;
// Sin lookbehind a proposito: Safari de iOS no lo soporta hasta la 16.4 y esto se
// abre en el movil de los repartidores; un regex que no compila tumba TODO el script.
var _CP = /(^|\D)\d{5}(\D|$)/;

function _recorta(t){
  var p = t.replace(_BORDES,'').trim(), q;
  while(true){
    q = p.replace(/[\s,]+\d+\s*[ªº°a-z]?$/i,'').replace(_BORDES,'').trim();
    if(q === p) break;
    p = q;
  }
  return p;
}
function _nucleo(t){
  var m = t.match(_INTERIOR);
  // SIN detalle de interior el trozo vale entero: ahi viven el portal («Nestares
  // 10»), el numero suelto («, 74,») y el codigo postal.
  if(!m) return t.replace(_BORDES,'').trim();
  // CON detalle de interior cortamos antes y quitamos el ordinal que queda
  // colgando («HOSPITAL SERVET 2ª PLANTA» -> «HOSPITAL SERVET»).
  var n = _recorta(t.slice(0, m.index));
  var palabras = n.split(/\s+/).filter(function(w){
    return w.replace(/[^A-Za-zÀ-ÿ]/g,'').length >= 3 && !_VACIO.test(w); });
  return palabras.length ? n : '';
}
function queryMapa(e){
  var bruto = String((e && (e.direccion || e.empresa)) || '').trim();
  if(!bruto) return '';
  var trozos = bruto.split(/\s*[,;]\s*|\s+[-–—]\s+|\s*[()]\s*/)
                    .map(function(x){ return x.trim(); }).filter(Boolean);
  var buenos = [];
  for(var i=0;i<trozos.length;i++){
    var n = _nucleo(trozos[i]);
    if(n) buenos.push(n);
    else if(buenos.length) break;   // ya teniamos algo: paramos en el primer detalle
  }
  var q = buenos.join(', ') || _nucleo(bruto) || bruto;
  var ciudad = String((e && e.ciudad) || '').trim();
  if(ciudad && !_CP.test(q) && q.toLowerCase().indexOf(ciudad.toLowerCase().slice(0,6)) < 0)
    q += ', ' + ciudad;
  return q;
}
// «Cómo llegar» = la RUTA hasta el sitio desde donde estás (antes buscaba el sitio)
const urlMaps=e=>'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(queryMapa(e));
// ===== Abrir la APP de mapas, no la web (20/10/2026) =====
const SO_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const SO_ANDROID=/Android/i.test(navigator.userAgent), EN_APK=/DonaColRepartosApp/.test(navigator.userAgent);
function prefMapas(){ try{ return localStorage.getItem('pref_mapas')||'google'; }catch(e){ return 'google'; } }
function urlAppleMaps(href){
  const u=new URL(href), p=u.searchParams;
  if(/\/maps\/search\//.test(u.pathname)) return 'maps://?q='+encodeURIComponent(p.get('query')||'');
  // Apple Maps no admite varias paradas en el enlace: lleva a la PRIMERA de la ruta
  const primera=(p.get('waypoints')||'').split('|').filter(Boolean)[0]||p.get('destination')||'';
  return 'maps://?daddr='+encodeURIComponent(primera)+'&dirflg=d'+(p.get('origin')&&!p.get('waypoints')?'&saddr='+encodeURIComponent(p.get('origin')):'');
}
function abrirEnMapas(href){
  if(EN_APK){ location.href=href; return; }
  if(SO_ANDROID){
    location.href='intent://'+href.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url='+encodeURIComponent(href)+';end';
    return;
  }
  if(SO_IOS){
    if(prefMapas()==='apple'){ location.href=urlAppleMaps(href); return; }
    // Google Maps instalado: se abre la app y la página pasa a segundo plano. Si no, a la web.
    const t=setTimeout(()=>{ if(!document.hidden) location.href=href; }, 1500);
    document.addEventListener('visibilitychange', function q(){ if(document.hidden){ clearTimeout(t); document.removeEventListener('visibilitychange', q); } });
    location.href='comgooglemapsurl://'+href.replace(/^https?:\/\//,'');
    return;
  }
  window.open(href,'_blank','noopener');
}
document.addEventListener('click', e=>{
  const a=e.target.closest && e.target.closest('a[href*="google.com/maps"]');
  if(!a) return;
  e.preventDefault(); abrirEnMapas(a.href);
}, true);

// Ruta de una SALIDA en Google Maps con sus paradas (sin API key: Maps calcula la
// ruta al abrir). Origen = el obrador de la ciudad; paradas en el orden de la lista.
// La ruta EMPIEZA EN EL OBRADOR de la ciudad (20/10/2026). Antes salía de donde estuviera el
// móvil: abierta desde Madrid, una ruta de Zaragoza daba 3 horas (el viaje Madrid-Zaragoza).
// Mismas direcciones que la app central (rutas_reparto.py).
const OBRADOR={Madrid:'Calle Nestares 10, 28045 Madrid', Zaragoza:'Avenida Pablo Gargallo 118, 50003 Zaragoza'};
function urlRutaDia(entregas){
  const dirs=entregas.map(queryMapa).filter(Boolean).map(encodeURIComponent);
  if(!dirs.length) return null;
  const origen=OBRADOR[normCiudad(entregas[0]&&entregas[0].ciudad)];
  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving'
       +(origen?'&origin='+encodeURIComponent(origen):'')+'&destination='+dirs[dirs.length-1];
  const wp=dirs.slice(0,-1).join('%7C');
  if(wp) u+='&waypoints='+wp;
  return u;
}
// SALIDAS DEL OBRADOR (20/10/2026). Ver la explicación al principio de parche_salidas.py:
// 8 min por entrega, salida media hora antes, y una salida nueva cuando da tiempo a volver al obrador.
const ENTREGA_MIN=8, SALIDA_ANTES=30, HUECO_VUELTA=60;
function finFranja(e){        // fin de la franja escrita ('12:00 - 12:30'); si no hay, inicio + 30
  const t=[...String(e.hora||'').matchAll(/\b([01]?\d|2[0-3])[:.,h]([0-5]\d)\b/g)].map(m=>parseInt(m[1],10)*60+parseInt(m[2],10));
  return t.length>1 ? t[1] : (t.length ? t[0]+30 : 99999);
}
const hhmm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
function salidasDe(grupo){
  const conHora=grupo.filter(e=>minutosHora(e.hora)<99999), sinHora=grupo.filter(e=>minutosHora(e.hora)>=99999);
  const out=[]; let cur=null, libre=0;
  conHora.forEach(e=>{
    const ini=minutosHora(e.hora);
    if(!cur || ini-libre>HUECO_VUELTA){ cur={paradas:[], ini, fin:0}; out.push(cur); libre=ini; }
    // Varias en la misma franja: se encadenan desde el inicio de la franja. Aviso honesto si,
    // solo con los 8 min de cada entrega (sin contar el trayecto, que lo da Maps), ya se llega
    // a una parada después del final de SU franja.
    const llega=Math.max(libre, ini);
    if(llega>finFranja(e)) cur.justo=true;
    libre=llega+ENTREGA_MIN;
    cur.paradas.push(e); cur.fin=Math.max(cur.fin, finFranja(e));
    cur.terminaSobre=libre;
  });
  out.forEach(t=>{ t.sale=t.ini-SALIDA_ANTES; });
  if(sinHora.length) out.push({paradas:sinHora, sinHora:true});
  return out;
}

// DESBLOQUEAR DESDE LA APP (20/10/2026). En iPhone la app instalada no comparte la clave con Safari
// y no hay barra donde abrir el enlace: se pega aquí. Vale el enlace completo o la clave sola.
function claveDeTexto(t){
  t=String(t||'');
  const m=t.match(/[#&?]k=([0-9a-fA-F]{32})/)||t.match(/^\s*([0-9a-fA-F]{32})\s*$/);
  return m?m[1].toLowerCase():null;
}
function desbloquearCon(t, msg){
  const k=claveDeTexto(t);
  if(!k){ if(msg) msg.textContent='Eso no es el enlace completo: tiene que llevar la clave (…#k=…). Pídeselo a la oficina.'; return false; }
  try{ localStorage.setItem('eventos_clave',k); }catch(e){}
  if(msg) msg.textContent='Desbloqueado. Cargando…';
  location.reload(); return true;
}
function htmlDesbloqueo(que){
  return '<div class="desbloqueo"><b>'+que+' bloqueados.</b> Solo hay que desbloquearlos una vez en este móvil: '
    +'copia el <b>enlace completo</b> que te pasó la oficina (en WhatsApp, mantén pulsado el enlace y toca «Copiar») y pégalo aquí.'
    +'<button type="button" class="btn-pegar" id="btnPegarClave">Pegar enlace</button>'
    +'<input type="text" id="campoClave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…o mantén pulsado aquí y pega">'
    +'<p class="msg-clave" id="msgClave"></p></div>';
}
function activarDesbloqueo(){
  const msg=document.getElementById('msgClave'), campo=document.getElementById('campoClave'), btn=document.getElementById('btnPegarClave');
  if(btn) btn.onclick=async()=>{
    try{ const t=await navigator.clipboard.readText(); desbloquearCon(t,msg); }
    catch(e){ msg.textContent='No he podido leer lo copiado. Mantén pulsado el recuadro de abajo y toca «Pegar».'; if(campo) campo.focus(); }
  };
  if(campo) campo.addEventListener('input',()=>{ if(claveDeTexto(campo.value)) desbloquearCon(campo.value,msg); });
}

// La ciudad viene como texto libre desde la oficina ('Madrid', 'Zaragoza', 'ZGZ'...).
function normCiudad(c){
  const t = (c||'').trim().toLowerCase();
  if (t.startsWith('madrid')) return 'Madrid';
  if (t.startsWith('zaragoza') || t.startsWith('zgz')) return 'Zaragoza';
  return (c||'').trim() || 'Sin ciudad';
}

}

// LA HORA, EN MINUTOS, PARA PODER ORDENAR POR ELLA. Las horas se escriben a mano
// ('ENTREGA 10.00 - 10.30 HRS', 'ENTREGA 8.30 - 9.00', 'ENTREGA 07:45 – 08:15') y
// antes se comparaban COMO TEXTO: asi '8.30' queda DETRAS de '10.00', porque el 8
// es mayor que el 1. El 15/10/2026 el repartidor de Madrid veia el de las 10:00 el
// primero y el de las 9:30 el ultimo, que era justo el que tenia que hacer antes.
// Los que no llevan hora ('ENTREGA PDTE') van al final, no los primeros.
function minutosHora(txt){
  const m=String(txt==null?'':txt).match(/\b([01]?\d|2[0-3])[:.,h]([0-5]\d)\b/);
  return m ? (parseInt(m[1],10)*60+parseInt(m[2],10)) : 99999;
}

function tarjetaSiguiente(e){
  const h=horaCorta(e.hora);
  return `<section class="siguiente${esDesayuno(e)?' desayuno':''}" data-enc="${esc(e.enc)}" data-fecha="${esc(e.fecha||'')}">
    <p class="sig-etiqueta">Siguiente parada</p>
    <div class="sig-hora">${h.ini?esc(h.ini)+(h.fin?`<small>– ${esc(h.fin)}</small>`:''):`<small style="margin:0">${esc(h.texto)}</small>`}</div>
    ${etiquetaTipo(e)}
    <h3>${esc(nombreParada(e))}</h3>
    <p class="sig-dir">${esc(e.direccion||'Sin dirección')}</p>
    <p class="sig-meta">${esc(metaParada(e))}</p>
    <div class="sig-botones">
      ${e.direccion?`<a class="boton contorno" href="${esc(urlMaps(e))}" target="_blank" rel="noopener">${ICO.navegar} Cómo llegar</a>`:''}
      <button class="boton" data-abrir${e.direccion?'':' style="grid-column:1/-1"'}>${ICO.firma} Entregar</button>
      ${(()=>{const t=telefonosParada(e)[0]; return t?`<a class="boton contorno" style="grid-column:1/-1" href="tel:${esc(t.num)}">${ICO_TEL} Llamar${e.contacto?' a '+esc(e.contacto):''}</a>`:'';})()}
    </div>
  </section>`;
}

function pintarLista(){
  pintarCola();
  const cont=$('pedidos');
  let prox=REPARTOS.filter(e=>e.fecha>=hoyISO());
  if(CIUDAD) prox=prox.filter(e=>normCiudad(e.ciudad)===CIUDAD);
  // Repartidor con cuenta: «Míos» enseña solo lo que lleva él, y las salidas, horas y rutas
  // se calculan con SUS pedidos. «Todos» es la vista de siempre.
  const verUid = uidRuta(), verMios = !!verUid;
  if(verMios) prox=prox.filter(e=>{ const a=asignacionDe(e); return a && a.uid===verUid; });
  prox.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(minutosHora(a.hora)-minutosHora(b.hora))||(finFranja(a)-finFranja(b))||a.enc.localeCompare(b.enc));

  // Resumen del día: cuántas llevas y cuántas faltan
  const hoy=hoyISO(), deHoy=prox.filter(e=>e.fecha===hoy), hechos=deHoy.filter(e=>entregaDe(e)).length;
  $('resumenDia').innerHTML=`<div class="dia-titulo"><h2>Hoy</h2><span>${esc(capital(fmtFecha(hoy)))}</span></div>`
    +(deHoy.length
      ? `<p class="progreso-texto"><b>${hechos} de ${deHoy.length}</b> entregados${CIUDAD?' en '+esc(CIUDAD):''}</p>
         <div class="progreso">${deHoy.map(e=>`<i class="${entregaDe(e)?'hecho':''}"></i>`).join('')}</div>`
      : `<p class="progreso-texto">Sin repartos para hoy${CIUDAD?' en '+esc(CIUDAD):''}.</p>`)
    +(prox.some(esDesayuno) ? '<p class="leyenda"><span><i></i>Reparto de catering</span><span><i class="desa"></i>Desayuno web</span></p>' : '');

  const aviso = AVISO_ENTREGAS
    ? `<p class="aviso"><b>No he podido comprobar qué repartos están ya entregados.</b> Los que no salen como entregados quizá estén hechos. <small>(${esc(AVISO_ENTREGAS)})</small></p>`
    : '';
  if(!prox.length && !verMios){
    cont.innerHTML = aviso + (CIUDAD
      ? `<p class="vacio">No hay repartos pendientes en <b>${esc(CIUDAD)}</b>.<br>Pulsa «Todas» para ver los de la otra ciudad.</p>`
      : '<p class="vacio">No hay pedidos de reparto pendientes.<br>Aparecerán aquí en cuanto la oficina genere las hojas.</p>');
    return;
  }
  const ciudadesHoy=[...new Set(REPARTOS.filter(e=>e.fecha===hoy).map(e=>normCiudad(e.ciudad)))].sort();
  const elegirCiudad=!CIUDAD && ciudadesHoy.length>1;
  const sig=elegirCiudad ? null : deHoy.find(e=>!entregaDe(e));
  let html=aviso;
  if(VER_UID){ const q=EQUIPO.find(p=>p.uid===VER_UID);
    html+=`<div class="mios"><button class="on">Ruta de ${esc(q?q.nombre.split(' ')[0]:'')}</button><button data-mios="todos">Ver todos</button></div>`; }
  else if(esRepartidor()) html+=`<div class="mios"><button data-mios="1" class="${SOLO_MIOS?'on':''}">Míos</button><button data-mios="0" class="${SOLO_MIOS?'':'on'}">Todos</button></div>`;
  if(verMios && !prox.length) html+= VER_UID&&VER_UID!==(USUARIO&&USUARIO.uid) ? '<p class="vacio">No tiene repartos asignados.</p>'
      : '<p class="vacio">No tienes repartos asignados.<br>Ve a <b>Equipo</b> y quédate los tuyos con «Me lo llevo».</p>';
  if(elegirCiudad) html+=`<section class="siguiente elegir"><p class="sig-etiqueta">Para ver tu siguiente parada</p>
      <h3>¿En qué ciudad repartes hoy?</h3>
      <div class="sig-botones">${ciudadesHoy.map(c=>`<button class="boton" data-elegir-ciudad="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <p class="sig-meta">Se queda guardado en este móvil. Puedes cambiarlo arriba.</p></section>`;
  else if(sig) html+=tarjetaSiguiente(sig);
  else if(deHoy.length) html+=`<section class="siguiente terminada"><p class="sig-etiqueta">Ruta de hoy</p><div class="sig-hora">Terminada</div><p class="sig-dir">Las ${deHoy.length} entregas de hoy están hechas.</p></section>`;

  const dias={};
  prox.forEach(e=>{ (dias[e.fecha]=dias[e.fecha]||[]).push(e); });
  Object.keys(dias).sort().forEach((fecha,iDia)=>{
    const color=COLORES_DIA[iDia%COLORES_DIA.length];
    html+=`<div class="dia-bloque" style="--dia:${color}"><h2 class="dia-sep">${esc(etiquetaBonita(fecha))}</h2>`;
    // Dentro de cada día se agrupa por CIUDAD. No es solo estético: la ruta de Maps
    // no puede mezclar Madrid y Zaragoza, saldrían 300 km de por medio.
    const porCiudad={};
    dias[fecha].forEach(e=>{ const c=normCiudad(e.ciudad); (porCiudad[c]=porCiudad[c]||[]).push(e); });
    const ciudades=Object.keys(porCiudad).sort();
    ciudades.forEach(ciudad=>{
      const grupo=porCiudad[ciudad];
      if(!CIUDAD && ciudades.length>1) html+=`<h3 class="ciudad-sep">${esc(ciudad)}</h3>`;
      const sals=salidasDe(grupo);
      sals.forEach((t,iS)=>{
      const conDir=t.paradas.filter(e=>e.direccion);
      const rutaUrl=urlRutaDia(t.paradas);
      const nParadas=t.paradas.length+(t.paradas.length===1?' parada':' paradas');
      html+='<section class="salida">';
      html+= t.sinHora
        ? `<div class="salida-cab"><span class="n">Sin hora</span><span>${nParadas} por confirmar con la oficina</span></div>`
        : `<div class="salida-cab"><span class="n">Salida ${iS+1}</span><b>Sale ${esc(hhmm(t.sale))}</b>`
          +`<span class="franja">Entregas de ${esc(hhmm(t.ini))} a ${esc(hhmm(t.fin))} · ${nParadas}</span></div>`;

// La clave de la entrega lleva la FECHA porque el codigo ENC se repite cada semana
// ('X-1Z' = miercoles, nº1, Zaragoza). Guardando solo por enc, dos repartos distintos
// compartian documento y la firma del segundo borraba la del primero.
function claveEntrega(ev){ return (ev.fecha||'sinfecha') + '_' + ev.enc; }
// Compatibilidad: los documentos guardados antes del 2026-08-31 usan solo el enc.
function entregaDe(ev){ return ENTREGAS[claveEntrega(ev)] || PENDIENTES[claveEntrega(ev)] || ENTREGAS[ev.enc] || null; }
// ¿Esta entregada pero todavia sin subir?
function estaPendiente(ev){ return !!PENDIENTES[claveEntrega(ev)]; }

function buscarEvento(enc, fecha){
  const ev = (fecha && REPARTOS.find(e=>e.enc===enc && e.fecha===fecha))
          || REPARTOS.find(e=>e.enc===enc);
  if(ev) return ev;
  const en = ENTREGAS[(fecha||'sinfecha')+'_'+enc] || ENTREGAS[enc];
  return en ? { enc, empresa:en.empresa, fecha:en.fecha, direccion:en.direccion,
                hora:en.hora_prevista, pax:en.pax, menu:en.menu } : null;
}

// ---------- Firma (canvas) ----------
let ctx=null, dibujando=false, hayFirma=false, ultimo=null;
function prepararFirma(){
  const cv=$('firma');
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||300, h=cv.clientHeight||240;
  cv.width=w*dpr; cv.height=h*dpr;
  ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2.8; ctx.lineCap='round'; ctx.lineJoin='round';
  hayFirma=false; $('firmaHint').style.display='';
}
function posFirma(ev){
  const cv=$('firma'), r=cv.getBoundingClientRect();
  const p=ev.touches?ev.touches[0]:ev;
  return {x:p.clientX-r.left, y:p.clientY-r.top};
}
function iniciarTrazo(ev){ev.preventDefault();dibujando=true;ultimo=posFirma(ev);
  if(!hayFirma){hayFirma=true;$('firmaHint').style.display='none';}}
function moverTrazo(ev){
  if(!dibujando)return; ev.preventDefault();
  const p=posFirma(ev);
  ctx.beginPath();ctx.moveTo(ultimo.x,ultimo.y);ctx.lineTo(p.x,p.y);ctx.stroke();
  ultimo=p;
}
function finTrazo(){dibujando=false;}
(function bindFirma(){
  const cv=$('firma');
  cv.addEventListener('pointerdown',iniciarTrazo);
  cv.addEventListener('pointermove',moverTrazo);
  window.addEventListener('pointerup',finTrazo);
  // respaldo táctil para navegadores antiguos sin pointer events
  cv.addEventListener('touchstart',iniciarTrazo,{passive:false});
  cv.addEventListener('touchmove',moverTrazo,{passive:false});
  cv.addEventListener('touchend',finTrazo);
})();
$('btnBorrarFirma').onclick=()=>prepararFirma();

// ---------- Subir a Cloudinary ----------
function subirCloudinary(fileOrBlob, enc, tipo){
  const fd=new FormData();
  fd.append('file', fileOrBlob);
  fd.append('upload_preset', CLOUDINARY.preset);
  fd.append('folder', 'repartos/'+enc);
  fd.append('tags', enc+','+tipo);
  return fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/image/upload`,{method:'POST',body:fd})
    .then(r=>r.json())
    .then(d=>{ if(!d.secure_url) throw new Error((d.error&&d.error.message)||'subida rechazada'); return d.secure_url; });
}
function canvasABlob(){return new Promise(res=>$('firma').toBlob(res,'image/png'));}

// Ubicación GPS best-effort (prueba de dónde se firmó). No bloquea si se deniega.
function ubicacion(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),
    ()=>res(null),{timeout:6000,maximumAge:120000});
});}

// ---------- Cola offline ----------
// Sin cobertura, el repartidor recogia la firma y NO podia guardarla: al salir de la
// pantalla se perdia. Ahora la entrega (con firma y foto) se guarda en el propio movil
// con IndexedDB —localStorage no vale, las fotos pesan megas— y se sube sola en cuanto
// hay red.
const COLA_DB='reparto_cola_v1', COLA_ST='pendientes';
let PENDIENTES={};        // clave -> reg guardado en el movil, todavia sin subir
let subiendoCola=false;

function _idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(COLA_DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(COLA_ST))
      r.result.createObjectStore(COLA_ST,{keyPath:'clave'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function _idbReq(modo, fn){
  return _idb().then(db=>new Promise((res,rej)=>{
    const req=fn(db.transaction(COLA_ST,modo).objectStore(COLA_ST));
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  }));
}
const colaGuardar = it => _idbReq('readwrite', st=>st.put(it));
const colaListar  = ()  => _idbReq('readonly',  st=>st.getAll());
const colaBorrar  = k   => _idbReq('readwrite', st=>st.delete(k));

async function cargarPendientes(){
  PENDIENTES={};
  try{ (await colaListar()).forEach(it=>{ PENDIENTES[it.clave]=it.reg; }); }catch(e){}
}

// Sube lo que quedo pendiente. Se llama al arrancar, al volver la red y a mano.
async function subirCola(silencioso){
  if(subiendoCola || !DB) return null;
  let items=[]; try{ items=await colaListar(); }catch(e){ return null; }
  if(!items.length) return null;
  subiendoCola=true;
  if(!silencioso) $('avisoCola').textContent='Subiendo '+items.length+' entrega(s) pendiente(s)…';
  let subidas=0, fallos=0;
  for(const it of items){
    try{
      await ensureAuth();
      const reg=Object.assign({}, it.reg);
      if(!reg.firma_url && it.firma) reg.firma_url=await subirCloudinary(it.firma, it.reg.enc, 'firma');
      if(!reg.foto_url  && it.foto)  reg.foto_url =await subirCloudinary(it.foto,  it.reg.enc, 'foto');
      await DB.collection('entregas').doc(it.clave).set(reg);
      ENTREGAS[it.clave]=reg;
      await colaBorrar(it.clave);
      delete PENDIENTES[it.clave];
      subidas++;
    }catch(e){ fallos++; }
  }
  subiendoCola=false;
  pintarLista(); pintarRegistro();
  return {subidas, fallos};
}

// Cuando el movil recupera cobertura, se sube solo.
window.addEventListener('online', ()=>subirCola(true));

// Ver la explicación en repartos-v2-propuesta/parche_equipo.py.
const DOMINIO_EQUIPO='equipo.donacol.es';
let USUARIO=null, PERFIL=null, EQUIPO=[], ASIG={}, EQ_DIA='', EQ_MODO='entrar';
let SOLO_MIOS=true; try{ SOLO_MIOS=localStorage.getItem('reparto_solo_mios')!=='0'; }catch(e){}
let VER_UID='';   // ruta de otra persona (el administrador o quien quiera mirar la de un compañero)
function uidRuta(){ return VER_UID || (esRepartidor() && SOLO_MIOS ? USUARIO.uid : ''); }
try{ ASIG=JSON.parse(localStorage.getItem('reparto_asig')||'{}'); }catch(e){ ASIG={}; }   // última copia, para sin cobertura
const COLORES_EQUIPO=['#2F6C7A','#B4543A','#4D7A3A','#6D4E9C','#B07A1E','#3E5C9A'];
function colorDe(uid){ const i=EQUIPO.findIndex(p=>p.uid===uid); return COLORES_EQUIPO[(i<0?0:i)%COLORES_EQUIPO.length]; }
function iniciales(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase(); }
function esRepartidor(){ return !!(USUARIO && PERFIL && PERFIL.rol==='repartidor'); }
function asignacionDe(ev){ return ASIG[claveEntrega(ev)]||null; }
function usuarioACorreo(u){ return String(u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@'+DOMINIO_EQUIPO; }
async function llaveEquipo(){
  let k=null; try{ k=localStorage.getItem('eventos_clave'); }catch(e){}
  if(!k) return '';
  const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('repartidores:'+k.toLowerCase()));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function errorAuth(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Usuario o contraseña incorrectos.';
  if(/email-already-in-use/.test(c)) return 'Ese usuario ya existe. Elige otro o entra con él.';
  if(/weak-password/.test(c)) return 'La contraseña tiene que tener al menos 6 caracteres.';
  if(/invalid-email/.test(c)) return 'El usuario solo puede llevar letras, números, puntos o guiones.';
  if(/network/.test(c)) return 'Sin conexión. Inténtalo con cobertura.';
  if(/too-many-requests/.test(c)) return 'Demasiados intentos. Espera un par de minutos.';
  if(/operation-not-allowed/.test(c)) return 'El acceso con contraseña aún no está activado. Avisa a la oficina.';
  if(/permission/.test(c)) return 'No tienes permiso. Abre antes la app con el enlace completo de la oficina.';
  return (e&&e.message)||'No se pudo completar.';
}

// --- Sesión ---
function pintarChip(){
  const b=$('btnPerfil'); if(!b) return;
  if(USUARIO && PERFIL){ b.className='perfil-chip'; b.innerHTML='<i>'+esc(iniciales(PERFIL.nombre))+'</i>'+esc(PERFIL.nombre.split(' ')[0]); }
  else { b.className='perfil-chip fuera'; b.textContent='Entrar'; }
  b.onclick=()=>verVista('equipo');
}
let _desuscribir=[];
function iniciarEquipo(){
  if(!DB || !firebase.auth) return;
  firebase.auth().onAuthStateChanged(async u=>{
    _desuscribir.forEach(f=>{ try{f();}catch(e){} }); _desuscribir=[];
    USUARIO=(u && !u.isAnonymous)?u:null; PERFIL=null; EQUIPO=[];
    if(USUARIO){
      try{ const d=await DB.collection('repartidores').doc(USUARIO.uid).get(); PERFIL=d.exists?d.data():null; }catch(e){}
      if(!PERFIL) EQ_MODO='perfil';
      _desuscribir.push(DB.collection('repartidores').onSnapshot(sn=>{
        EQUIPO=[]; sn.forEach(d=>EQUIPO.push(Object.assign({uid:d.id}, d.data())));
        EQUIPO.sort((a,b)=>(a.rol===b.rol?0:(a.rol==='repartidor'?-1:1)) || String(a.nombre).localeCompare(String(b.nombre)));
        const yo=EQUIPO.find(p=>p.uid===USUARIO.uid); if(yo) PERFIL=yo;
        pintarChip(); pintarEquipo(); pintarLista();
      }, ()=>{}));
    }
    // Las asignaciones las ve cualquiera con la app (también sin cuenta): así la ruta dice quién lleva cada pedido
    try{
      await ensureAuth();
      _desuscribir.push(DB.collection('asignaciones').where('fecha','>=',hoyISO()).onSnapshot(sn=>{
        const nuevo={}; sn.forEach(d=>{ nuevo[d.id]=d.data(); }); ASIG=nuevo;
        try{ localStorage.setItem('reparto_asig', JSON.stringify(ASIG)); }catch(e){}
        pintarEquipo(); pintarLista(); pintarDetAsig();
      }, ()=>{}));
      // ENTREGAS EN DIRECTO: lo que entrega cada repartidor aparece al momento en los demás móviles.
      // Se vuelve a poner con cada cambio de sesión (al cerrar sesión, Firebase corta las escuchas).
      const desde=(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
      _desuscribir.push(DB.collection('entregas').where('fecha','>=',desde).onSnapshot(sn=>{
        let cambia=false, abierta=false;
        sn.docChanges().forEach(ch=>{ if(ch.type!=='removed'){ ENTREGAS[ch.doc.id]=ch.doc.data(); cambia=true;
          if(pedidoActual && ch.doc.id===claveEntrega(pedidoActual)) abierta=true; } });
        if(cambia){ pintarLista(); pintarRegistro(); pintarEquipo(); }
        // La ficha abierta se pone al día si su entrega llega mientras se mira
        if(abierta){ const en=entregaDe(pedidoActual); if(en) mostrarEntregado(en, estaPendiente(pedidoActual)); }
      }, ()=>{}));
    }catch(e){}
    pintarChip(); pintarEquipo(); pintarLista();
  });
}

// Botones de asignar un reparto (los mismos en Equipo, en la Ruta y en la ficha)
function botonesAsig(e){
  if(!USUARIO || !PERFIL) return '';
  const a=asignacionDe(e), uid=(a&&a.uid)||'', clave=claveEntrega(e), mio=uid===USUARIO.uid;
  const reps=EQUIPO.filter(p=>p.rol==='repartidor');
  let b='';
  if(PERFIL.rol==='repartidor' && !mio) b+=`<button class="prim" data-asignar="${esc(clave)}" data-a="${esc(USUARIO.uid)}">${uid?'Me lo quedo yo':'Me lo llevo'}</button>`;
  reps.filter(p=>p.uid!==uid && !(PERFIL.rol==='repartidor' && p.uid===USUARIO.uid))
      .forEach(p=>{ b+=`<button data-asignar="${esc(clave)}" data-a="${esc(p.uid)}">${uid?'Pasar a ':'Para '}${esc(p.nombre.split(' ')[0])}</button>`; });
  if(uid) b+=`<button data-asignar="${esc(clave)}" data-a="">Dejar sin asignar</button>`;
  return b;
}
function activarBotonesAsig(cont){
  cont.querySelectorAll('[data-asignar]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); asignar(b.dataset.asignar, b.dataset.a, b); });
}

function pintarDetAsig(){
  const c=$('detAsig'); if(!c || !pedidoActual) return;
  if(!USUARIO || !PERFIL || normCiudad(pedidoActual.ciudad)!=='Zaragoza'){ c.innerHTML=''; return; }
  const a=asignacionDe(pedidoActual), uid=(a&&a.uid)||'';
  c.innerHTML=`<div class="eq-pedido" style="--quien:${uid?colorDe(uid):'var(--amb)'};margin:0 0 16px">
    <span class="eq-quien ${uid?'':'libre'}" style="--quien:${uid?colorDe(uid):''};margin-top:0">${uid?(uid===USUARIO.uid?'Lo llevas tú':'Lo lleva '+esc(a.nombre||'')):'Sin asignar'}</span>
    <div class="eq-acciones">${botonesAsig(pedidoActual)}</div></div>`;
  activarBotonesAsig(c);
}

// --- Pantalla Equipo ---
function diasZaragoza(){
  return [...new Set(REPARTOS.filter(e=>e.fecha>=hoyISO() && normCiudad(e.ciudad)==='Zaragoza').map(e=>e.fecha))].sort();
}
function pintarEquipo(){
  const c=$('equipo'); if(!c || !document.body.classList.contains('vista-equipo')) return;
  if(!USUARIO){ c.innerHTML=formAcceso(); activarAcceso(); return; }
  if(!PERFIL){ c.innerHTML=formPerfil(); activarPerfil(); return; }
  const dias=diasZaragoza();
  const man=(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  if(!EQ_DIA || !dias.includes(EQ_DIA)){
    const hoy=hoyISO();
    const quedanHoy=REPARTOS.some(e=>e.fecha===hoy && normCiudad(e.ciudad)==='Zaragoza' && !entregaDe(e));
    EQ_DIA = (quedanHoy && dias.includes(hoy)) ? hoy : (dias.includes(man) ? man : (dias[0]||''));
  }
  const reps=EQUIPO.filter(p=>p.rol==='repartidor');
  let h=`<h2>Equipo</h2><p class="eq-sub">Hola, <b>${esc(PERFIL.nombre)}</b>${PERFIL.rol==='admin'?' (administrador)':''}. Repartos de Zaragoza: cada uno se queda los suyos y la app le hace su ruta.</p>`;
  if(!dias.length){ c.innerHTML=h+'<p class="vacio">No hay repartos pendientes en Zaragoza.</p>'+pieEquipo(); activarPie(); return; }
  h+='<div class="eq-dias">'+dias.map(d=>`<button data-dia="${d}" class="${d===EQ_DIA?'on':''}">${esc(capital(etiquetaBonita(d).replace('Paradas de hoy','Hoy')))}</button>`).join('')+'</div>';
  const delDia=REPARTOS.filter(e=>e.fecha===EQ_DIA && normCiudad(e.ciudad)==='Zaragoza')
    .sort((a,b)=>(minutosHora(a.hora)-minutosHora(b.hora))||(finFranja(a)-finFranja(b))||a.enc.localeCompare(b.enc));
  // Resumen: cuántos lleva cada uno y a qué hora sale
  h+='<div class="eq-resumen">';
  reps.forEach(p=>{
    const suyos=delDia.filter(e=>{const a=asignacionDe(e);return a&&a.uid===p.uid;});
    const sals=salidasDe(suyos).filter(t=>!t.sinHora);
    const hechos=suyos.filter(e=>entregaDe(e)).length;
    const txt=suyos.length ? `${hechos} de ${suyos.length} entregados · ${sals.length} ${sals.length===1?'salida':'salidas'}${sals.length?' · sale '+hhmm(sals[0].sale):''}` : 'Sin repartos';
    h+=`<div class="eq-persona"><i style="background:${colorDe(p.uid)}">${esc(iniciales(p.nombre))}</i><div><b>${esc(p.nombre)}${p.uid===USUARIO.uid?' (tú)':''}</b><span>${txt}${p.furgoneta?' · furgoneta '+esc(p.furgoneta):''}</span></div>`
      +(suyos.length?`<button class="boton" data-ruta="${esc(p.uid)}">${p.uid===USUARIO.uid?'Mi ruta':'Su ruta'}</button>`:'')+'</div>';
  });
  const libres=delDia.filter(e=>{const a=asignacionDe(e);return !a||!a.uid;}).length;
  h+=`<div class="eq-persona"><i style="background:var(--amb)">?</i><div><b>Sin asignar</b><span>${libres} ${libres===1?'reparto':'repartos'}</span></div></div></div>`;
  if(!reps.length) h+='<p class="aviso">Todavía no hay ningún repartidor con perfil. Cuando Kevin y Luis Miguel creen el suyo, aparecerán aquí.</p>';
  // Lista de repartos del día con sus botones
  delDia.forEach(e=>{
    const a=asignacionDe(e), uid=(a&&a.uid)||'', hc=horaCorta(e.hora), clave=claveEntrega(e);
    const mio=uid===USUARIO.uid, quien=uid?(EQUIPO.find(p=>p.uid===uid)||{nombre:a.nombre}):null;
    const botones=botonesAsig(e);
    const ult=(a&&a.historial&&a.historial.length)?a.historial[a.historial.length-1]:null;
    h+=`<div class="eq-pedido" data-abrir-enc="${esc(e.enc)}" data-abrir-fecha="${esc(e.fecha||'')}" style="--quien:${uid?colorDe(uid):'var(--amb)'}">
      <span class="ver">${ICO.chevron}</span>
      <div class="fila"><span class="h">${esc(hc.ini||'—')}</span><div><b>${esc(nombreParada(e))}</b><span class="d">${esc(e.direccion||'Sin dirección')}</span></div></div>
      <span class="eq-quien ${uid?'':'libre'}" style="--quien:${uid?colorDe(uid):''}">${uid?(mio?'Lo llevas tú':'Lo lleva '+esc(quien.nombre||'')):'Sin asignar'}</span>
      ${entregaDe(e)?`<span class="chip ok">Entregado a las ${esc(entregaDe(e).hora_entrega||'')}${entregaDe(e).repartidor?' por '+esc(entregaDe(e).repartidor):''}</span>`:''}
      <div class="eq-acciones">${botones}</div>
      ${ult?`<p class="eq-hist">${esc(ult.texto||'')}</p>`:''}
    </div>`;
  });
  c.innerHTML=h+pieEquipo();
  c.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{ EQ_DIA=b.dataset.dia; pintarEquipo(); });
  activarBotonesAsig(c);
  c.querySelectorAll('[data-abrir-enc]').forEach(t=>t.onclick=ev=>{
    if(ev.target.closest('button')) return;   // los botones de asignar van aparte
    abrir(t.dataset.abrirEnc, t.dataset.abrirFecha); });
  c.querySelectorAll('[data-ruta]').forEach(b=>b.onclick=()=>{
    const uid=b.dataset.ruta; CIUDAD='Zaragoza';
    if(uid===USUARIO.uid){ VER_UID=''; SOLO_MIOS=true; } else VER_UID=uid;
    try{ localStorage.setItem('reparto_solo_mios', SOLO_MIOS?'1':'0'); localStorage.setItem('reparto_ciudad','Zaragoza'); }catch(e){}
    pintarFiltros(); pintarLista(); verVista('ruta'); });
  activarPie();
}
function pieEquipo(){
  return `<div class="eq-card"><b>${esc(PERFIL.nombre)}</b><br><span class="eq-sub">Usuario: ${esc(PERFIL.usuario||'')} · ${PERFIL.rol==='admin'?'Administrador':'Repartidor'}${PERFIL.furgoneta?' · furgoneta '+esc(PERFIL.furgoneta):''}</span>
    <button class="eq-enlace" id="eqEditar">Cambiar mis datos</button><button class="eq-enlace" id="eqSalir">Cerrar sesión</button></div>`;
}
function activarPie(){
  const s=$('eqSalir'); if(s) s.onclick=async()=>{ if(!confirm('¿Cerrar sesión en este móvil?')) return;
    await firebase.auth().signOut(); _sesionLista=null; EQ_MODO='entrar'; ensureAuth(); };
  const e=$('eqEditar'); if(e) e.onclick=()=>{ const c=$('equipo'); c.innerHTML=formPerfil(PERFIL); activarPerfil(PERFIL); };
}

// Asignar o traspasar (a '' = dejar sin asignar). Se guarda quién lo hizo y cuándo.
async function asignar(clave, aUid, boton){
  const ev=REPARTOS.find(e=>claveEntrega(e)===clave); if(!ev) return;
  const destino=aUid?EQUIPO.find(p=>p.uid===aUid):null;
  const antes=ASIG[clave]||null;
  const de=antes&&antes.uid?(antes.nombre||''):'';
  const texto = !aUid ? `${PERFIL.nombre} lo dejó sin asignar`
              : (aUid===USUARIO.uid ? (de?`${PERFIL.nombre} se lo quedó (era de ${de})`:`${PERFIL.nombre} se lo llevó`)
                                    : `${PERFIL.nombre} se lo pasó a ${destino?destino.nombre:''}`);
  const doc={fecha:ev.fecha, enc:ev.enc, uid:aUid||'', nombre:destino?destino.nombre:'',
             por:USUARIO.uid, porNombre:PERFIL.nombre, ts:new Date().toISOString(),
             historial:firebase.firestore.FieldValue.arrayUnion({texto, ts:new Date().toISOString()})};
  if(boton){ boton.disabled=true; boton.textContent='Guardando…'; }
  try{ await DB.collection('asignaciones').doc(clave).set(doc,{merge:true}); }
  catch(e){ alert('No se pudo guardar: '+errorAuth(e)); pintarEquipo(); }
}

// --- Entrar / crear perfil ---
function formAcceso(){
  const crear=EQ_MODO==='crear';
  return `<h2>${crear?'Crear perfil':'Entrar'}</h2>
  <p class="eq-sub">${crear?'Solo la primera vez. Después la app te recuerda en este móvil.':'Con tu usuario y contraseña del equipo de reparto.'}</p>
  <div class="eq-card">
    ${crear?`<label for="eqNombre">Tu nombre</label><input class="campo" id="eqNombre" autocomplete="name" autocapitalize="words" placeholder="Nombre y apellido">`:''}
    <label for="eqUsuario">Usuario</label><input class="campo" id="eqUsuario" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Por ejemplo: kevin">
    <label for="eqClave">Contraseña</label><input class="campo" id="eqClave" type="password" autocomplete="${crear?'new-password':'current-password'}" placeholder="${crear?'Mínimo 6 caracteres':''}">
    ${crear?`<label for="eqClave2">Repite la contraseña</label><input class="campo" id="eqClave2" type="password" autocomplete="new-password">`:''}
    <label class="eq-recordar"><input type="checkbox" id="eqRecordar" checked> Recordarme en este móvil</label>
    <button class="boton" id="eqEntrar">${crear?'Crear y entrar':'Entrar'}</button>
    <p class="eq-error" id="eqError"></p>
    <button class="eq-enlace" id="eqCambiar">${crear?'Ya tengo perfil: entrar':'¿Primera vez? Crear mi perfil'}</button>
  </div>`;
}
function activarAcceso(){
  $('eqCambiar').onclick=()=>{ EQ_MODO=EQ_MODO==='crear'?'entrar':'crear'; pintarEquipo(); };
  $('eqEntrar').onclick=async()=>{
    const err=$('eqError'), u=$('eqUsuario').value.trim(), cl=$('eqClave').value;
    err.textContent='';
    if(!/^[a-zA-Z0-9._-]{3,30}$/.test(u)){ err.textContent='El usuario: de 3 a 30 letras o números, sin espacios.'; return; }
    const crear=EQ_MODO==='crear';
    if(crear){
      if(($('eqNombre').value.trim()).length<2){ err.textContent='Escribe tu nombre.'; return; }
      if(cl.length<6){ err.textContent='La contraseña tiene que tener al menos 6 caracteres.'; return; }
      if(cl!==$('eqClave2').value){ err.textContent='Las dos contraseñas no coinciden.'; return; }
      if(!(await llaveEquipo())){ err.textContent='Primero desbloquea los pedidos con el enlace completo de la oficina (pestaña Ruta).'; return; }
    }
    $('eqEntrar').disabled=true; $('eqEntrar').textContent=crear?'Creando…':'Entrando…';
    try{
      await firebase.auth().setPersistence($('eqRecordar').checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      if(crear){
        sessionStorage.setItem('eq_nombre_nuevo', $('eqNombre').value.trim());
        await firebase.auth().createUserWithEmailAndPassword(usuarioACorreo(u), cl);
      } else {
        await firebase.auth().signInWithEmailAndPassword(usuarioACorreo(u), cl);
      }
    }catch(e){ err.textContent=errorAuth(e); $('eqEntrar').disabled=false; $('eqEntrar').textContent=crear?'Crear y entrar':'Entrar'; }
  };
}
function formPerfil(p){
  const nombre=(p&&p.nombre)||sessionStorage.getItem('eq_nombre_nuevo')||'';
  const rol=(p&&p.rol)||'repartidor', furgo=(p&&p.furgoneta)||'';
  return `<h2>${p?'Mis datos':'Tu perfil'}</h2><p class="eq-sub">${p?'Puedes cambiarlos cuando quieras.':'Un último paso: cuéntanos quién eres.'}</p>
  <div class="eq-card">
    <label for="pfNombre">Nombre</label><input class="campo" id="pfNombre" value="${esc(nombre)}" autocapitalize="words" placeholder="Nombre y apellido">
    <label>¿Qué haces?</label>
    <div class="eq-seg" id="pfRol"><button type="button" data-v="repartidor" class="${rol==='repartidor'?'on':''}">Reparto</button><button type="button" data-v="admin" class="${rol==='admin'?'on':''}">Administrador</button></div>
    <label>Furgoneta</label>
    <div class="eq-seg" id="pfFurgo"><button type="button" data-v="pequeña" class="${furgo==='pequeña'?'on':''}">Pequeña</button><button type="button" data-v="grande" class="${furgo==='grande'?'on':''}">Grande</button><button type="button" data-v="" class="${furgo?'':'on'}">Cualquiera</button></div>
    <label for="pfTel">Teléfono <small style="font-weight:500;color:var(--suave)">(opcional)</small></label><input class="campo" id="pfTel" type="tel" value="${esc((p&&p.telefono)||'')}" placeholder="600 000 000">
    <button class="boton" id="pfGuardar">${p?'Guardar':'Empezar'}</button>
    <p class="eq-error" id="pfError"></p>
    ${p?'<button class="eq-enlace" id="pfVolver">Volver</button>':''}
  </div>`;
}
function activarPerfil(p){
  ['pfRol','pfFurgo'].forEach(id=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
  if($('pfVolver')) $('pfVolver').onclick=()=>pintarEquipo();
  $('pfGuardar').onclick=async()=>{
    const err=$('pfError'), nombre=$('pfNombre').value.trim().replace(/\s+/g,' ');
    if(nombre.length<2 || nombre.length>40){ err.textContent='Escribe tu nombre (de 2 a 40 letras).'; return; }
    const datos={nombre, rol:$('pfRol').querySelector('.on').dataset.v, furgoneta:$('pfFurgo').querySelector('.on').dataset.v,
                 telefono:$('pfTel').value.trim().slice(0,20), ciudad:'Zaragoza'};
    $('pfGuardar').disabled=true;
    try{
      const ref=DB.collection('repartidores').doc(USUARIO.uid);
      if(p){ await ref.update(datos); }
      else {
        datos.usuario=(USUARIO.email||'').split('@')[0]; datos.creado=new Date().toISOString(); datos.llave=await llaveEquipo();
        await ref.set(datos);
      }
      PERFIL=Object.assign({}, PERFIL||{}, datos); sessionStorage.removeItem('eq_nombre_nuevo');
      pintarChip(); pintarEquipo(); pintarLista();
    }catch(e){ err.textContent=errorAuth(e); $('pfGuardar').disabled=false; }
  };
}

// iPhone: con qué app se abren las rutas (Google Maps por defecto; Apple Maps si no lo tienen)
function pintarPrefMapas(){
  const c=$('prefMapas'); if(!c || !SO_IOS) return;
  const g=prefMapas()==='google';
  c.hidden=false;
  c.innerHTML='Las rutas se abren en <b>'+(g?'Google Maps':'Apple Maps')+'</b>. <button type="button" id="btnPrefMapas">Usar '+(g?'Apple Maps':'Google Maps')+'</button>';
  $('btnPrefMapas').onclick=()=>{ try{ localStorage.setItem('pref_mapas', g?'apple':'google'); }catch(e){} pintarPrefMapas(); };
}

// ---------- Confirmar entrega ----------
$('btnConfirmar').onclick=async ()=>{
  if(!pedidoActual)return;
  const receptor=$('receptor').value.trim();
  if(!receptor){$('estadoMsg').textContent='Escribe el nombre de quien recibe el pedido.';$('receptor').classList.add('error');$('receptor').scrollIntoView({block:'center'});$('receptor').focus();return;}
  if(!hayFirma){$('estadoMsg').textContent='Falta la firma del cliente.';document.querySelector('.firmaWrap').classList.add('error');document.querySelector('.firmaWrap').scrollIntoView({block:'center'});return;}

  const ev=pedidoActual, enc=ev.enc, clave=claveEntrega(ev);
  const obs=$('obs').value.trim();
  $('btnConfirmar').disabled=true;
  $('btnConfirmar').textContent='Guardando…';
  $('estadoMsg').textContent='Preparando…';

  const firmaBlob=await canvasABlob();
  const f=$('fotoInput').files;
  const fotoFile=(f&&f.length)?f[0]:null;
  const geo=await ubicacion();
  const reg={
    enc, empresa:ev.empresa||'', fecha:ev.fecha||'', direccion:ev.direccion||'',
    hora_prevista:ev.hora||'', pax:ev.pax||0, menu:ev.menu||'',
    receptor, observaciones:obs, firma_url:'', foto_url:'',
    hora_entrega:ahoraTexto(), entregado_en:new Date().toISOString(),
    geo: geo||null
  };
  if(USUARIO && PERFIL){ reg.repartidor=PERFIL.nombre||''; reg.repartidor_uid=USUARIO.uid; }

  // Guardar en el movil. Es el ultimo recurso, y NUNCA debe fallar en silencio:
  // aqui ya hay una firma de un cliente de por medio.
  async function guardarEnElMovil(){
    try{
      await colaGuardar({clave, reg, firma:firmaBlob, foto:fotoFile});
      PENDIENTES[clave]=reg;
      $('estadoMsg').textContent='Entrega guardada en el móvil. Se subirá sola en cuanto haya cobertura.';
      mostrarEntregado(reg, true);
      pintarLista(); pintarRegistro();
      return true;
    }catch(e){
      $('btnConfirmar').disabled=false;
      $('btnConfirmar').textContent='Confirmar entrega';
      $('estadoMsg').textContent='No se pudo guardar ni en el móvil ('+e.message+'). No cierres esta pantalla.';
      return false;
    }
  }

  if(!DB || !navigator.onLine){ await guardarEnElMovil(); return; }

  try{
    await ensureAuth();
    $('estadoMsg').textContent='Subiendo firma…';
    reg.firma_url=await subirCloudinary(firmaBlob, enc, 'firma');
    if(fotoFile){ $('estadoMsg').textContent='Subiendo foto…'; reg.foto_url=await subirCloudinary(fotoFile, enc, 'foto'); }
    $('estadoMsg').textContent='Registrando entrega…';
    await DB.collection('entregas').doc(clave).set(reg);
    ENTREGAS[clave]=reg;
    $('estadoMsg').textContent='Entrega registrada.';
    try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
    mostrarEntregado(reg);
    pintarLista(); pintarRegistro();
  }catch(e){
    // Falló la red a mitad: no se pierde nada, va a la cola.
    await guardarEnElMovil();
  }
};

// ---------- Cargar entregas ya hechas (Firestore) ----------
async function cargarEntregas(){
  if(!DB)return;
  await ensureAuth();
  return DB.collection('entregas').get().then(snap=>{
    ENTREGAS={}; AVISO_ENTREGAS='';
    snap.forEach(d=>{ ENTREGAS[d.id]=d.data(); });
  }).catch(e=>{ AVISO_ENTREGAS=(e&&e.message)||'error desconocido'; });
}

// ---------- Arranque ----------
(async()=>{
  const r=await descifrarEventos();
  if(r===null){
    $('pedidos').innerHTML='<div class="vacio">'+htmlDesbloqueo('Pedidos')+'</div>'; activarDesbloqueo();
    return;
  }
  // Solo REPARTOS (entregas a domicilio). Excluye montajes y también las RECOGIDAS
  // (el cliente recoge en el obrador → no hay reparto que hacer).
  REPARTOS=(r||[]).filter(esReparto);
  await cargarPendientes();   // lo que quedo sin subir en este movil
  await cargarEntregas();
  pintarFiltros();
  pintarLista();
  pintarRegistro();
  iniciarEquipo();            // cuenta del repartidor, equipo y asignaciones en directo
  pintarPrefMapas();
  subirCola(true);            // reintento silencioso al abrir
})();

// PWA offline + auto-actualización (coge la versión nueva sin reinstalar)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){
    r.update(); document.addEventListener('visibilitychange',function(){if(!document.hidden)r.update();});
  }).catch(function(){});
  var _swrel=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!_swrel){_swrel=true;location.reload();}});
}
